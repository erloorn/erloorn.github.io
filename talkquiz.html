은 이를 (                         ㉠   )(이)라고 요약하였는데, 겉으로는 환상의 테마파크처럼 꾸며져 있지만, 내부 시스템은 철저히 표준화, 규격화된 통제 메커니즘으로 굴러가는 (                ㉡     )의 공간을 뜻한다.","문제해결학습, 발견학습, 실험실습, 창의적 활동학습 중에서 교사의 통제가 가장 높은 것은 (      ㉢       )이고, 학생의 자율성이 가장 높은 것은 (             ㉣    )이다.","키리아쿠(Kyriacou)는 효과적인 설명의 특징으로 (                      ㉤      ), 구조, 길이, 주의, 언어, 사례 등을 제시하였다.","성종 대(1477년)에 완성된 '팔도지리지'는 현재 전하지 않고, 편찬 자료로 만들어졌던 '경상 도속찬지리지'만이 전한다. '팔도지리지'에 국왕인 성종의 뜻에 따라 우리나라 문사들의 시문을 모아 첨재한 것이 1481년(성종 12년)에 완성된 (                     ㉥    )이다.","실학의 선구자인 반계(磻溪) 유형원은 국토와 지역을 살피기 위해 많은 여행을 하였고, 지 리와 관련된 저술로 '군현제', '지리군서', (                    ㉦   ) 등의 저술을 남겼다. (       ㉦   )은/는 16 세기 후반부터 활발하게 만들어졌던 사찬 읍지의 성과를 수용한 것인데, 읍지가 지니는 지방 적 한계를 극복하고 전국적인 범위로 확대시켜 국가적인 차원에서 지역과 사회 현상을 올바르 게 파악하고, 파악된 문제들을 근본적으로 다루고자 하였다.","허브형 항로망은 (            ㉧       )와/과 (    ㉨   )을/를 구현할 수 있다. 여러 기종점을 잇는 교 통흐름이 하나의 허브로 수렴될 때 항공기의 좌석점유율이 올라가고, 승객당 비용이 낮아지므 로 (        ㉧       )이/가 구현될 수 있고, 허브형 구조가 더 많은 도시짝을 연결할 수 있으므로 동 시에 (           ㉨    ) 또한 구현 가능하다.","(       ㉩       )은/는 교육수준이 높거나 숙련된 인재들이 대면접촉으로 새로운 아이디어를 주고 받는 상호작용을 통해 대가를 지불하지 않고서도 생산성의 증대를 누리게 되는 것을 의미한 다.","(       ㉪       )은/는 원래 누군가에 의해 지배당하고 있는 영토라는 의미였으나 도시지리학적 맥락에서는, 어떤 집단이 사회 전체로 통합되기 전 단계에서 소수자로서 일시적으로 형성하고 있는 거주지 클러스터를 지칭한다.","산란은 부딪히는 입자 크기와 입사하는 전자기파 파장의 길이 사이 관계에 따라 (                                   ㉫ )와/과 미산란으로 구분한다. (                 ㉫      )은/는 입사하는 전자기파의 파장이 부딪히는 입자 직경 보다 큰 경우에 발생하는데, 푸른 하늘과 붉게 물든 저녁노을을 볼 수 있는 것이 이것 때문이 다.","기후 시스템은 대기권, 생물권, 암석권, 수권, 설빙권으로 구성되는데, 설빙권은 담수로 형 성된 (    ㉬   )와/과 염수로 형성된 (       ㉭   )(으)로 구분된다."],"a":{"㉠":"맥디즈니화(McDisneyfication)","㉡":"혼성성(hybridity)","㉢":"실험실습(laboratory work)","㉣":"창의적 활동학습(creative activity learning)","㉤":"명료성(clarity)","㉥":"동국여지승람(東國輿地勝覽)","㉦":"동국여지지(東國輿地志)","㉧":"밀도의 경제(economies of density)","㉨":"범위의 경제(economies of scope)","㉩":"인적자본의 외부효과(human capital externalities)","㉪":"거류지(colony)","㉫":"레일리산란(Rayleigh Scattering)","㉬":"육빙(land ice)","㉭":"해빙(sea ice)"},"e":"렐프(E.Relph)가 말한 '내부성(insideness)'의 의미를 약술하시오.","ea":"특정인이 장소에 대해 가지는 관여의 정도 또는 주관적인 경험을 의미한다."},"45":{"q":["북극진동(AO)지수가 양(+)의 단계일 때, 극지방의 기압은 평년보다 (                       ㉠    ), 중위도대에 서는 평년보다 (       ㉡       ), 제트류는 평년보다 (     ㉢   )진다. 차가운 극 공기는 북쪽에 갇히 게 되므로 중위도 지역은 평년에 비해 따뜻하고 건조한 날씨가 된다. 그리고 아열대 지방은 기압이 (      ㉣   )져 무역풍이 (       ㉤   )진다. (단, ㉠과 ㉡에는 '높고 또는 낮고'중에서, ㉢과 ㉤에는 '강해 또는 약해'중에서, ㉣에는 '높아 또는 낮아'중에서 선택하여 기입하세요^^)","(   ㉥   )은/는 대기가 데워져 중심부가 따뜻하고 주위가 차가운 온난 저기압이다. 동시에 상층으로 가면서 (          ㉦    )(으)로 변하여 대류권 하부에서만 저기압으로 관측되는 키작은 저 기압으로 주로 강한 일사에 의해 생성된다.","컨베이어 벨트 모형은 노르웨이 저기압 모형이 제안하는 (                      ㉧     )의 충돌이라는 거시적 측면에서의 접근 방식과 달리, 전선상에서의 좁은 공기의 흐름대인 기류를 세밀하게 분석하는 미시적인 접근 방식이다. 이 모형은 세 가지 핵심 기류인 (                   ㉨       ), 온난 컨베이어 벨트, 한 랭 컨베이어 벨트로 구성되어 있다.","한 지역의 탁월풍을 알기 위해서는 일반적으로 (                  ㉩   )을/를 사용한다. (         ㉩   )은/는 풍향의 빈도를 백분율로 계산하여 그 크기를 풍향별 막대로 표시하는데 보통 8방위 풍향을 사 용한다.","측정 대상을 반복적으로 측정할 때, 측정과 다음 측정 사이의 시간을 (                        ㉪     )(이)라고 한 다.","절대습도(absolute humidity)는 단위부피 당 수증기의 질량으로 압력과 기온의 변화에 영 향을 받기 때문에 (         ㉫     )와/과 (   ㉬   )을/를 대신 사용한다. (        ㉫       )은/는 수증기를 포함한 전체 공기 질량에 대한 수증기의 질량이다. 이에 반해 (                     ㉬     )은/는 건조 공기 질량 에 대한 수증기의 질량이다.","위도 30°C 해역의 수위가 높은 까닭은 (            ㉭   )에 의한 해수의 이동 때문이다."],"a":{"㉠":"낮고","㉡":"높고","㉢":"강해","㉣":"높아","㉤":"강해","㉥":"열저기압(thermal lows)","㉦":"고기압(anticyclone)","㉧":"기단(air mass)","㉨":"건조기류(dry airstream)","㉩":"바람장미(wind rose)","㉪":"주기(period)","㉫":"비습(specific humidity)","㉬":"혼합비(mixing ratio)","㉭":"에크만 수송(Ekman transport)"},"e":"산성비의 정의가 pH 농도 7이 아닌 pH 농도 5.6을 기준으로 하는 이유를 설명하시오.","ea":"대기 중에 존재하는 이산화탄소(CO₂)가 빗방울에 녹아 탄산(H₂CO₃)이 되기 때문이다."},"46":{"q":["화산암의 조암 광물은 크게 ( ㉠ )와/과 ( ㉡ )(으)로 구분되는데, ( ㉠ )에는 사장석, 정장 석, 석영 등이 있으며, 비중이 2.6~2.8로 작다. ( ㉡ )에는 감람석, 휘석, 흑운모 등이 있으며, 비중이 2.9~3.3으로 비교적 큰 편이다.","( ㉢ )은/는 전단력에 저항하는 힘으로 사면을 구성하고 있는 물질의 응집력, 마찰력, 부력, 구속력 등에 영향을 받는다.","기반암 하상에서 유수에 의한 마식으로 넓고 매끄러운 표면을 가진 기반암 침식면을 ( ㉣ )(이)라 한다.","( ㉤ )은/는 식생의 배후에 모래가 쌓인 작은 둔덕 모양의 사구로 식생이 바람의 진행에 장 애물 역할을 하기 때문에 생긴다. ( ㉥ )은/는 탁월풍이 계절에 따라 거의 정반대로 불기 때문 에 사구 정부의 위치가 계절에 따라 변화한다.","폭발식 분화는 육상에서만 있는 것은 아니며, 해저에서도 발생한다. ( ㉦ ) 분화가 그러한 예이다. 아이슬란드 남쪽 해안의 바다에서 수성분화가 일어나 새로운 섬인 ( ㉦ )이/가 만들어 진 일이 있었다. 이 섬의 이름을 따서 이와 같은 유형의 수성분화를 ( ㉦ ) 분화라 부르게 되 었다. 제주도의 일출봉, 수월봉 등도 이러한 수성분화에 의해 생성된 것으로 알려져 있다.","두 판이 서로 부딪히는 섭입대는 지진이 자주 발생하는데, 이러한 지진 발생의 측면을 강 조할 때, 섭입대는 미국 지진학자의 이름에서 유래한 ( ㉧ )(으)로 불리기도 한다.","( ㉨ )은/는 '나쁜 예술'의 미적 가치를 뜻하는 말로, 보통 저급한 속성을 가진 싸구려 문화 상품 등을 의미한다. 렐프(E.Relph)는 ( ㉨ )화된 장소를 상품화된 장소에 대한 대중적 소비욕 망에 의해 나타난 비진정한 태도라고 하였다.","주변부보다 거대 결절(node)인 핵심부가 더 많은 혜택을 받는 것을 ( ㉩ ) 효과가 한다.","뢰쉬(A.Losch)의 K = 12 계층구조에서 상위 중심지는 차하위 중심지 ( ㉪ )개를 완전 포섭 의 형태로, ( ㉫ )개를 1/2씩 분할 포섭의 형태로, 그리고 ( ㉬ )개를 1/3씩 분할 포섭의 형태 로 거느린다.","( ㉭ )은/는 서로의 시간을 교환하는 호혜적 노동의 구조를 통해 인간 중심의 경제 질서를 회복하려는 시도이다. 이는 금전적 보상에 의존하지 않고 공동체의 상호 돌봄을 가능하게 하 여, 지속가능한 지역사회 형성의 기반이 된다."],"a":{"㉠":"무색광물(無色鑛物)","㉡":"유색광물(有色鑛物)","㉢":"전단강도(shear strength)","㉣":"반석(strath surface)","㉤":"넵카(nebkha)","㉥":"역사구(reversing dune)","㉦":"섯지(Surtsey)","㉧":"베니오프대(Benioff zone)","㉨":"키치(Kitsch)","㉩":"허브(hub)","㉪":"7","㉫":"6","㉬":"6","㉭":"타임뱅크(timebank)"},"e":"애벌런치(avalanche)의 운동/이동 형식에 대해 설명하시오.","ea":"이동 초기에는 활동(slide)이지만 이동 과정에서 유동(flow)으로 전환된다."},"47":{"q":["지리학적 지식이 변화함에 따라 지리적 질문도 변화하는데, 경험주의 지리학에서는 ‘무엇’ 과 ‘( ㉠ )’라는 기술적인 질문이 중심이라면, 실증주의 지리학에서는 ‘왜’라는 ( ㉡ )을/를 찾 는 질문이 중심이 된다. 반면에 인간주의 지리학에서는 인간의 선호와 지각에 대한 질문, 급진 주의 지리학에서는 사회적 관계를 강조하는 질문이 우세하게 된다.","순수한 발견 학습은 취학 전 아동들에게는 적합할 수 있으나, 전형적인 초중등학교에서는 활동의 관리가 어렵고 비생산적인 경우가 많으므로, 교사가 방향을 제시해주는, 즉 비계가 제 공되는 ( ㉢ ) 발견 학습이 더 선호된다.","( ㉣ )은/는 어떤 상황에 대해 학생들이 근거있는 추측을 하게 하는 전략을 지칭하기 위해 만든 용어이다. 예를 들어, 사진 속 장소 추측하기, 영화에서 본 장소는 실제로 어떨지 추측하 기, 통계 추측하기 등이다. ( ㉣ )은/는 새로운 지식을 학습할 때 학습자가 가지고 있는 기존 지식의 활용을 강조하는 구성주의 학습 이론에 근거를 두고 있다. ( ㉣ )은/는 학습자의 선지 식이나 이해를 파악하는 데도 유용하며, 학생들의 궁금증을 유발하기에도 유용하게 활용된다.","최한기의 ( ㉤ )은/는 13권으로 구성되어 있는데, 이는 중국의 전통적 지리서인 ‘대청일통 지’, ‘해유록’과 마테오리치가 한역한 서학지리서인 ‘직방외기’, ‘곤여도설’, ‘천문략’ 그리고 청 대의 중국인이 저술한 ‘해국도지’와 ‘영환지략’들을 참조해 83개국을 다룬 세계지지이다.","( ㉥ )은/는 도시의 구조가 무작위적인 요소들의 집합으로 구성되어 있음을 지칭하는 용어 이다.","성장축 모형이 개념 또는 이론적 모형이라면, ( ㉦ ) 모형은 경험적 관찰과 자료에 기반하 고 있다. 이 모델은 공업 생산에 특화된 대도시들은 새로운 서비스 경제에 느리고 어려운 적 응 과정을 거쳤다는 것과 대기업들은 많은 종류의 고급 서비스 또는 생산자 서비스가 필요하 다고 주장한다.","암석권 또는 지각은 고체임에도 불구하고 아래에 위치한 연약권 또는 상부 맨틀에 비해 밀 도가 낮기 때문에 유체로 반응하는 연약권 위에 마치 떠 있는 것과 같은 상태를 가지면서 연 약권 위에서 이동하게 된다. 이렇게 지각 또는 암석권이 맨틀 또는 연약권 위에서 떠 있는 것 과 같은 형태로 수직적 균형을 이루고 있는 상태를 ( ㉧ )(이)라고 한다.","( ㉨ ) 또는 후빙기(postglacial age)는 중위도에서 대륙 빙하가 완전히 사라진 이후의 시기 로서, ( ㉩ )이/가 끝난 약 11,700년 전 이후부터 현재까지의 기간에 해당한다.","( ㉪ )은/는 강수량보다 증발량이 많은 반건조 지역에서 주로 나타나는 토양 생성 작용이 다. 대표적인 토양은 체르노젬(chernozem)으로, 중위도의 반건조 지역에서 염기와 부식이 풍 부한 검은색의 비옥한 토양이다.","빙하는 공급이 지속적으로 일어나는 상부의 ( ㉫ )와/과 빙하의 상실이 일어나는 하부의 ( ㉬ )(으)로 구분되며, 두 지역 사이의 경계를 균형선(equilibrium line, 평형선)이라 한다. 대체 로 균형선 고도는 ( ㉭ ) 고도로 판단하는데, 강설량, 기온, 일사량, 바람, 사면의 향에 따라 변 화한다."],"a":{"㉠":"어디(where)","㉡":"과학적 법칙(scientific laws)","㉢":"안내된(guided)","㉣":"영리한 추측(intelligent guesswork)","㉤":"지구전요(地球典要)","㉥":"키노 자본주의(keno capitalism)","㉦":"스탠백(Stanback)","㉧":"지각 평형(isostasy)","㉨":"홀로세(Holocene)","㉩":"영거드라이아스(Younger Dryas)","㉪":"석회화 작용(calcification, 탄산염화 작용)","㉫":"집적대(accumulation zone)","㉬":"소모대(ablation zone)","㉭":"설선(snow line)"},"e":"대기 대순환을 설명하기 위한 페렐(W.Ferrel)의 3세포 모델의 문제점 두 가지를 제시하시오.","ea":"각 세포들 간의 에너지 교환을 설명하기 어렵고, 중위도 지역은 대류권 상층과 하층 모두 편 서풍대가 우세하므로 페렐 순환은 나타나기 어렵다."},"48":{"q":["문화전파의 확산을 가로막고 지체시키는 힘이 작동하는데 이를 ( ㉠ )(이)라 하고, 문화전파 가 발생하여 특정 사회 또는 관련된 사회에 의미있는 변화가 초래되는 현상을 ( ㉡ )(이)라고 한다.","도린 매시는 장조 내부와 외부의 경계를 강조하는 ( ㉢ )을/를 거부하고 그 대안으로 글로 벌 장소감을 대안으로 제시하였다. 글로벌 장소감은 외부에 열려 있는 외향적 장소감인 반면 에 ( ㉢ )은/는 외부에 닫혀 있는 내향적 장소감이다.","이슬람교, 크리스트교, 유대교 모두 ( ㉣ ) 계통의 종교로 분류되는데, 이들 모두 ( ㉣ )을/ 를 신앙의 시조로 공유한다는 공통점이 있다.","언어의 계통을 분류하는 대표적인 방법인 ( ㉤ )은/는 어파와 어군보다 상위 개념이다. 반 면, ( ㉥ )은/는 특정 인구 집단 내에서 통용되는 언어를 뜻한다.","( ㉦ )(이)란 국지적 단위에서 관찰된 현상, 데이터 또는 사회적 실천을 더 넓은 광역적 규 모나 세계적 규모로 확장 및 통합하는 작업을 뜻한다. 우리나라의 문화재가 세계문화유산으로 인증을 받게 되는 것도 ( ㉦ )에 해당된다.","불교는 남방불교, 소승불교라고 불리는 상좌부불교와 중생 구제를 지향하는 대승 불교, 그 리고 라마교로 불리는 ( ㉧ )로 구분된다.","집약적 곡물 농업은 병충해 발생을 억제하고 토양의 지력을 유지하기 위해 (㉨ )을/를 활 용한다. 예를 들어 밀-콩-감자 등의 조합이나 밀-순무-보리 등의 조합이 일반적이다.","( ㉩ )은/는 빅데이터에서 유용한 정보를 뽑아내는 과정으로 연관규칙학습, 클러스터링, 분 류, 회귀분석 등의 기법을 사용하는데, 인간 행태의 패턴과 경향성, 연관성을 밝히는 데에 활 용된다.","( ㉪ )은/는 포르투갈, 이탈리아, 그리스, 스페인 등 유럽연합 회원국 중 2010년대 경제위 기를 겪은 남부유럽 4개 국가들을 의미하는 멸칭이다.","( ㉫ )은/는 인도네시아, 말레이시아, 싱가포르 등지에서 도시 계획이 적용되지 않은 상태 의 저소득층 주거지 또는 슬럼을 의미하는데, 본래 농촌적 성격이 강했지만 도시가 외연적으 로 확장되는 과정에서 도시에 통합되었다.","부르디외(P.Bourdieu)가 제시한 개념인 ( ㉬ )은/는 특정 유형의 환경을 구성하는 조건에 의해 생산되는 것으로, 실천과 재현을 발생시키고 구조화하는 원칙으로서 지속적이고 치환이 가능한 성향이다. 영어로는 ‘습관’이라는 의미라고 볼 수 있다.","( ㉭ )은/는 유럽과 일본에서 주로 논의되고 있는 도시 개발 개념으로 기존 도심지역이나 역세권과 같은 특정지역을 주거, 상업, 업무기능 등이 복합된 시설물로 고밀도 개발을 하여 주민들의 사회 경제적 활동을 집중시키고 많은 사람들이 그 지역으로 모여들게 하는 개발 방 식이다."],"a":{"㉠":"문화장벽(cultural barrier)","㉡":"문화접변(acculturation)","㉢":"반동적 장소감(reactionary sense of place)","㉣":"아브라함(Abraham)","㉤":"어족(language family)","㉥":"방언(dialect)","㉦":"스케일링업(scaling up)","㉧":"티베트불교(Tibetan Buddhism)","㉨":"윤작(돌려짓기, crop rotation)","㉩":"데이터마이닝(Data Mining)","㉪":"PIGS","㉫":"캄풍(Kampung, Kampong)","㉬":"아비투스(habitus)","㉭":"압축 도시(Compact City)"},"e":"도편각(圖偏角)과 도자각(圖磁角)을 비교 설명하시오.","ea":"도편각은 진북을 기준으로 도북까지의 측정각이고, 도자각은 도북을 기준으로 자북까지의 측 정각이다."},"49":{"q":["2022 개정교육과정 통합사회 1, ‘자연환경과 인간’ 단원의 내용 요소는 자연환경, 자연관, 환경문제, ( ㉠ )이다.","2022 개정교육과정 중학교 사회, ‘지리 인식’ 영역의 ‘지도를 비롯한 다양한 공간자료와 도구를 통한 지리 정보 수집은 장소와 지역의 여러 현상과 사건을 분석하고 해석하며 추론하는 데 필수적이다.’라는 핵심 아이디어에 포함된 내용 요소는 다양한 지리 정보와 매체 분석 및 활용, 지도 표현, ( ㉡ )이다.","2022 개정교육과정 세계시민과 지리 과목의 목표는 ‘세계시민과 지리는 세계 여러 지역의 자연환경과 인문환경을 체계적, 종합적으로 이해하고 지속가능한 미래 세계를 위해 현명한 가치 판단을 하며 적극적으로 행동하는 시민의 양성을 목표로 한다. 자연환경 및 인문환경의 ( ㉢ )을/를 염두에 둔 상호 공존의 세계를 추구하고, 빠르게 변화하는 현대 세계에 능동적으로 대처하며, ( ㉣ )을/를 포용하는 세계시민으로서 바람직한 가치관과 태도를 형성하고자 한다.’이다.","2022 개정교육과정 ( ㉤ ) 과목인 한국지리 탐구의 ‘생활 속 지리 탐구’ 단원의 내용 요소는 ‘식품과 상품사슬’, ‘관광과 여가, 장소 정체성과 장소마케팅’, ( ㉥ )이다.","2022 개정교육과정 도시의 미래 탐구 과목의 가치・태도 범주의 내용 요소는 ‘도시를 둘러싼 ( ㉦ )에 대한 다양한 관점과 가치 존중’, ‘도시에 사는 사람들의 문화적 다양성에 대한 이해와 공감’, ‘자신이 사는 지역과 도시 문제에 대한 관심과 책임감’, ‘공간 정의와 지속가능성, 공공성의 관점에서 도시의 미래를 탐구하는 태도’, ‘인간과 비인간의 유기적 관계를 자각하고 이를 실천하는 ( ㉧ )’, ‘도시 계획 수립과 도시 정책에 능동적으로 참여’ 등이다.","2022 개정교육과정 여행지리 과목의 ‘성찰과 공존을 위한 여행’ 단원의 내용 요소는 산업유산과 기념물 여행, ( ㉨ ), 새로운 여행 지역과 여행 콘텐츠, 지속가능한 여행 등이다.","2022 개정교육과정 기후변화와 지속가능한 세계 과목의 평가 방법에는 ‘지필 평가 외에 ( ㉩ )을/를 통해 자율적으로 기후 변화에 대응을 위한 개인적 활동을 실천과제로 수행할 수 있도록 한다.’가 포함되어 있다.","내이쉬(Naish)는 자동차 도로, 다리 등을 관찰할 수 있는 개념들이라고 하였고, 교통량, 거리마찰 등은 ( ㉪ ) 개념들이라고 하였다.","영국 국가교육과정의 지리 교과의 핵심프로세스는 지리탐구, 야외조사와 야외학습, ( ㉫ )와/과 비주얼 리터러시, 지리적 ( ㉬ )이다.","구성주의에서 바라보는 교육과정의 내용은 미리 결정된 지식이라기보다는 교사와 학생의 상호작용 및 의사결정과정을 통해 구성되는 ( ㉭ ) 지식의 특성을 가진다."],"a":{"㉠":"생태시민","㉡":"지리적 시각화","㉢":"공간적 다양성","㉣":"문화 다양성","㉤":"진로 선택","㉥":"모빌리티와 공유서비스","㉦":"지리적 쟁점","㉧":"생태적 감수성","㉨":"평화여행과 다크투어리즘","㉩":"프로젝트","㉪":"구체적","㉫":"도해력","㉬":"의사소통","㉭":"생성적"},"e":"과제분담 학습모형Ⅰ(직소Ⅰ)에서 나타나는 상호의존성의 경향을 설명하시오.","ea":"학습과제 해결을 위한 상호의존성은 높지만, 보상을 위한 상호의존성은 낮다."},"50":{"q":["앤더슨(B.Anderson)은 민족이 자연스럽게 존재해 온 혈연적 실체가 아니라 근대 이후 역 사적, 문화적 조건속에서 사람들이 머릿속으로 만들어낸 ( ㉠ )(라)고 정의했다.","투안(Tuan)은 ( ㉡ )을/를 인간이 특정한 물리적 환경에 대해 느끼는 깊은 정서적 유대감 이라고 정의하였다.","( ㉢ )(이)란 공간을 기호나 텍스트같은 ‘재현’으로 읽어내던 기존의 방식을 넘어, 언어로 포착되기 이전에 신체가 물리적 환경과 마주칠 때 발생하는 전인식적(pre-conscios) 반응에 주목하는 패러다임의 전환이다.","환촌은 주로 가축 사육과 외적의 방어와 관련하여 형성된 것인데, 그 중 남부 아프리카 초 원 지역에서 발달한 환촌을 ( ㉣ )촌이라 한다. ( ㉣ )촌의 중앙에는 여러 개의 가축 우리가 배치되어 야간에는 목장의 역할을 수행한다.","( ㉤ )(이)란 총 인구를 연령순으로 나열할 때 정중앙에 있는 사람의 해당 연령을 말하는 것으로, 일반적으로 연령 분포가 비대칭인 경우에 많이 사용된다.","( ㉥ )은/는 북아메리카의 북극해 연안에 사는 사람들이며, 유럽과 아시아의 북극해 연안에 사는 이들은 ‘라프’와 ‘사모예드’라 한다.","“스위스 사람이면서 또 제네바 사람일 수는 없잖아요”라고 말하는 아동은 공간 인지에 있 어서 ( ㉦ ) 위계관계의 의미를 파악하는데 어려움을 겪는다고 볼 수 있다.","캐틀링(Catling)은 피아제의 연구를 바탕으로 위상적(형상적) 단계를 ( ㉧ ) 공간이해 단계 로, 투영적 단계를 객관적 공간이해 단계로, 유클리디언 단계를 ( ㉨ ) 공간이해 단계로 공간 적 개념화의 발달 단계별 특성을 밝혔다.","하천의 하방 및 측방 침식 작용에 의해 형성된 하도 주변의 절벽을 ( ㉩)(이)라고 한다. ( ㉩ )은/는 하곡의 측사면 기저부에서 발생한 굴식에 의해 곡벽 아래에 안쪽으로 파인 와지인 ( ㉪ )이/가 커지면서 사면이 불안정해져 상부 암반이 무너져 내리는 과정을 통해 형성된다.","융빙수에 의한 홍수 현상은 아이슬란드어로 ( ㉫ )(이)라고 하는데, 화산지대의 지열로 인 해 빙하기저부가 녹으면서 홍수가 발생하며, 이로 인해 빙하 쇄설물이 하류로 운반되어 퇴적 된 빙하성 유수 퇴적평원을 ( ㉬ )(이)라고 한다.","침식 기준면의 변화로 중단되었던 하각 작용이 다시 시작되는 현상을 ( ㉭ )(이)라 한다."],"a":{"㉠":"상상 공동체(imagined community)","㉡":"장소애(topophilia)","㉢":"정동적 전환(affective turn)","㉣":"크랄(kraal 또는 kraul)","㉤":"중위연령(median age)","㉥":"이누이트(Inuit)","㉦":"포섭적","㉧":"자기중심적","㉨":"추상적","㉩":"하식애(river cliff)","㉪":"하식와(하식노치, stream erosional notch)","㉫":"요쿨흘라우프(jökulhlaup)","㉬":"잔더(sandur)","㉭":"회춘(rejuvenation)"},"e":"초크포인트(choke point)의 의미를 설명하시오.","ea":"물자 수송이나 군사 작전에서 중요한 가치를 지닌 지리적 결절점 또는 요충지이다."},"51":{"q":["톰슨(W.Thompson)은 기반/비기반의 이분법을 사용하여 도시 성장 시나리오를 제시하였 다. 그는 ( ㉠ ) 단계, 수출다변화 단계, 경제적 성숙 단계, 광역도시 단계, 기술적∙전문적 원 숙 단계 등으로 도시의 발전과정을 세분하여 설명하였다.","( ㉡ ) 이론의 대표이론가인 로스토(W.Rostow)는 경제발전단계를 전통사회, 도약의 전제조 건 마련 단계, 도약단계, 성숙단계, 대량소비 단계로 구분하였는데, 그는 ( ㉡ ) 과정은 경제성 장을 최우선 가치로 여기며 소득의 향상과 고용 기회의 증진을 도모하여, 이것이 사회의 가장 가난한 집단에게 흘러내려가는 ( ㉢ )을/를 가져올 것으로 가정했다.","( ㉣ )은/는 발전 정책에 대한 처방보다 개발도상국의 빈민이 겪는 실질적인 문제와 욕구 에 관심을 기울인다. ( ㉣ ) 접근은 1960~70년대의 기초수요(basic needs) 전략에서 나온 것 인데, 기초수요(basic needs)란 근대화 정책에서 배제되었던 빈곤층의 일상생활에 관심을 기 울이는 개념이다.","제도경제지리학은 지역 내 사회∙문화적 조건이 경제성장을 촉진하거나 방해하는 중요한 요소임을 강조하는 ( ㉤ )의 부상을 촉진했는데, ( ㉤ )은/는 각 도시와 지역이 스스로의 경제 발전 전략과 계획을 수립하여 경쟁력을 향상시키고 성장을 도모하는 것에 초점을 두며 특히 혁신, 학습, 기업가주의의 발전을 강조한다.","( ㉥ ) 효과란 법률이나 제도에서 본질은 다르지만 동일한 효과로 간주하여 적용하는 것을 의미한다.","19세기 산업 혁명기에는 특정 지역이 특정 산업 부문에 전문화되는 지역의 ( ㉦ ) 패턴이 뚜렷하게 나타났다. 이는 원료 도입에서 최종 생산에 이르는 전체 생산 과정이 한 지역에서 이루어지는 것을 특징으로 한다. 그러나 1960~70년대에는 네오포디즘이 부상하면서 산업 입 지는 주변부로의 공간적 분산 패턴을 보이기 시작했다. 생산 과정의 여러 부분들이 상이한 지 역에서 수행되는 ( ㉧ )이/가 나타났는데, 이런 변화는 지역 간 노동 비용 및 특성의 지리적 차이를 반영하였다. 예를 들어 영국의 제조업은 연구개발 기능은 잉글랜드 남동부가, 복잡한 제조 및 엔지니어링은 웨스트 미들랜드 등 기존의 제조업 지역에서, 단순 조립은 잉글랜드 북 동부 등 주변 지역이 담당하게 되었다.","펙(J.Peck)이 제시한 ( ㉨ )(이)란 중앙정부가 권한 이양을 하거나 금융 및 예산상의 압력을 하향이전하면서 긴축에 따른 비용이 하위국가 정부로 전가되는 현상을 말한다.","디지털 경제에서 공간적 분산은 매우 중요한 특성이다. 공간적 분산은 특히 루틴화된 저부 가가치 활동에 국한되는 경향이 있었지만 자동화 과정을 통해 고부가가치 분야로도 확장되는 추세다. 이때 ICT는 가치사슬을 별개의 여러 요소들로 모듈화하는 역할을 수행한다. 이 과정 을 가치사슬의 수직적 분리 또는 ( ㉩ )(이)라고 한다.","노동을 6가지로 분류한 스탠딩(G.Standing)이 제시한 새로운 계급인 ( ㉪ )은/는 일시적이 고 임시적 형태의 고용에 의존하는 차하위 계층에 속한다.","푸코(Michel Foucault)는 ( ㉫ )을/를 설명하기 위해 판옵티콘(panopticon)라는 은유를 사용한다. 판옵티콘(panopticon)은 19세기 사상가 제레미 벤담(Jeremy Bentham)이 고안했던 감옥 모델을 말하는데, 이 모델에서 수감자들은 중앙 지점으로부터 감시에 노출된 상태에 놓 인다.","리트(Leat)의 ‘지리를 통해 사고하기’ 8가지 전략 중 ( ㉬ ) 전략의 목적은 추상적이고 복 잡한 그래프의 변화가 실생활에서 어떤 변화로 나타나는지 기술함으로써 그래프를 우리의 실 제적인 삶과 관련시키는 것이다.","러시아가 실효적 지배를 하고 있는 ( ㉭ )은/는 오호츠크해와 북태평양을 가르는 위치에 펼쳐져 있다. 일본에서는 지시마 열도(千島列島)라고 부른다."],"a":{"㉠":"수출특화(export specialization)","㉡":"근대화(modernization)","㉢":"낙수효과(trickle-down economics)","㉣":"풀뿌리 발전(grassroots development)","㉤":"신지역주의(new regionalism)","㉥":"의제(擬制)","㉦":"부문별 전문화(sectoral specialization)","㉧":"노동의 공간 분업(spatial division of labour)","㉨":"긴축 어바니즘(austerity urbanism)","㉩":"언번들링(unbundling)","㉪":"불안계급(Precariat)","㉫":"규율 사회(disciplinary society)","㉬":"살아있는 그래프(living graphs)","㉭":"쿠릴 열도(Kuril Islands)"},"e":"빙기에 형성된 해양퇴적물의 산소 동위 원소를 분석하면 O(16)과 O(18) 중에서 무엇의 증가 하는지 설명하시오.","ea":"빙기에는 O(16)이 대륙 빙하에 갇히기 때문에, 이 시기에 형성된 해양퇴적물에는 O(16)보다 O(18)이 많아지게 된다."},"52":{"q":["모든 화산 분출이 위험하다고 생각하지만, 비폭발성 분출은 상대적으로 안전하다. 비폭발성 분출은 낮은 점성의 마그마와 낮은 용해가스의 특성을 가지고 있다. 그래서 종종 ( ㉠ ) 분출 로 불리는 현무암질 마그마의 분출은 거의 폭발적이지 않다. 점성이 낮은 현무암질 용암이라 도, 용암이 식고 용해된 가스를 계속 빼앗김에 따라 점성이 증가하여 유체의 특성이 변한다. 매우 유동적인 초기 용암은 얇은 ( ㉡ ) 유동을 형성하지만, 식으면서 끈적끈적해진 용암은 느 리게 이동하는 ( ㉢ ) 유동으로 바뀐다. 폭발적인 화산 분출 동안 쏟아져 나오는 뜨겁고 산산 조각이 난 마그마 또는 암편들을 화산쇄설물이라고 한다. 고화되지 않은 느슨한 퇴적물은 ( ㉣ )(이)라 부르고, 고화되거나 교결되면 ( ㉤ )이/가 된다.","플라이스토세는 약 260만 년 전부터 지난 빙기가 끝나는 약 1만2천 년 전까지의 기간으로 경신세 또는 ( ㉥ )(으)로 불리기도 한다. 홀로세는 그 이후로부터 현재까지의 기간으로 충적 세로 불리는데, 인간의 활동이 지구환경을 크게 지배한다는 의미에서 홀로세 후반은 ( ㉦ ) (으)로 부르기도 한다.","하곡에서 발생한 지형 변화로 유수가 분수계를 넘는 현상을 ( ㉧ )(이)라고 하는데, 하천의 하류 쪽에서 발생한 지형적 사건으로 하곡이 막혀 ( ㉨ )이/가 형성된 후, 증가한 유량으로 인해 수위가 상승하여 호수의 물이 주변의 낮은 분수계를 넘어 다른 방향으로 흘러가는 것을 말한다.","하천 쟁탈 등의 이유로 하도의 크기가 하곡에 비해 지나치게 큰 경우를 ( ㉩ ) 하천이라 한다.","( ㉪ )은/는 암석면에 구멍이나 동굴의 형태로 만들어진 풍화 형상인데, 원래는 코르시카섬 의 화강암에 파인 동굴을 묘사하기 위해 사용되던 개념이었다. ( ㉫ ) 풍화라고도 불리는 벌집 풍화는 마치 벌집과 유사한 형태를 지니는 소규모의 풍화 구멍들을 묘사하는 데 사용되는 용 어이다.","수동형 대륙 주변부에는 대륙붕, 대륙사면, 대륙대 등이 해당되며, 능동형 대륙 주변부는 섭입대를 따라 발달해 있으며, 해구와 해양퇴적물의 집적과 부가로 ( ㉬ )이/가 형성되는 공간 이다.","사면하강풍 또는 활강풍(katabatic wind)은 고지대의 지표에서 냉각된 밀도가 높은 공기가 ( ㉭ )에 의해 사면 아래로 흘러내려 발생하는 바람이다."],"a":{"㉠":"하와이형(Hawaiian)","㉡":"파호이호이(Pāhoehoe)","㉢":"아아(aa)","㉣":"테프라(tephra)","㉤":"화산쇄설암(pyroclastic rock)","㉥":"홍적세(洪績世)","㉦":"인류세(人類世)","㉧":"유역전환(Drainage Diversion)","㉨":"언색호(dammed lake, 폐색호)","㉩":"과대적합(overfit) 또는 과대 하천","㉪":"타포니(tafoni)","㉫":"알베올리(alveoli)","㉬":"지향사(geosyncline)","㉭":"중력(gravity)"},"e":"집단 목표, 개별적 책무성, 성공기회의 균등이라는 측면에서, 직소(Jigsaw)Ⅱ 모형과 직소 (Jigsaw)Ⅰ 모형을 비교하시오.","ea":"직소(Jigsaw)Ⅱ 모형은 집단 목표, 개별적 책무성, 성공기회의 균등이라는 측면 모두를 충족하지만, 직소(Jigsaw)Ⅰ 모형은 개별적 책무성만 충족한다."},"53":{"q":["마셜(A.Marshall)의 외부효과에 대한 세 가지의 원천에서 기업의 집적에 의한 지식의 파급효과는 개별 경제주체의 생산 함수에 직접적으로 영향을 미친다는 측면에서 기술적 외부효과에 해당한다. 글레이저(E. Glaeser)는 기술적 외부효과를 (   ㉠   ) 외부효과로 설정하여 다시 세 가지 유형을 제시하였다. MAR(Marshall-Arrow-Romer)형 외부경제는 동일산업에 속한 기업의 집중이 지식의 확산과 혁신을 용이하게 함으로써 지역 산업의 생산성을 향상시키는 외부효과를 지칭한다. 이 경우 지역 산업의 시장구조는 (   ㉡   )적인 것이 (   ㉢   )적인 것보다 유리하다고 지적한다. (   ㉡   )의 시장구조가 지식기술의 유출을 제한함으로써 외부효과를 내부화할 수 있으며 이로 인해 기술혁신이 촉진되기 때문이다. Porter형 외부 경제는 MAR형 외부경제와 마찬가지로 동일산업에 속한 기업 간에 지식이 확산되어 발생하는 외부경제이다. 그러나 여기서는 (   ㉢   )이/가 기술 혁신을 유도하고 지역의 성장을 촉진하는 데 유리하다. 반면 Jacobs형 외부경제는 (   ㉣   ) 경제의 (   ㉠   ) 측면을 포착하는 개념이다. 다양한 기술, 정보, 아이디어를 가진 경제주체 간의 공식, 비공식적인 접촉에서 혁신이 창출되고 지역성장을 촉진시킨다. 그러므로 Jacobs형 외부경제에 있어서도 (   ㉢   )적 시장구조가 유리하다.","(   ㉤   )은/는 외생적 입지조건보다 재화의 다양성, 규모의 경제, 그리고 운송비용의 상호작용에서 내생적으로 발생하는 자기순환적 공간집적에 초점을 두는 이론이다. 그리고 순환적 인과관계에 의한 집적과정에서 공간집적과 관련된 세 가지의 효과, 즉, 시장접근효과(market access effects), 시장혼잡효과(market crowding effects), 그리고 거주비용효과(cost-of-living effects)가 작용한다. 여기서 시장접근효과는 (   ㉥   ) 연계를 구성하며 기업이 규모가 큰 시장에 입지하고 규모가 작은 시장에 대해서는 수출로 대응하는 효과이다. 거주비용효과는 (   ㉦   ) 연계를 구성하며 기업의 입지가 지역의 거주생활비용(cost-of-living)에 미치는 효과를 나타내는 것으로서 산업부문이 많은 지역의 재화가격이 그렇지 않은 지역에 비해 저렴하게 됨을 의미한다. 이 두 가지의 효과는 공간집중을 촉진하며 (   ㉥   ) 연계와 (   ㉦   ) 연계에 의한 인과관계를 형성한다는 측면에서 자기강화적(self-reinforcing)인 측면을 가진다. 한편 시장혼잡효과는 불완전경쟁에서의 기업이 상대적으로 경쟁의 강도가 적은 지역에 입지하려는 경향을 의미하며 따라서 이는 공간집중을 분산시키려는 힘으로서 작용한다. 따라서 만약에 (   ㉧   )이/가 (   ㉨   )보다 크다면 산업노동자의 이동과 관련한 외적인 충격은 산업노동자의 이동에 대해 자기확장적 순환과정을 촉진함으로써 결과적으로 모든 산업노동자는 한 지역에 집중될 것이다. 따라서 이러한 산업노동자의 이동은 자기 강화적 특징을 지닌다. 반면에 (   ㉧   )보다 (   ㉨   )이/가 크다면 외적인 충격은 집적에 반하는 힘을 발생시키게 된다. 그리고 이러한 산업노동자의 이동은 자기수정적(self-correcting)인 특징을 지니게 된다. (   ㉧   )와/과 (   ㉨   )의 크기는 운송비용, 관세 등의 교역비용에 의해 결정된다. 교역비용이 0에 가깝다면 지역 간에 재화의 가격차이는 발생하지 않을 것이다. 따라서 소비자로서의 산업 노동자는 어느 지역에 입지하여도 거주비용 차이는 발생하지 않으므로 기업의 집적과는 무관하게 거주지를 선택할 것이다. 반대로 교역비용이 높다면 어느 지역에서 소비되는 제품 가운데 지역 내에서 생산된 제품의 비중에 따라 물가지수가 결정될 것이며 이는 지역 간 가격지수의 차이를 발생시킨다. 당연히 산업부문의 기업이 많이 입지한 지역은 지역에서 소비되는 제품의 가격지수가 낮은 수준에 머무르게 된다. 이는 해당지역의 거주비용을 낮추게 되며 산업 노동자는 산업부문 기업이 많이 입지한 지역으로 이동할 것이다. 동일한 이유로 시장접근효과에 의한 경제의 공간적 (   ㉧   )도 교역비용이 낮을수록 약화된다.","학문중심 교육과정에서는 학생을 합리적인 탐구자가 되도록 하는 것을 우선시하기 때문에, 교과 내용은 (   ㉩   )을/를 핵심으로 조직하며, 나선형 교육 과정을 통해 그 교과에 담겨진 기본 개념을 학생의 사고 방식에 알맞게 가르치며, 학년의 진전에 따라 심화 확대시켜나가는 것을 중시한다.","(   ㉪   )은/는 주로 인지적 영역을 중시하는 사실교육, 지식교육의 형태를 띠는 것이다. 반면에 '환경으로부터의 교육'은 정의적 영역을 중시하며, 환경 속에서의 행동을 중시하는 정서교육 내지 기능중심교육의 형태를 띤다. 그리고 '환경을 위한 교육'은 가치 및 태도와 실행을 중시하는 가치교육 내지 사회적 실천교육 형태를 띤다.","(   ㉫   )(이)란 과거 숙제로 이루어졌던 과제들을 교실에서 수행하는 것으로 교실 안에서의 상호작용을 기반으로 한 집단 학습과 교실 밖에서 컴퓨터를 기반으로 한 개별 교수와 같은 두가지 방법으로 구성된 교수학습 방법을 지칭한다.","교사가 갖추어야 할 지식에 대한 논의는 여러 학자들에 의해 전개되어 왔는데, 폴라니(Polanyi)는 (   ㉬   )을/를, 오크쇼트(Oakeshott)는 (   ㉭   )와/과 실천적 지식(practical knowledge)을, 엘바즈(Elbaz) 역시 실천적 지식(practical knowledge)을, 그리고 슐만(Shulman)은 특히 교수내용지식(pedagogical content knowledge)을 강조하였다."],"a":{"㉠":"동태적(dynamic)","㉡":"독점(monopoly)","㉢":"경쟁(competition)","㉣":"도시화(urbanization)","㉤":"신경제지리학(NEG:New Economic Geography)","㉥":"후방(backward)","㉦":"전방(forward)","㉧":"구심력(centripetal force)","㉨":"원심력(centrifugal force)","㉩":"지식의 구조(structure of knowledge)","㉪":"환경에 대한 교육(education about the environment)","㉫":"플립트러닝(flipped learning)","㉬":"개인적 지식(personal knowledge)","㉭":"전문적 지식(expert knowledge)"},"e":"유역전환(Drainage Diversion)의 의미를 설명하시오.","ea":"하곡에서 발생한 지형 변화로 유수가 분수계를 넘는 현상이다."},"54":{"q":["사구는 풍향에 따라 모래가 도약과 포행을 통해 올라가는 경사가 완만한 바람받이 사면을 (   ㉠   )(이)라 하고, 경사가 급한 바람의지 사면을 (   ㉡   )(이)라고 한다. (㉠과 ㉡에는 활주사면, 후사면 중에서 선택하여 기입할 것)","산지의 개석과 축소로 페디먼트가 점차 산정 쪽으로 확장되면, 양쪽 산지의 페디먼트가 서로 이어져 가운데가 볼록한 평탄한 사면 지형이 형성되는데, 이를 (   ㉢   )(이)라고 한다. 이때 상대적으로 경암부는 돌출되어 남겨져 (   ㉣   )에 해당하는 잔구를 이루기도 한다.","(   ㉤   )은/는 정상적인 세류 활동의 한계를 나타내는, 해빈에 높게 자리한 능선 부분을 말한다.","얼음의 융해에 의한 불규칙한 와지가 넓게 발달한 지형을 (   ㉥   )(이)라고 부르는데, 이는 암석의 용식 및 침전 작용과 전혀 관계없는 지형 경관으로 주빙하 지형에 해당한다.","구조토 중에서 반구 형태로 솟아 있는 것을 (   ㉦   )(이)라고 하는데, 작은 무덤처럼 보이며 식생으로 덮여 있다. (   ㉦   )은/는 모래와 실트로 이루어진 토양에서 잘 생기며, 토양층이 볼록하게 솟아오르는 과정에서 토양 내부가 심하게 요동된 토양구조를 보인다.","빙상으로부터 빙체의 일부가 바다를 향해 뻗어내리는 빙하를 (   ㉧   )(이)라고 한다. 이것이 바다 멀리까지 돌출한 경우, 바다 위에 떠 있는 얼음판 형태의 빙하를 빙붕(ice shelf)이라고 한다.","매스무브먼트 중 유동(流動, flow)은 사면물질 특성, 물․얼음․점토의 함량, 이동속도 등을 기준으로 토양류(earthflow), (   ㉨   ), 이류(mudflow), 애벌런치(avalanche) 등으로 세분할 수 있다. (   ㉨   )은/는 자갈, 암괴 등 조립물질의 비율이 높은 유동인 데 비하여, 이류(泥流)는 모래, 이토, 점토 등 세립물질의 비율이 높은 유동을 말한다.","점토와 같은 퇴적층이 건조해지면 퇴적층 표면이 수축하여 균열이 생기는데, 이 갈라진 틈을 (   ㉩   )(이)라고 한다. 반면에 점토 광물이 물에 젖으면 팽창하면서 균열을 형성한다. 이는 점토 안에 갇힌 공기의 압력이 침투하는 수분에 의해 높아지기 때문이다. 이와 같이 갇혔던 공기가 방출되면서 점토 흙덩이가 부서지는 현상을 (   ㉪   )(이)라고 한다.","화산 쇄설암 중에서 (   ㉫   )은/는 세립의 화산 쇄설물이 고결되어 생성된 암석이며, (   ㉬   )은/는 조립의 화산 쇄설물이 쌓여 생성된 암석이다.","(   ㉭   )은/는 수평으로 쌓인 주된 지층에 대하여 기울어진 퇴적 구조로 특히 사암에서 많이 나타난다."],"a":{"㉠":"후사면(back slope)","㉡":"활주사면(slip slope)","㉢":"페디플레인(Pediplain)","㉣":"도상구릉(Inselberg)","㉤":"범(berm)","㉥":"열카르스트(thermokarst)","㉦":"유상구조토(earth hummock)","㉧":"분출빙하(outlet glacier)","㉨":"암설류(巖屑流, debris flow)","㉩":"건열(mudcrack)","㉪":"슬래킹(slaking, 비화작용)","㉫":"응회암(tuff)","㉬":"집괴암(agglomerate)","㉭":"사층리(cross bedding)"},"e":"매스무브먼트가 발생하기 유리한 곳의 조건을 설명하시오. (단, 비고, 경사, 풍화층, 지진 관점에서 서술할 것)","ea":"매스무브먼트는 비고가 높고 사면 경사가 급하며, 풍화층이 두껍고 지진이 잦은 곳에서 발생하기 쉽다."},"55":{"q":["로마 시대의 지도학은 그리스인들에 의해 진전이 이루어졌는데, 그 대표가 (   ㉠   ) 세계지도이다. 이 지도는 고대 그리스의 지리적 지식이 집대성된 것으로 지중해 연안 및 유럽이 정확하게 표현되었다. 또한 (   ㉡   ) 도법을 이용하여 지구가 구형임을 나타내고자 위선을 곡선으로 표현하였으며, 근대 지도 제작의 기초가 되었다.","(   ㉢   ) 해도는 13세기경부터 제작된 지중해를 중심으로 해안의 항구와 도시를 자세히 표현하였다.  또한 항해 요충지마다 나침반의 방향을 알려주는 방사선이 목적지까지 직선으로 나타나 있다.","(   ㉣   )은/는 마테오 리치와 명나라 학자 이지조가 제작한 세계지도로 유럽의 근대적 지리 지식과 지도 제작술을 중국에 소개하였다는 의의를 지녔다. 또한 중국 중심의 세계관에서 벗어난 지도라고 할 수 있다.","(   ㉤   ) 중에서 큰 의미를 가지는 것은 두 가지이다. 하나는 세조 때 정척과 양성지가 제작한 지도로 그 원본은 전하지 않는다. 다른 하나는 영조 때 정상기가 제작한 지도로 최초로 (   ㉥   )을/를 이용하여 축척을 나타내고 거리도 측정할 수 있게 하였다.","방위의 기준은 북은 세 가지로 분류할 수 있다. (   ㉦   )은/는 지리학적 북쪽 방향을, (   ㉧   )은/는 지도상의 북쪽, 그리고 (   ㉨   )은/는 나침반이 지시하는 북쪽 방향이다.","경위도 좌표계는 절대 좌표로 지구상의 중복이 없지만, 평면직각 좌표계는 상대 좌표로 지구상의 중복이 존재할 수 있다. 또한 경위도 좌표계는 좌표의 단위로 각도(도,  분, 초)를 사용하지만, 평면직각 좌표계는 (   ㉩   )을/를 사용한다.","(   ㉪   )와/과 귀납적 추론은 본질적으로 사례를 기반으로 문제해결을 시도한다는 점에서 사례기반 추론이라 할 수 있다. 하지만 귀납적 추론은 여러 사례들을 일반화한 이후에 다른 사례에 적용을 하지만, (   ㉪   )은/는 일반화 과정이 생략되고 하나의 사례에서 바로 다른 사례에 적용을 시도한다.","2022 개정 사회과 교육과정의 중학교 지리 영역은 4개로 구성되어 있는데, 이 중 (   ㉫   ) 영역은 갈등과 불균등의 세계, 지속가능한 환경, 공존의 세계로 구분된다. '갈등과 불균등의 세계' 범주는 초등학교 5~6학년은 '지구촌 갈등 사례'라는 하나의 내용 요소로 이루어져 있지만, 중학교는 지역의 통합과 분리, (   ㉬   ), 분단과 접경지역이라는 3개의 내용 요소로 구성되어 있다.","2022 개정 교육 과정은 '포용성과 창의성을 갖춘 주도적인 사람'이라는 비전 아래 미래 대응을 위한 교육과정, 학교 현장의 자율적인 혁신 지원, 학습자 (   ㉭   ) 교육 강화, 교육환경 변화 대응 지원이라는 4가지 추진과제를 설정하였다."],"a":{"㉠":"프톨레마이오스 또는 톨레미(Ptolemy)","㉡":"단원추(simple conic)","㉢":"포르톨라노(Portolano)","㉣":"곤여만국전도(坤與萬國全圖)","㉤":"동국지도(東國地圖)","㉥":"백리척(百里尺)","㉦":"진북(true north)","㉧":"도북(grid north)","㉨":"자북(magnetic north)","㉩":"미터(m)","㉪":"유추(analogy)","㉫":"지속가능한 세계","㉬":"지역 불균형","㉭":"맞춤형"},"e":"하천의 곡률도(sinuosity)를 계산하는 방법을 설명하시오.","ea":"하곡의 중심축을 따라 측정한 직선 길이에 대한 하도의 중심을 따라 측정한 하도 길이의 비율로 나타낸다."},"56":{"q":["녹스(P. Knox)는 도시공간의 사회적 생산이라는 맥락에서 지리학이 건축에 접근한 주요 연구방법을 (   ㉠   )(으)로서의 건축, 정치로서의 건축, 시대정신으로서의 건축, (   ㉡   )의 수단으로서의 건축, 정당화와 사회적 재생산의 수단으로서의 건축, 도시 관리자로서의 건축가 등으로 분류했다. (   ㉠   )(으)로서의 건축이란 건축을 (   ㉠   )의 산물로 보는 연구경향으로 사우어학파의 연구가 대표적이지만, (   ㉠   )을/를 물신화한다는 비판을 받는다. (   ㉡   )의 수단으로서의 건축은 과잉 생산의 위기를 건조 환경의 생산 및 폐기, 재생산을 통해서 해소하려는 경향을 의미한다.","(   ㉢   )은/는 부동산 업자가 부동산 정보를 차별적으로 이용하여 같은 민족 집단이 집중되어 있는 근린 지역으로 고객을 안내하여 거주지 분화가 유지되도록 하는 행위로 Manipulation이라고도 한다.","네트워크 도시체계에서는 공간적 근접성에 의한 (   ㉣   )이/가 아니라 도시들 사이의 (   ㉤   ) 연계틀이라는 네트워크 속성이 도시 활동의 입지에서 중요한 원리로 작용하게 된다.","(   ㉥   )은/는 서로 다른 성격을 가진 다양한 인간 및 비인간 행위자들이 공존하고 결합하여 예기치 못하게 전혀 새로운 것이 출현하는 상황을 뜻한다.","사센(S.Sassen)에 따르면 세계 경제에서 100여 년 전에는 중요했던 교역과 1차 산업은 1980년대에 와서 급속히 쇠퇴했고 금융, (   ㉦   ), 기업 특화 서비스 등이 등장했다. 또한 교역에 비해 금융 거래의 가치는 훨씬 더 높게 상승했으며, 1980년대의 (   ㉦   )은/는 수출액보다 세 배 더 성장했다. 1980년대 중반에는 서비스투자가 (   ㉦   )의 핵심 부문으로 등장한 반면, 이전에 주를 이루었던 제조업과 천연자원 채굴에 대한 투자는 비중이 낮아졌다.","튀넨의 고립국의 토지 이용 패턴은 중심 시장에서부터 순서대로 자유식 - (   ㉧   ) - 윤재식 - 곡초식 - 삼포식 - 조방적목축이 나타난다.","그린헛(M.Greenhut)은 호텔링(H.Hotelling)과 마찬가지로 이윤극대화 지점은 (   ㉨   )에 의해 변동될 수 있다고 하였지만, 기업간 경쟁이 심할수록 집중 입지, 비경쟁적이고 독점화될수록 분산 입지가 된다고 하였다.","자원의 희소성은 공급, 수요, 구조적인 원인으로 발생하는데, 공급으로 유발되는 희소성은 자원이 고갈되거나 질이 저하될 때 나타난다. 수요로 유발되는 희소성은 (   ㉩   ) 자원, 즉 한 행위자의 사용이 다른 사람의 이용 가능성을 저해할 때 발생한다. 구조적 희소성은 분배의 불균형 때문에 발생한다. 사유 재산 인정이 가능한 (   ㉪   ) 자원의 경우 특정 집단의 사용이 제한되거나 봉쇄될 수 있다.","(   ㉫   )(이)란 사회관계의 총체적 특성으로 다양한 연관조직(기업, 상공회의소, 교육, 무역, 지방정부, 개발기구 등)의 존재와 그들이 해당 지역의 사회관계 속에서 형성시킨 관습과 지배구조, 그리고 공통된 인식 등을 의미한다.","미시적 인구이동 이론은 이주에 대한 개개인의 의사결정과정에 초점을 두고 인구이동 현상을 설명하고 있다. 사스타드(Sjaastad)는 (   ㉬   ) 이론을 인구이동 현상에 적용하여 인구이동의 경제적 결정모형을 제시하였는데, 그는 이동의 비용을 직접적인 경제비용, 기회비용, 심리적 비용으로 나누었다. (   ㉬   ) 이론이 인구이동 자체를 투자 행위로 보고 있는데 비해, 인구이동을 소비적 관점에서 접근한 것이 소비동기 이론이다. 특히 쉴즈(Shields)는 위락요인을 강조하는 (   ㉭   ) 이론을 제시하였는데, 이 이론은 기후나 특정 지역의 편의성과 쾌적성 수준이 인구이동의 의사결정에 중요한 영향을 미친다고 주장한다."],"a":{"㉠":"문화(culture)","㉡":"자본축적과 순환(accumulation & circulation of capital)","㉢":"스티어링(steering)","㉣":"집적 경제(agglomeration economies)","㉤":"가상 집적(virtual agglomeration)","㉥":"창발(emergence)","㉦":"해외직접투자(Foreign Direct Investment)","㉧":"임업(forestry)","㉨":"입지적 상호의존성(locational interdependence)","㉩":"경쟁적(rivalrous)","㉪":"배제적(excludable)","㉫":"제도적 밀집(institutional thickness)","㉬":"인적자본(human capital)","㉭":"헤도닉 인구이동(hedonic migration)"},"e":"건조 지역과 습윤 지역의 유역 분지 하계 밀도, 하도 유형을 비교하시오. (단, Schumn의 모델에 따를 것)","ea":"건조 지역은 유역 분지의 하계 밀도가 높고, 망류하도가 발달하지만, 습윤 지역은 유역 분지의 하계 밀도가 낮고, 자유곡류하도가 발달한다."},"57":{"q":["지균풍은 지표면의 영향이 없는 1km 이상의 상층에서 ( ㉠ )이/가 직선일 때, 기압경도력과 ( ㉡ )이/가 평행을 이루어 ( ㉠ )에 평행하게 부는 이상적인 바람이다. 반면, 경도풍은 ( ㉠ )이/가 곡선일 때 발생하는 이상적인 바람으로 기압경도력 및 ( ㉡ )와/과 더불어 ( ㉢ )이/가 작용한다. 마지막으로 지상풍은 기압경도력, ( ㉡ )에 ( ㉣ )까지 더해져 발생한다.","( ㉤ )은/는 강한 자기장이 주변으로의 에너지 전달을 방해하여 상대적으로 온도가 낮아진 지점으로, 그 수가 많을수록 태양 활동이 더 활발하여 복사에너지 방출량이 많다.","먼바다의 스웰이 해안의 얕은 바다에 이르면, 물 분자의 움직임 또한 궤도운동에서 ( ㉥ )(으)로 바뀐다. 즉, 깊은 바다의 스웰은 물 분자가 궤도운동하는 진동파(oscillatory wave)이지만, 얕은 바다의 파랑은 물 분자가 ( ㉥ )하는 이동파(translational wave)로 변형되어 해안을 향해 접근한다.","풍화 속도와 관련하여, 풍화의 초기에는 지표 풍화가, 풍화의 후기에는 지중 풍화가 뚜렷하게 나타나는 경향이 있다. 또한 대체로 지중 풍화는 ( ㉦ ) 풍화와, 지표 풍화는 ( ㉧ ) 풍화와 관련성이 높다.","변성 작용이 일어나는 동안 온도와 압력의 영향으로 광물의 내부 결합 구조가 달라져 다른 광물로 바뀌는데 이를 ( ㉨ )(이)라고 한다.","( ㉩ )(이)란 빙하가 장애물인 기반암 돌출부 하류에서 빙하의 압력이 다시 감소해 융해점이 ( ㉪ )하고 이에 따라 융빙수의 재결빙이 발생하는 현상을 말한다.","화산가스가 대기로 방출되는 과정에서 생긴 기공에 의해 다공질을 이룬 조립의 화산쇄설물을 ( ㉫ )(이)라고 하는데, 가볍고 밝은 색을 띠는 부석(pumice)과 무겁고 어두운 색을 띠는 ( ㉬ )이/가 있다.","과거의 기후 상태를 분석하기 위해, 기후 조건에 민감하게 반응하여 과거의 기후 조건에 따라 형성된 특정한 상태가 현재까지 남겨져 있는 물질이나 현상을 통해 과거의 기후를 간접적으로 추정할 수 있는 증거인 ( ㉭ )을/를 사용한다."],"a":{"㉠":"등압선(isobar)","㉡":"전향력(Coriolis force)","㉢":"원심력(centrifugal force)","㉣":"마찰력(frictional force)","㉤":"흑점(sunspot)","㉥":"병진운동(translational motion)","㉦":"화학적(chemical)","㉧":"물리적(physical)","㉨":"재결정작용(recrystallization)","㉩":"복빙(Regelation)","㉪":"상승","㉫":"분석(cinder)","㉬":"암재(scoria)","㉭":"프록시 자료(proxy data)"},"e":"조석주기가 12시간이 아니라 12시간 25분이 되는 이유를 설명하시오.","ea":"지구가 자전하는 동안 달도 지구 둘레를 지구 자전과 같은 방향으로 공전하기 때문이다."},"58":{"q":["하버마스(J.Habermas)에 따른다면, 문화차이에 따른 갈등 분석은 ( ㉠ ) 관심으로, 교과서 속 식민지 서술의 편향 비판은 ( ㉡ ) 관심으로 볼 수 있다.","( ㉢ )의 지리교육적 가치는 특히 지리적 상상력과 공감적 이해를 증진시키는 데에 있다.","피터스(Peters)는 가치있는 교육이 되기 위해서는 교육이 ( ㉣ ) 준거, 인지적 준거, 과정적 준거를 갖추어야 한다고 했는데, ( ㉣ ) 준거는 교육 목적, 인지적 준거는 ( ㉤ ), 과정적 준거는 교육 방법에 해당한다.","수업 목표는 ( ㉥ ) 목표와 표현적 목표로 구분할 수 있는데, 전자는 학습결과를 강조하지만, 후자는 학습 과정에서 나타날 수 있는 ( ㉦ )을/를 강조한다.","렐프(E.Relph)는 장소에서의 내부성을 육체적 개입을 의미하는 행동적 내부성, 장소에의 감성적인 참여와 개입을 수반하는 감정이입적 내부성, 그리고 장소에 완전히 그리고 무의식적으로 빠져드는 ( ㉧ ) 등으로 분류하였다. 이것들은 모두 생생하고 직접적인 경험 양식이고, 소설이나 다른 미디어를 통해 장소를 간접적으로 경험하는 것은 대리적 내부성이라고 하였다.","미국 캘리포니아 해안을 향해 북동쪽에서 불어 내려오는 고온 건조한 바람을 ( ㉨ ) 바람이라고 한다. 이 바람은 사면하강풍과 푄이 혼합된 성격을 가지고 있다.","자연증가가 일정하다는 가정하에, 인구가 2배로 증가하는 데에 걸리는 시간을 ( ㉩ )(이)라 하는데, 연간 자연증가율이 1%라면 ( ㉩ )은/는 70년이 된다.","하천의 ( ㉪ )은/는 하천에서 하상 하중으로 이동할 수 있는 입자의 최대 크기로 정의되고, 하천의 ( ㉫ )은/는 하상 하중으로 이동할 수 있는 암설의 최대량으로 정의된다.","하도의 경사도는 ( ㉬ ) 하도가 ( ㉭ ) 하도보다 급한 경향이 있다. (㉬과 ㉭에는 ‘직류’ 또는 ‘망류’하도 중에서 선택 기입할 것)"],"a":{"㉠":"실천적(practical)","㉡":"해방적(emancipatory)","㉢":"내러티브(narrative)","㉣":"규범적(normative)","㉤":"교육 내용(educational content)","㉥":"행동적(behavioral)","㉦":"교육적 만남(educational encounter)","㉧":"실존적 내부성(existential insideness)","㉨":"산타아나(Santa Ana)","㉩":"배가 기간(doubling time)","㉪":"운반능(competence)","㉫":"운반량(capacity)","㉬":"망류(braided)","㉭":"직류(straight)"},"e":"기단이 발생하기 위해서 대기가 장기간 정체되어야 하는 이유를 설명하시오.","ea":"대기와 지표면이 오랜시간 접촉하여 열과 수증기 교환이 이루어져야 하기 때문이다."},"59":{"q":["지리 교육과정의 내용 조직 원리 중 지역적 방법의 단점으로는 ( ㉠ )한 학습이 되지 못하고 기계적인 암기학습이 될 수 있다는 점, 지역적 차이를 단순히 ( ㉡ )적 관점에서 기술하는 경향이 있다는 점 등을 지적할 수 있다.","가네(Gagne)의 개념 분류에 따르면 ( ㉢ ) 개념에는 귀납적인 관찰, ( ㉣ ) 개념에는 연역적 사고가 필요하다. 그러므로 ( ㉣ ) 개념은 ( ㉤ ) 모형으로 학습하는 것이 효과적이다.","이란 등 건조한 지역에서 발달한 전통 건축 요소인 ( ㉥ )은/는 건물 내부의 공기를 순환시켜 온도를 낮추는 전통적인 자연 환기 장치이다. 탑 구조의 입구로 외부의 바람이 유입되면, 내부의 더운 공기는 상승기류에 의해 위로 배출된다. 이러한 과정에서 냉각 효과가 발생하며, 에너지 사용 없이도 실내 환경을 쾌적하게 유지할 수 있다. 이른바 원조 에어컨인 셈이다.","프랑스로 이주한 외국인들은 ( ㉦ ) 3국인 모로코, 알제리, 튀니지 등에서 기원한 사람들이 많은데, 프랑스의 식민지였기 때문에 프랑스어 사용이 가능하며, 주로 이슬람교를 신봉한다.","대륙빙의 하부 지형은 보통 보존되거나 화석화되지만 일부 기반암 지형은 빙상의 상부로 노출되기도 한다. 이를 ( ㉧ )(이)라 하는데 남아메리카의 피츠로이, 토레스 델 파이네 등이 대표적이다.","엘바즈(Elbaz)는 실천적 지식의 주요 양상을 내용, ( ㉨ ), 구조로 제시하였다. ( ㉨ )은/는 실천적 지식이 생성되고 사용되는 배경을 파악하는 방법이다.","( ㉩ )은/는 중첩 분석을 수행하기 전에 사용되는 분석으로, 래스터 분석에서는 각각의 셀에 입력된 원래의 값을 새로운 값으로 치환하는 ( ㉪ ) 방식을 통해 이루어진다.","질의(Query)는 GIS가 데이터베이스 시스템으로 구축되었기 때문에 가능한 기능으로, 속성에 대한 질의와 공간에 대한 질의로 구분할 수 있다. 데이터베이스에 저장된 정보를 탐색하기 위해서는 질의문을 작성하게 되는데, 질의문에는 연산자(operator)가 포함된다. 연산자는 산술 연산자와 ( ㉫ ) 연산자로 구분된다.","입찰 지대 곡선을 통해, 재배 작물의 구간을 구하지 않고, 숫자들을 대입하거나 제시된 그래프를 자로 측정하여 답을 구했음에도 학생들이 이해했다고 교사가 생각했다면, 이는 극단적 교수 현상 중 ( ㉬ )에 해당한다.","( ㉭ ) 프로세스는 분쟁지역에서 채굴된 이른바 블러드 다이아몬드가 내전 자금으로 유입되는 것을 차단하기 위해 도입된 국제 원산지 인증 제도이다."],"a":{"㉠":"유의미(meaningful)","㉡":"환경결정론(environmentalism)","㉢":"구체적(concrete)","㉣":"정의적(defined)","㉤":"속성(attribute)","㉥":"바드기르(Badgir)","㉦":"바바리(Barbary)","㉧":"누나탁(nunatak)","㉨":"정향(orientation)","㉩":"재분류(reclassification)","㉪":"재부호화(recoding)","㉫":"논리(Boolean)","㉬":"주르댕 효과(Jourdain effect)","㉭":"킴벌리(Kimberley)"},"e":"알베르츠 정적원추도법에서의 정적성 유지 방법을 설명하시오. (단, 표준위선은 두 개로 가정한다.)","ea":"표준위선 사이에서는 동서축척이 작으므로 남북축척을 확대시키고, 표준위선 외곽에서는 남북축척을 줄여 정적성을 유지한다."},"60":{"q":["( ㉠ )(이)란 교육과정 또는 교과에 초점을 둔 것으로 내용 컨테이너로서의 개념이다. 접합 개념이나 이접 개념과 달리 ( ㉡ )은/는 오로지 다른 것과 비교할 때 의미가 생기는 개념이다. 그러므로 ( ㉡ )은/는 속성보다는 그 개념이 쓰이는 상황과 맥락을 이해하는 것이 중요하다.","( ㉢ )은/는 지리교육론에서 강조해 온 정의적 영역을 막연한 애향심이나 도덕적 당위가 아니라 경관과 텍스트 속에서 구체적으로 해독하고 표현할 수 있는 문해력이다.","신생대 4기에는 귄츠(Gunz), 민델(Mindel), 리스(Riss), ( ㉣ ) 빙기 등 4차례의 주요 빙기와 간빙기가 교대로 나타났다.","과거의 기후를 간접적으로 추정할 수 있는 프록시 자료에는 화분과 연륜 이외에 ( ㉤ ), ( ㉥ )이/가 있다. 동굴 생성물인 ( ㉤ )의 탄소 및 산소 동위원소 비율을 분석하면 해당 시기의 기후 상태와 기후 변화 과정을 유추할 수 있다. 특히 석순은 내부가 석회질로 단단히 채워져 있어 동위원소 분석에 적합하다. ( ㉥ )은/는 두꺼운 빙상을 시추하여 획득하는데, 시기별로 눈이 내릴 당시의 공기에 대한 정보를 포함한다.","( ㉦ )은/는 투영된 지도상에서의 축척을 지구본에서의 축척으로 나눈 값이다.","하도 변위로 인해 하곡이나 분지 내부를 가로질러 발달한 분수계를 일반적인 능선 분수계와 구별하여 ( ㉧ )(이)라고 부른다.","하상 하중(밑짐)은 하상을 구르거나 미끄러지면서 운반되는 퇴적물로, 보통 때는 하상을 구르거나 끌리는 ( ㉨ )을/를 통해 이동하며, 유속이 빨라지면 하상에서 튀어오르는 도약(saltation)을 통해 이동한다.","( ㉩ ) 제도는 남대서양에 위치한 영국의 실효 지배를 받는 군도로, 영국과 아르헨티나가 영유권을 주장하는 영토 분쟁 지역이다. 아르헨티나 등 스페인어권에서는 말비나스 제도(Islas Malvinas)로 불린다.","( ㉪ )은/는 시간지리학에서 사용되는 개념으로서 사람 간에 대면 접촉의 필요성으로 인해 발생하는 인간 활동의 시공간 제약을 가리킨다.","( ㉫ )은/는 지식을 새로운 방식으로 새로운 상황에 적용하거나 다른 내용을 옛 위치에 적용하는 것을 지칭한다.","취송류는 ( ㉬ ) 효과와 ( ㉭ ) 수송에 의해 형성된다."],"a":{"㉠":"위계적 개념(hierarchical concept)","㉡":"관계 개념(relational concept)","㉢":"감성적 문해력(emotional literacy)","㉣":"뷔름(Wurm)","㉤":"스펠레오뎀(speleothem)","㉥":"얼음코어(ice core)","㉦":"축척 계수 또는 축척 요인(scale factor)","㉧":"곡중분수계(谷中分水界)","㉨":"견인(traction)","㉩":"포클랜드(Falkland)","㉪":"결합제약(coupling constraint)","㉫":"전이(transfer of learning)","㉬":"코리올리(Coriolis)","㉭":"에크만(Ekman)"},"e":"평사(stereographic) 투영법을 설명하시오.","ea":"광원의 위치를 투영면과 지구와의 접점의 대척점에 두는 투영법이다."}},L='㉠㉡㉢㉣㉤㉥㉦㉧㉨㉩㉪㉫㉬㉭',$=s=>document.querySelector(s),K='katalk-quiz-v1';let mem={};

function qhtml(r,i,ws){const a=D[r].a,seen=new Set();return seg(D[r].q[i-1]).map(x=>x.s!==undefined?esc(x.s):(seen.has(x.l)?'<span class=ref>'+x.l+'</span>':(seen.add(x.l),ws&&ws.has(x.l)?'<mark>'+esc(a[x.l])+'</mark>':'<span class=fill>'+esc(a[x.l])+'</span>'))).join('')}
/* 카드 */
function card(u,only){const d=D[u.r],el=document.createElement('div');el.className='card';const est=d.est?'<div class=warn>⚠ 원본 PDF에 답안이 없어 추정한 답안입니다. 확인이 필요해요.</div>':'';
 if(u.e){el.innerHTML=est+'<span class=tag>서술형</span><p class=q>'+esc(d.e)+'</p><textarea rows=4 placeholder="내 답안을 써보세요 (자기채점)"></textarea><div class=out></div>';return{el,essay:1}}
 const p=document.createElement('p'),seen=new Set(),inp={};p.className='q';
 seg(d.q[u.i-1]).forEach(x=>{if(x.s!==undefined){p.append(x.s);return}const w=document.createElement('span');w.className='b';
  if(seen.has(x.l)){w.className='b ref';w.textContent=x.l}else if(only&&!only.has(x.l)){w.className='b fill';w.textContent=d.a[x.l]}else{w.innerHTML='<i>'+x.l+'</i>';const t=document.createElement('input');t.autocomplete='off';t.spellcheck=false;inp[x.l]=t;w.append(t)}
  seen.add(x.l);p.append(w)});
 el.innerHTML=est+'<span class=tag>'+u.r+'회 '+u.i+'번</span>';el.append(p);return{el,inp,d,only}}
/* 세션 */
let S,TAB='r',SEL=new Set(),RS={sh:1,es:1,from:1,to:60,n:20,rsh:1};
function start(title,units,rev){if(!units.length)return alert('풀 문제가 없어요.');S={title,u:units,i:0,c:0,t:0,bad:[],rev};show()}
function show(){if(S.i>=S.u.length)return done();const u=S.u[S.i],w=ST.wrong[u.k],only=S.rev&&w&&!u.e?new Set(Object.keys(w.l)):null,c=card(u,only),app=$('#app');
 app.innerHTML='<div class=bar><div style="width:'+S.i/S.u.length*100+'%"></div></div><div class=hd><span>'+esc(S.title)+' · '+(S.i+1)+'/'+S.u.length+'</span><button class=b2 id=q>그만하기</button></div>';app.append(c.el);
 const act=document.createElement('div');act.className='row';act.innerHTML='<button class=b1 id=go>채점</button><button class=b2 id=sk>모르겠어요(정답 보기)</button>';app.append(act);
 let done=0,res={};$('#q').onclick=()=>{S.i=S.u.length;show()};
 const nxt=()=>{S.i++;show()},fin=bad=>{done=1;if(bad)S.bad.push(u);act.innerHTML='<button class=b1 id=nx>'+(S.i+1>=S.u.length?'결과 보기':'다음 →')+'</button>';$('#nx').onclick=nxt;$('#nx').focus()};
 if(c.essay){const ta=c.el.querySelector('textarea'),out=c.el.querySelector('.out');$('#go').textContent='모범답안 보기';$('#sk').remove();
  $('#go').onclick=()=>{ta.readOnly=true;out.innerHTML='<div class="fb ok"><b>모범답안</b><br>'+esc(D[u.r].ea||'(모범답안 없음)')+'</div>';act.innerHTML='<span class=m>내 답안이 맞았나요?</span><button class=b1 id=y>맞았어요</button><button class=b2 id=n>틀렸어요</button>';S.t++;
   $('#y').onclick=()=>{S.c++;ST.solved[u.k]=1;if(S.rev)clr(u,'E');sv();fin()};$('#n').onclick=()=>{ST.solved[u.k]=0;miss(u,'E',1,ta.value);fin(1)}};return}
 const keys=Object.keys(c.inp),gd={};let anyBad=0;
 const one=(l,skip)=>{if(gd[l])return;gd[l]=1;const t=c.inp[l],v=skip?'':t.value.trim(),g=!skip&&ok(v,c.d.a[l]);res[l]=g;t.readOnly=true;t.classList.add(g?'good':'bad');S.t++;
  if(g){S.c++;if(S.rev)clr(u,l);const f=document.createElement('div');f.className='fb ok';f.innerHTML='✅ <b>'+l+'</b> 정답: '+esc(c.d.a[l]);t.closest('.b').after(f)}else{anyBad=1;miss(u,l,1,v);const f=document.createElement('div');f.className='fb';f.innerHTML='<b>'+l+'</b> 정답: '+esc(c.d.a[l]);const b=document.createElement('button');b.textContent='내 답이 맞아요(정답 처리)';b.onclick=()=>{res[l]=true;t.className='good';f.className='fb ok';b.remove();S.c++;miss(u,l,-1);ST.solved[u.k]=keys.every(z=>res[z])?1:0;sv()};f.append(b);t.closest('.b').after(f)}};
 const finish=()=>{ST.solved[u.k]=anyBad?0:1;sv();fin(anyBad)},grade=skip=>{if(done)return;keys.forEach(l=>one(l,skip));finish()};
 $('#go').onclick=()=>grade();$('#sk').onclick=()=>grade(1);
 keys.forEach(l=>c.inp[l].onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(done)return;setTimeout(()=>{if(done)return;one(l);const r=keys.find(z=>!gd[z]);r?c.inp[r].focus():finish()},e.isComposing?40:0)});if(keys[0])c.inp[keys[0]].focus()}
function done(){const p=S.t?Math.round(S.c/S.t*100):0,bad=S.bad;$('#app').innerHTML='<div class=card><div class=big>'+p+'%</div><p style="text-align:center">'+esc(S.title)+'<br>빈칸/문항 '+S.t+'개 중 <b>'+S.c+'</b>개 정답'+(S.t<S.u.length?'<br><span class=m>(중간에 그만뒀어요)</span>':'')+'</p><div class=row style="justify-content:center">'+(bad.length?'<button class=b1 id=rt>이번에 틀린 문제 다시 풀기('+bad.length+')</button>':'')+'<button class=b2 id=hm>홈으로</button></div></div>'+bad.map(u=>'<div class=card><span class=tag>'+u.r+'회 '+(u.e?'서술형':u.i+'번')+'</span><p class=q>'+(u.e?esc(D[u.r].e)+'<br><mark>'+esc(D[u.r].ea||'')+'</mark>':qhtml(u.r,u.i,new Set(Object.keys(D[u.r].a))))+'</p></div>').join('');
 if(bad.length)$('#rt').onclick=()=>start('틀린 문제 복습',bad,1);$('#hm').onclick=home}
/* 홈 */
function tabA(){const a=$('#app');a.innerHTML='<div class=card><div class=row><input id=sq type=search placeholder="정답/회차 검색 (예: 흑점, 52회)" style="flex:1;min-width:10em;font:inherit;padding:6px 10px;border:1px solid var(--l);border-radius:8px;background:var(--c);color:var(--t)"><button class=b2 id=op>모두 펼치기</button><button class=b2 id=cp>모두 접기</button></div><span class=m>회차를 눌러 펼치면 빈칸별 정답표가 나와요.</span></div><div id=al></div>';
 const al=$('#al');R.forEach(r=>{const d=D[r],qi={};d.q.forEach((q,i)=>seg(q).forEach(x=>{if(x.l&&!qi[x.l])qi[x.l]=i+1}));const dt=document.createElement('details');dt.className='card';dt.dataset.r=r;
  dt.innerHTML='<summary><b>'+r+'회</b></summary><div class=tw><table><tr><th>빈칸</th><th>문제</th><th>정답</th></tr>'+Object.keys(d.a).map(l=>'<tr><td>'+l+'</td><td>'+(qi[l]||'')+'번</td><td>'+esc(d.a[l])+'</td></tr>').join('')+(d.e?'<tr><td colspan=3 class=es><b>서술형</b> '+esc(d.e)+'<br><mark>'+esc(d.ea||'')+'</mark></td></tr>':'')+'</table></div>';al.append(dt)});
 const f=()=>{const q=$('#sq').value.trim().toLowerCase();al.querySelectorAll('details').forEach(dt=>{const rm=q&&(dt.dataset.r+'회').includes(q);let any=!q||rm;dt.querySelectorAll('tr').forEach((tr,i)=>{if(!i)return;const m=!q||rm||tr.textContent.toLowerCase().includes(q);tr.style.display=m?'':'none';if(m)any=true});dt.style.display=any?'':'none';if(q&&any)dt.open=true})};
 $('#sq').oninput=f;$('#op').onclick=()=>al.querySelectorAll('details').forEach(x=>x.open=true);$('#cp').onclick=()=>al.querySelectorAll('details').forEach(x=>x.open=false)}
function home(){S=null;$('#tabs').innerHTML=[['r','회차 선택'],['x','랜덤'],['n','오답노트('+Object.keys(ST.wrong).length+')'],['a','정답표']].map(t=>'<button class="'+(TAB===t[0]?'on':'')+'" data-t='+t[0]+'>'+t[1]+'</button>').join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;home()});({r:tabR,x:tabX,n:tabN,a:tabA})[TAB]()}
const chk=(id,l,v)=>'<label><input type=checkbox id='+id+(v?' checked':'')+'> '+l+'</label>';
function tabR(){const a=$('#app');a.innerHTML='<div class=card><p class=m>풀고 싶은 회차를 눌러 선택하세요 (여러 개 가능). 칸 아래 초록 막대는 맞힌 비율이에요.</p><div class=grid id=g></div><div class=row><button class=b2 id=all>전체 선택</button><button class=b2 id=no>선택 해제</button><select id=rg><option value="">구간 선택…</option><option>1-10</option><option>11-20</option><option>21-30</option><option>31-40</option><option>41-50</option><option>51-60</option></select></div><div class=row>'+chk('sh','문제 순서 섞기',RS.sh)+chk('es','서술형 포함',RS.es)+'</div><button class=b1 id=st></button></div>';
 const g=$('#g'),upd=()=>{$('#st').textContent='선택한 '+SEL.size+'개 회차 시작';$('#st').disabled=!SEL.size;g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',SEL.has(+c.dataset.r)))};
 for(let r=1;r<=60;r++){const b=document.createElement('button');b.className='chip';b.dataset.r=r;if(!D[r]){b.disabled=true;b.innerHTML='<b>'+r+'</b><small>없음</small>';b.title='PDF에 없는 회차';g.append(b);continue}
  const us=U(r),s=us.filter(u=>ST.solved[u.k]).length;b.innerHTML='<b>'+r+'</b><small>'+s+'/'+us.length+'</small><i style="width:'+s/us.length*100+'%"></i>';b.onclick=()=>{SEL.has(r)?SEL.delete(r):SEL.add(r);upd()};g.append(b)}
 $('#all').onclick=()=>{R.forEach(r=>SEL.add(r));upd()};$('#no').onclick=()=>{SEL.clear();upd()};$('#rg').onchange=e=>{if(!e.target.value)return;const[x,y]=e.target.value.split('-').map(Number);SEL.clear();R.filter(r=>r>=x&&r<=y).forEach(r=>SEL.add(r));upd()};
 $('#st').onclick=()=>{RS.sh=$('#sh').checked;RS.es=$('#es').checked;let us=[...SEL].sort((a,b)=>a-b).flatMap(U).filter(u=>RS.es||!u.e);if(RS.sh)us=shuf(us);start([...SEL].length===1?[...SEL][0]+'회차':SEL.size+'개 회차',us)};upd()}
function tabX(){const a=$('#app');a.innerHTML='<div class=card><p class=m>선택한 회차 범위에서 문제를 무작위로 뽑아요.</p><div class=row>회차 <input type=number id=f min=1 max=60 value='+RS.from+'> ~ <input type=number id=t min=1 max=60 value='+RS.to+'> 문제 수 <select id=n>'+[10,20,30,50].map(n=>'<option'+(RS.n==n?' selected':'')+'>'+n+'</option>').join('')+'</select></div><div class=row>'+chk('es','서술형 포함',RS.es)+chk('un','안 푼/틀린 문제 우선',RS.un)+'</div><button class=b1 id=st>랜덤 퀴즈 시작</button></div>';
 $('#st').onclick=()=>{RS.from=+$('#f').value;RS.to=+$('#t').value;RS.n=+$('#n').value;RS.es=$('#es').checked;RS.un=$('#un').checked;let us=R.filter(r=>r>=RS.from&&r<=RS.to).flatMap(U).filter(u=>RS.es||!u.e);us=shuf(us);if(RS.un)us=[...us.filter(u=>!ST.solved[u.k]),...us.filter(u=>ST.solved[u.k])];start('랜덤 '+Math.min(RS.n,us.length)+'문제',shuf(us.slice(0,RS.n)))}}
function tabN(){const a=$('#app'),ks=Object.keys(ST.wrong).map(k=>ST.wrong[k]).sort((x,y)=>x.r-y.r||x.i-y.i);
 if(!ks.length){a.innerHTML='<div class=card style="text-align:center">🎉 오답노트가 비어 있어요.<br><span class=m>퀴즈에서 틀린 문제가 여기에 자동으로 쌓여요.</span></div>';return}
 const rs=[...new Set(ks.map(w=>w.r))];a.innerHTML='<div class=card><div class=row><select id=fr><option value="">전체 회차</option>'+rs.map(r=>'<option value='+r+'>'+r+'회</option>').join('')+'</select><span class=m id=cn></span></div><div class=row><button class=b1 id=rv>오답 복습 시작</button><button class=b2 id=cl>전체 삭제</button></div></div><div id=ls></div>';
 const draw=()=>{const f=$('#fr').value,v=ks.filter(w=>!f||w.r==f);$('#cn').textContent=v.length+'문제';$('#ls').innerHTML=v.map(w=>{const k=w.r+'-'+(w.i||'e');return'<div class=card><span class=tag>'+w.r+'회 '+(w.i?w.i+'번':'서술형')+'</span><button class=b2 style="float:right;padding:2px 10px" data-k="'+k+'">삭제</button><p class=q>'+(w.i?qhtml(w.r,w.i,new Set(Object.keys(w.l))):esc(D[w.r].e)+'<br><mark>'+esc(D[w.r].ea||'')+'</mark>')+'</p><div class=m>'+Object.keys(w.l).filter(l=>l!=='E').map(l=>l+' 내 답: '+esc(w.l[l].u||'(빈칸)')+' · '+w.l[l].n+'회 오답').join('<br>')+'</div></div>'}).join('');
  $('#ls').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{delete ST.wrong[b.dataset.k];sv();home()})};
 $('#fr').onchange=draw;draw();
 $('#rv').onclick=()=>{const f=$('#fr').value;start('오답 복습',shuf(ks.filter(w=>!f||w.r==f).map(w=>({r:w.r,i:w.i,k:w.r+'-'+(w.i||'e'),e:w.i?0:1}))),1)};
 $('#cl').onclick=()=>{if(confirm('오답노트를 모두 삭제할까요?')){ST.wrong={};sv();home()}}}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target.tagName;if(t==='BUTTON'||t==='SELECT'||(t==='TEXTAREA'&&!e.ctrlKey))return;const b=$('#nx')||$('#go');if(b&&!(t==='INPUT'&&!e.target.closest('.b'))){e.preventDefault();b.click()}});
home();
