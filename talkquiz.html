<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카톡퀴즈 1~60회</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1d2330;--m:#6b7385;--l:#e2e5ec;--p:#0b8fd8;--pl:#e1f3ff;--g:#2b8a3e;--gl:#e6f6ea;--r:#e03131;--rl:#fdecec;--y:#fff6d6}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--c:#1d222b;--t:#e8ebf2;--m:#99a1b3;--l:#323948;--p:#38aaf0;--pl:#14364c;--g:#5fd17a;--gl:#1c3326;--r:#ff7b7b;--rl:#3b2125;--y:#3a3414}}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}.b input{font-size:16px}@media(max-width:520px){#w{padding:12px}.card{padding:12px}.b input{width:9em}}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 -apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
#w{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px}
button.b1,button.b2{font:inherit;font-weight:600;padding:9px 16px;border-radius:9px;cursor:pointer;border:1px solid var(--p)}.b1{background:var(--p);color:#fff}.b2{background:var(--c);color:var(--p)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.m{color:var(--m);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.chip{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:6px 2px;font:inherit;cursor:pointer;text-align:center;line-height:1.3;position:relative;overflow:hidden}.chip b{font-size:17px;display:block}.chip small{font-size:11px;color:var(--m)}.chip.on{background:var(--pl);border-color:var(--p);outline:2px solid var(--p)}.chip:disabled{opacity:.35;cursor:default}.chip i{position:absolute;left:0;bottom:0;height:3px;background:var(--g)}
.q{margin:6px 0 12px;word-break:keep-all}.b{display:inline-flex;align-items:center;gap:3px;margin:2px 2px;vertical-align:middle}.b i{font-style:normal;color:var(--p);font-weight:700}.b input{width:11em;max-width:60vw;font:inherit;padding:3px 8px;border:1.5px solid var(--l);border-radius:7px;background:var(--bg);color:var(--t)}.b input:focus{outline:2px solid var(--p);border-color:var(--p)}.b input.good{border-color:var(--g);background:var(--gl)}.b input.bad{border-color:var(--r);background:var(--rl)}
.fill{color:var(--g);font-weight:700;border-bottom:2px solid var(--g)}.ref{color:var(--p);font-weight:700}mark{background:var(--y);color:inherit;padding:0 4px;border-radius:4px;font-weight:700}
textarea{width:100%;font:inherit;padding:8px;border:1.5px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t)}
.fb{font-size:15px;margin:4px 0;padding:6px 10px;border-radius:8px;background:var(--rl)}.fb.ok{background:var(--gl)}.fb button{margin-left:8px;font-size:13px;padding:2px 8px;border:1px solid var(--g);background:var(--c);color:var(--g);border-radius:6px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--pl);color:var(--p);padding:1px 8px;border-radius:99px}.warn{background:var(--y);padding:8px 12px;border-radius:8px;font-size:14px;margin-bottom:10px}
.bar{height:6px;background:var(--l);border-radius:9px;overflow:hidden}.bar div{height:100%;background:var(--p)}.hd{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:14px;color:var(--m)}
.big{font-size:42px;font-weight:800;color:var(--p);text-align:center}input[type=number],select{font:inherit;padding:5px 8px;border:1px solid var(--l);border-radius:8px;background:var(--c);color:var(--t);width:auto}input[type=number]{width:5em}
details summary{cursor:pointer;font-size:17px}details.card{padding:10px 14px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin-top:8px}td,th{border:1px solid var(--l);padding:5px 8px;text-align:left;font-size:15px}th{background:var(--pl)}td:first-child{color:var(--p);font-weight:700;white-space:nowrap}.es{background:var(--bg)}@media(max-width:520px){.tabs button{padding:10px 2px;font-size:14px}}
</style></head><body><div id="w"><h1>📚 카톡퀴즈 1~60회</h1><div class="tabs" id="tabs"></div><div id="app"></div></div>
<script>
const D={"1":{"q":["( ㉠ )은/는 전체 인구에서 생산가능 인구 비율이 늘어나면서 경제성장이 유리해지는 상황, 즉 부양인구보다 노동력이 빠르게 성장하는 낮은 부양비의 상황으로 인구 보너스라고도 한다.","스투퍼(Stouffer)는 인구 이동을 통해 A지역에 살고 있는 사람이 B지역의 기회를 포착할 수 있는 확률은 A지역과 B지역 간의 ( ㉡ )의 수에 반비례 하게 되며, 다른 지역으로부터 B지 역으로 온 이주자들과의 경쟁에 의해서도 영향을 받는다고 하였다.","현재의 사망력 수준에서 특정 연령의 한 개인이 생존할 수 있다고 예상되는 평균 연수를 ( ㉢ )(이)라고 한다.","( ㉣ )은/는 장기간 이동이 제로상태이고 조출생률과 조사망률이 동일하고 사망률 패턴이 항상적인 조건에서 추정된 인구로서 인구크기와 연령구조가 변하지 않고 성장률이 제로인 특 성을 가진다. 반면에 ( ㉤ )은/는 장기간 연령별출산율, 사망률이 변하지 않았을 때 기대되는 인구구조로서 인구크기는 변할 수 있지만 연령구조는 변하지 않는다.","( ㉥ )(이)란 한 명의 여성이 가임기간에 출산하게 될 딸의 수를 나타내는 것으로, 합계출산 율에다 총 출생아 중에서 여아가 차지하는 비중을 곱해서 구한다.","( ㉦ )은/는 소수 집단의 격리 정도를 계량화하는 가장 일반적인 방법으로, 현 분포 상에서 두 집단 간 거주 불균등성을 수치화한 것이다. 구체적인 수치의 의미는 완전한 거주 분포의 균형을 맞추기 위해 이동해야 하는 사람의 비율을 의미한다. ( ㉦ )의 몰공간성을 해결하기 위 해 ( ㉧ ), ( ㉨ ) 등이 제안되는데, ( ㉧ )은/는 소수 집단 구성원이 거주 지역에서 소수 집단 의 사람과 마주칠 확률이며, ( ㉨ )은 소수 집단 구성원이 거주 지역에서 주류 집단의 사람과 마주칠 확률이다.","개발도상국에서의 도시 성장은 선진국처럼 도시가 팽창함에 따라 중산층의 시장을 발전시 킬 수 있는 광범위에 걸친 직업 또는 기회의 팽창이 수반되지 않고 있다. 그렇게 때문에 진정 한 의미의 도시화와 대비되는 용어인 ‘가도시화’ 또는 ( ㉩ )(이)라는 용어를 사용하여 제3세계 도시화를 설명하고 있다.","무자녀에서 첫 번째 자녀 출산으로 이행하는 비율이나 현재 출산에서 다음 번 출산으로 이 행하는 비율을 ( ㉪ )(이)라고 한다.","( ㉫ )(이)란 총 인구를 연령순으로 나열할 때 정중앙에 있는 사람의 해당 연령을 말하는 것으로, 일반적으로 연령 분포가 비대칭인 경우에 많이 사용된다.","미국에서 라티노의 비율이 높은 캘리포니아, 애리조나, 뉴멕시코, 텍사스 주 등을 합쳐 ( ㉬ )(이)라고 부르며, 아프리카계 인구 비율이 높은 루이지애나, 미시시피, 앨라바마, 조지아 등 의 남부 지역은 ( ㉭ )(이)라고 일컫는다."],"a":{"㉠":"인구배당(demographic dividend)","㉡":"개입기회(intervening opportunity, 간섭기회)","㉢":"기대여명(life expectancy)","㉣":"정지인구(stationary population)","㉤":"안정인구(stable population)","㉥":"총재생산율(general replacement rate)","㉦":"상이지수(index of dissimilarity)","㉧":"고립지수(index of isolation)","㉨":"노출지수(index of exposure)","㉩":"의사도시화(儗似都市化)","㉪":"출산진도비(parity progression ratio)","㉫":"중위연령(median age)","㉬":"멕스-아메리카(Mex-America)","㉭":"딕시랜드(Dixieland)"},"e":"","ea":""},"2":{"q":["그리핀과 포드(E. Griffin & L. Ford)는 라틴아메리카의 도시구조를 모식화하였는데, 이는 동심원과 ( ㉠ ) 패턴의 결합으로 설명된다.","센서스 기간 사이 특정 연도의 인구 규모를 계산하는 것을 ( ㉡ )(이)라 한다.","( ㉢ )는/는 정규직보다 필요에 따라 계약직 또는 임시로 사람을 고용하는 경향이 커지는 경제상황을 일컫는 용어로 이에 따라 플랫폼 노동의 형태가 증가하고 있다.","하비(D. Harvey)는 자본이 생산과 소비 과정에 수반되는 거리마찰을 극복하기 위해 ( ㉣ ) 의 형태로 공간을 생산한다고 주장한다. ( ㉣ )에 대한 투자는 잉여자본을 흡수하고, 중요한 장소 간 치환 기능을 수행함으로써 자본주의 고유의 과잉생산 경향에 대응하는 ( ㉤ )의 수단 이 되기 때문이다.","( ㉥ )은/는 출생과 사망에 따른 인구 변동만을 나타낼 뿐 인구 이동의 결과는 포함하지 않 기 때문에, 일정 지역의 총인구수의 변화는 ( ㉦ )(으)로 나타낸다.","( ㉧ )은/는 지리적 경계보다 도시의 법률적 경계가 더 넓게 확정된 경우로 법률적 도시 경 계 안에 농촌 경관이 나타난다.","( ㉨ )인구는 어떤 지역에 통상적으로 거주하는 인구, ( ㉩ )인구는 어떤 지역에서 법적인 성원권을 인정받는 인구, ( ㉪ )인구는 통상적인 거주상태나 법적 성원권에 관계없이 어떤 지 역에 현재 있는 인구로 정의한다.","도시의 지속적인 확산은 개활지를 감소시켰으며 도시들이 결합하게 만들었다. 스프롤로 인 한 도시들의 연합을 ( ㉫ )(이)라고 하는데, 우리나라의 경우에도 서울-인천, 서울-수원 등 여 러 곳에서 발견된다.","도시 쇠퇴는 인구 감소가 지속되며 주택, 기반 시설 등의 공급 과잉으로 이어지는데, 이러 한 인구 감소와 유휴 시설이 증가하는 상황을 ( ㉬ )(이)라고 부른다. 이에 대한 대응으로 ( ㉭ ) 전략이 언급되는데, 이는 자원의 효율적이고 지속가능한 이용을 위해 도시의 기능과 거주를 공간적으로 집약시키는 도시 계획으로 영국에서는 어반빌리지(urban village), 미국에서는 뉴 어바니즘(new urbanism) 등의 유사한 표현이 사용되고 있다."],"a":{"㉠":"방사형(radial)","㉡":"인구추정(estimate)","㉢":"긱경제(gig economy)","㉣":"건조환경(built environments)","㉤":"공간적 조정(spatial fix)","㉥":"자연증가율(the rate of natural increase)","㉦":"인구성장률(population growth rate)","㉧":"과대경계도시(over-bounded city)","㉨":"상주","㉩":"등록","㉪":"현주","㉫":"코너베이션(conurbation) 또는 연담도시화","㉬":"축소도시(shrinking city)","㉭":"압축도시(compact city)"},"e":"","ea":""},"3":{"q":["이슬람권 도시의 ( ㉠ )은/는 구시가지로 시장과 수크가 입지하는데, 수크(suq)는 기능적으 로 전문화된 곳으로 ( ㉡ ) 경제라는 외부 효과의 이점이 발생한다.","고전생태학 모델이 경쟁의 측면을 강조하였음에 비해 신고전생태학은 ( ㉢ )과/와 협동 (commensalism)이란 측면에서 생태적 구성요소들 간의 상호의존성에 초점을 두고 있는 것이 특징이다.","밴스(J.E.Vance)에 의해 제안된 ( ㉣ )은/는 자동차가 도시 구조와 형태에 미친 영향을 보 여주는 것으로 페퍼로니 피자모델이라고도 불린다.","만(Mann)은 거주지는 ( ㉤ )(으)로 나타나지만, 소득 차이는 ( ㉥ )(으)로 나타나는 경우가 많다는 인식에 기초하여 주거 입지에 있어서 공업의 부정적 ( ㉦ )을/를 결합하였는데, 공업의 오염물질이 탁월풍을 통해 확산되면 거주 계층의 방향 분리가 나타난다고 하였다.","전문화되고 파편화한 도시 공간은 소위 ( ㉧ )(이)라고 불린다. 도시 형태가 차별화되고 일 관성 없는 조각들로 이루어진 게임보드와 같다는 의미이다.","소수민족 거주지 분리의 세 가지 유형으로 ( ㉨ ), 엔클레이브(enclave), 게토(ghetto)를 들 수 있는데, 이 중에서 ( ㉨ )은/는 이민자 소수민족 집단의 이민 유입 통로 역할을 한다.","( ㉩ ) 연계 효과란 선도 기업이 공급 기업을 유인하는 효과를 말하며, ( ㉪ ) 연계 효과란 선도 기업이 구매 기업을 유인하는 효과를 말한다.","( ㉫ )은/는 1975년에서 1990년까지 장기간의 내전으로 많은 인구가 국외로 이주하였다. 이 중에서 프랑스로의 대규모 이주는 20세기 전반부에 이 지역이 프랑스의 위임통치를 받았 던 것과 밀접한 관련이 있다.","인구를 정의하는 가장 기본적인 성원군의 기준은 ( ㉬ )과/와 ( ㉭ )(으)로 구분한다. ( ㉬ ) 은/는 어떤 공간에서 실제 생활하고 있는 사람을 성원으로 인정하는 관점이고, ( ㉭ )은/는 혈 통이 성원이 기준이 되는 관점이다."],"a":{"㉠":"메디나(Medina)","㉡":"국지화(지방화)","㉢":"공생(symbiosis)","㉣":"도시권역모델(urban realms model)","㉤":"동심원","㉥":"선형(섹터)","㉦":"외부효과","㉧":"키노자본주의(keno capitalism)","㉨":"거류지(colony)","㉩":"후방","㉪":"전방","㉫":"레바논(Lebanon)","㉬":"속지주의(territorial principle)","㉭":"속인주의(personality principle)"},"e":"","ea":""},"4":{"q":["( ㉠ )은/는 근원지로부터 거리가 멀어짐에 따라 어떤 현상의 중요성이 줄거나 사라짐을 의 미한다.","( ㉡ )은/는 해당 지역에서 생산된 재화 또는 서비스가 다른 지역으로 유통되는 산업이다.","보통사망률(조사망률)은 연령구조의 영향을 받기 때문에 두 인구 집단의 사망률을 직접 비 교할 수 없는 문제가 발생한다. 그래서 사망력을 비교하는 경우에는 ( ㉢ ), ( ㉣ ), ( ㉤ ) 등 의 지표를 대신 활용한다. ( ㉢ )은/는 생후 만1세가 되기 전에 사망한 아이 수를 총 출생아로 나눈 비율이고, ( ㉣ )은/는 새로 태어난 출생자가 앞으로 생존할 것으로 예상되는 평균 생존 연수를 말한다. 마지막으로 ( ㉤ )은/는 연령구조가 사망률에 미치는 영향을 제거한 사망률이 다.","( ㉥ )은/는 특정 시기의 도시의 핵심적 패턴과 형성 과정을 다른 도시보다 뚜렷하게 보여 줄 수 있는 전형적 도시를 말한다. 산업 혁명기의 ( ㉥ )(으)로 영국은 맨체스터, 미국은 시카 고를 사례로 들 수 있다.","브레너(N.Brenner)는 유연적 축적체제에 조응하는 사회조절 양식으로 ( ㉦ )와/과 신자유주 의를 언급하면서 포디즘 축적체제에 조응해 균형발전을 추구했던 공간적 케인스주의 도시의 시대는 저물고, ( ㉦ ) 경쟁국가 도시가 현시대 도시 경제의 전형적인 제도적 기반이 되었다는 주장을 펼쳤다.","( ㉧ )와/과 ( ㉨ )은/는 모두 거대도시라고 할 수 있지만, 대체로 ( ㉧ )은/는 큰 도시를 지 칭하는 용어로 사용되는 반면에, ( ㉨ )은/는 거대한 지역의 대도시 연합을 지칭하는 용어로 사용된다.","카스텔(M.Castells)은 자본주의 도시 내부의 불평등 문제를 ( ㉩ ) 개념으로 설명하였다. 반 면 사센(S.Sassen)은 세계도시의 이민 노동자들이 육체노동, 저임금 직종에 종사하며, 부유한 계층에 서비스를 제공해야 하는 상황을 ( ㉪ )라는 유명한 어구를 사용하여 함축적으로 표현 하였다.","테일러(P.taylor)는 ( ㉫ ) 부문 활동이 세계도시의 가장 핵심적인 성격을 드러낸다는 사센 (S. Sassen)의 연구를 계승했지만, 개별 도시차원이 아니라 ( ㉫ ) 부문에 속한 기업이 공간상 에서 다른 곳에 위치한 지사와 맺고 있는 연계의 강도에 집중하였다. 기업 간의 연계가 서로 맞물려 있다는 의미를 담아 테일러의 이 방식은 ( ㉬ ) 모델이라고 부른다.","( ㉭ )(이)란 위계적인 관료제를 통해 정부가 경제와 사회를 직접적으로 통제하는 것에서 벗어나 다양한 비정부 조직을 통해 간접적으로 통제하는 것을 의미하는 신조어로 Publc Management와 동의어로 간주되기도 한다."],"a":{"㉠":"거리조락(distance decay)","㉡":"기반산업(basic industries)","㉢":"영아사망률(infant mortality rate)","㉣":"기대수명(life expectancy at birth)","㉤":"표준화사망률(standardized death rate)","㉥":"패러다임 도시(paradigmatic city)","㉦":"슘페터주의(Schumpeterianism)","㉧":"메가시티(megacity)","㉨":"메갈로폴리스(megalopolis)","㉩":"이중 도시(dual city)","㉪":"중심부의 주변부화","㉫":"생산자서비스","㉬":"인터로킹네트워크(interlocking network)","㉭":"거버넌스(governance)"},"e":"","ea":""},"5":{"q":["중심지가 하나뿐일 경우에는 주변의 하위도시들이 종속되는 일극중심도시가 형성되나, 양쪽 에 중심지 2개가 보완적으로 연계되는 경우에는 ( ㉠ )을/를 형성한다. 3개 이상의 중심지가 각각 하위도시를 거느리며 별개의 도시권을 형성하면서 연계될 경우는 네트워크도시라 부른 다. 이런 허브 앤 스포크(hub and spoke) 형태의 도시체계는 보완적 관계에 있으므로 도시권 간의 연계에 있어서 이른바 ( ㉡ ) 효과가 발생한다.","도시학자 데이비스(Davis,1992)는 포스트모던 도시화의 경향을 전형적으로 보여주는 곳으로 로스앤젤레스를 들면서 ( ㉢ )(이)라고 칭하였다. 주거지는 심각하게 계층적으로 분화되어 있으 며, 부유층을 위한 ( ㉣ )은/는 이미 일반적인 현상이 되었으며, 주거와 소비공간은 점차 차별 화되고, 각각은 보이거나 보이지 않는 벽을 통해 외부와 차단되어 있다.","도시의 인구규모가 일정 수준에 도달하면 도시기능상 산업기반의 다양화, 행정력의 강화, 막해난 기존의 고정 산업, 물량 및 자금의 계속적인 지원을 토대로 도시 기능의 쇠퇴 및 인구 감소현상을 방지할 수 있다. 이때의 인구 규모를 ( ㉤ )(이)라 한다. 우리나라에서 ( ㉤ )은/는 인구 25~30만 명으로 간주하는 경향이 있다.","경제 및 생산 패러다임의 변화는 세계도시 등장의 중요한 배경으로 작용하였는데, 초국적 기업과 신국제분업의 증가는 ( ㉥ ) 형성에 영향을, 유연적 전문화를 바탕으로 하는 신산업클 러스터와 고차 생산자 서비스업은 세계도시 내부구조 형성에 영향을 주었다고 할 수 있다.","해리스(C.Harris)와 울먼(E.Ullman)은 단일한 도시 중심을 전제로 한 동심원지대이론 및 선 형이론과 달리 ( ㉦ )을/를 제기하였다.","소자(Soja)는 물리적으로 그리고 사회적으로 분절된 대도시라는 의미로 포스트모던 글로벌 메트로폴리스, 코스모폴리스, 포스트 메트로폴리스 등의 용어를 사용해 왔다. LA 중심부가 새 로운 글로벌 경제로 연결되는 통제센터로 성장하면서 ( ㉧ ) 현상이 강하게 나타남과 동시에 다양한 차하중심지와 에지시티를 발달시키는 ( ㉨ ) 현상이 동시에 나타나고 있다. 소자(Soja) 는 이러한 현상을 도시의 내부와 외부가 뒤바뀌었다는 의미에서 ( ㉩ )(이)라는 개념으로 설명 한다.","( ㉪ )은/는 도시빈곤을 해결하기 위해 도시계획을 혁신적으로 재구축하는 것으로 비공식부 문의 노동자들을 도시계획 속에 반영하여 보다 아름답고 보다 친환경적이며 보다 사회적으로 감성적 도시를 건설하는 지속가능한 도시의 한 형태이다.","이주자들은 같은 국가 출신의 사람들이 먼저 정착해 형성한 커뮤니티로 모이는 경향이 있 다. ( ㉫ )(이)란 이와 같이 친척이나 국적이 같은 사람들이 먼저 이주해 정착한 특정 지역으 로 사람들이 뒤를 이어 이주하는 것을 의미한다.","하비(D.Harvey)는 경제발전이 지리적 팽창을 수반하여 거리마찰이 감소하게 되는 과정을 ( ㉬ )(이)라고 하였다.","도시의 인구규모와 순위간에 반비례적 관계를 유지하면서 일련의 규칙성을 나타내는 현상 을 도시의 ( ㉭ )(이)라고 부른다."],"a":{"㉠":"회랑도시(corridor city)","㉡":"터널(tunnel)","㉢":"요새화된 도시(fortified city)","㉣":"빗장 공동체(gated community)","㉤":"도시성장임계규모(urban size ratchet)","㉥":"세계도시(계층)체계","㉦":"다핵심이론(multiple nuclei theory)","㉧":"재중심화","㉨":"탈중심화","㉩":"외부도시(exopolis)","㉪":"포용도시(inclusive city)","㉫":"연쇄 이주(chain migration)","㉬":"시공간압축(time-space compression)","㉭":"순위규모법칙(rank size rule)"},"e":"","ea":""},"6":{"q":["스웨덴의 경제학자 팔렌더(Palender)는 생산지, 생산비용, 수송비가 주어졌을 경우 생산자 의 상권이 ( ㉠ )에 따라 어떻게 결정되는가를 분석하고자 하였다.","후버(Hoover)는 베버(Weber)의 수송비 구조를 현실에 맞게 ( ㉡ )와/과 장거리 운송 효과 의 개념을 도입하였다. ( ㉡ )을/를 적용할 경우, 소비 시장과 원료 산지 사이에서 교통 수단 이 바뀌는 ( ㉢ )도 최적입지가 될 수 있다.","젤린스키(Zelinsky, 1971)는 ‘인구이동의 가설’에서 인구 이동 유형은 단계적으로 이동 유형 이 변천해나가는 것이라고 전제하였다. 그는 근대화의 정도에 따라 5단계로 구분하였는데, 초 기 전환사회에서는 주로 변방으로의 인구이동이 주된 유형으로 나타나지만, 후기 전환사회에 서는 ( ㉣ ) 현상이 활발하게 진행된다고 하였다.","제 3세계의 주요 도시들에서는 제조업 활동이 확산됨에도 불구하고 실업률은 계속 증가하 고 있다. 이는 농촌 이주자들이 급속히 유입되기 때문이다. 종종 제 3세계 도시 경제에서는 공식-비공식 부문이라는 이분적인 개념 정의를 하고 있는데, 그 중 비공식 부문을 종종 ( ㉤ )(이)라고 한다.","( ㉥ )은/는 미국과의 접경지대에 위치하고 수출을 원칙으로 하는 멕시코의 조립 가공업체 를 일컫는 말이지만 현재는 조립 가공 산업 및 노동 집약적 산업 전반을 가리키는 용어로 활 용된다.","( ㉦ )(이)란 도시팽창을 억제하고 도시주변지역의 개발행위를 제한하기 위해 설치된 공지 와 저밀도의 토지이용지대를 의미하는데, 이 용어는 도시 개혁운동가인 에베네저 하워드 (Ebenezer Howard)가 제시했던 전원도시 개념에서 유래하였다.","푸코(Michel Foucault)는 소위 ‘규율 사회(disciplinary society)'를 설명하기 위해 ( ㉧ )(이) 라는 은유를 사용한다. ( ㉧ )은/는 19세기 사상가 제레미 벤담(Jeremy Bentham)이 고안했던 감옥 모델을 말하는데, 이 모델에서 수감자들은 중앙 지점으로부터 감시에 노출된 상태에 놓 인다.","오늘날 국제 이주의 상당 부분은 경제적으로 발전한 국가들로 이주하고자 하는 젊고 교육 수준이 높은 사람들이 차지한다. 그러므로 기원지 국가의 입장에서는 선진국의 이주 정책이 해당 국가의 고급 인력이 빠져나가는 ( ㉨ )이/가 된다고 우려한다.","소자(Edward Soja)는 ( ㉩ )(이)란 용어를 사용하여 집단성을 도시가 발생하는 이유로 보았 다.","집합적 소비는 노동자계급과 자본가계급 모두로부터 환영을 받지만 지속가능성의 문제가 있다. 집합적 소비는 ( ㉪ )을/를 야기한다. 다시 말해 정부 재정의 부담이 늘어나는 것이다. 반면, 집합적 소비는 자본가계급에게는 ( ㉫ )을/를 선사한다. 자본가계급은 국가가 수행하는 노동력 재생산으로부터 이익을 챙기면서도 여기에 상응하는 재정적 비용은 직접 부담하지 않 는다.","사센(S.Sassen)은 고차생산자 서비스 활동의 강도를 기준으로 세계 도시 체계에서 최정점 에 있는 최고차 도시 세 곳, 뉴욕, 런던, 도쿄를 지적하며 이들을 ( ㉬ ) 도시라고 불렀다.","( ㉭ )은/는 지방 정부와 기업가가 연합하여 새로운 지역 이미지를 창출하고, 외부의 기업 가와 관광객으로부터 투자와 소비를 유치하기 위한 전략적 행동이다."],"a":{"㉠":"배달가격(delivery cost)","㉡":"기종점 비용(terminal cost)","㉢":"적환지(transshipment point)","㉣":"이촌향도(rural-to-urban migration)","㉤":"바자 경제(Bazaar Economy)","㉥":"마킬라도라(Maquiladora)","㉦":"그린벨트(greenbelt)","㉧":"판옵티콘(panopticon)","㉨":"두뇌유출(brain drain)","㉩":"시네키즘(Synekism)","㉪":"비용의 사회화(socialization of costs)","㉫":"수익의 사유화(privatization of profits)","㉬":"글로벌(Global)","㉭":"도시/장소마케팅"},"e":"","ea":""},"7":{"q":["중심 시장으로부터 작물의 재배구간이 A작물은 0~3km, B작물은 3~4km일 때, A작물의 재 배면적은 B작물의 ( ㉠ )배가 된다.","로빈슨(J. Robinson)은 세계도시 패러다임을 비판하면서 ( ㉡ ) 연구를 통해 도시들 간의 차이는 계층적 서열화가 아니라 다양성의 측면에서 이해되어야 한다고 역설하였다.","( ㉢ )은/는 스페인어로 ‘남쪽의 공동 시장’이라는 뜻으로 남아메리카 지역의 자유무역과 관 세동맹을 목표로 결성된 경제 공동체의 약칭이다.","경로의존성에 따른 지역 고착에 대해 그래버(G.Grabher)는 선도기업에 대한 연계 기업의 의존도가 높아지는 ( ㉣ ) 고착, 시장이 안정적일 것이라는 인지적 고착, 산업계와 지방 정부, 노동조합 간 상호협력이 정책 메커니즘을 변화시키지 못하도록 하는 ( ㉤ ) 고착 등 3가지 차 원으로 구분하였다.","소킨(Sorkin,1992)에 따르면 포스트모던 시대에 도시는 하나의 거대한 ‘테마공원’이 되어 감에 따라 세계에 대한 왜곡된 시각을 제공하는 다양한 시물레이션으로 가득 차 있다. 소킨은 이러한 도시 공간을 ( ㉥ )(이)라고 지칭한다. 이 결과 현대 도시의 다양한 포스트모던 건축물 은 아주 얕은 표면만을 나타내고 있으며, 이는 종종 디즈니화(Disneyfication)라고 불린다.","월퍼트(Wolpert)는 중부 스웨덴의 농업 패턴 연구를 통해, 농민의 경영 목표가 최적이고 지 식이 완벽하다면 성취될 수 있는 잠재적 생산성과 실제 생산성을 비교했는데, 다수의 농장이 잠재적 생산성에 미달되었음을 확인하였다. 그는 이러한 현상의 원인으로 대부분의 농민이 준 최적 의사 결정을 내리는 ( ㉦ ) 행동을 하기 때문이라고 하였다.","프리드먼(J.Friedman)은 월러스타인(I.Wallerstein)의 ( ㉧ ) 개념을 선별적으로 도입하여 도시화와 도시체계를 자본주의의 광범위한 변화 속에서 고찰하였는데, 세계도시 계층을 ( ㉨ ) 와/과 ( ㉩ )(으)로 분류하고, 각각 계층은 다시 1차 도시와 2차 도시로 세분하였다.","리카도(D.Ricardo)는 생산성의 차이에서 발생하는 지대의 차이를 ( ㉪ )(이)라고 하였는데, 이는 최하위 등급지에 대해 지불되는 ( ㉫ )을/를 초과하는 잉여 부분을 의미한다.","브라이언트의 포물선 모델은 중심도시에서 멀어질수록 집약화되는 ( ㉬ ) 모델과, 외곽으로 갈수록 조방적 토지 이용이 나타나는 ( ㉭ ) 모델의 절충을 시도한 이론이다."],"a":{"㉠":"9/7","㉡":"보통도시(ordinary cities)","㉢":"메르코수르(MERCOSUR)","㉣":"기능적","㉤":"정치적","㉥":"비지리적세계(ageographia)","㉦":"만족화(satisficing)","㉧":"세계 체제(World-System)","㉨":"중심부(core, 핵심부)","㉩":"반주변부(semi-periphery)","㉪":"차액 지대(different rent)","㉫":"절대 지대(absolute rent)","㉬":"싱클레어(Sinclair)","㉭":"튀넨(Thunen)"},"e":"","ea":""},"8":{"q":["진화   경제지리학   분야에서는   경제   성장과   쇠퇴의   지역적   궤적을   경로의존성(path dependence), ( ㉠ ), 그리고 회복탄력성(resilence)라는 3가지 유용한 개념을 이용하여 다루 고자 하였다.","이전까지 산업의 지리적 집중은 자연 조건을 강조하는 비교우위에 의해 설명되었지만, 신 경제지리학(NEG)의 입지이론은 수확체증과 ( ㉡ ) 경쟁, 그리고 자기순환적 집적효과에 의한 내생적 입지결정에서 찾고 있다. 특히 ( ㉢ )비용의 상호작용에서 내생적으로 발생하는 공간 집적력을 강조한다.","크루그먼(P.Krugman)에 따르면 시장규모효과는 기업이 규모가 큰 시장에 입지하고 규모가 작은 시장에 대해서는 수출로 대응하는 효과로 ( ㉣ ) 연계를 구성한다. 거주비용효과는 ( ㉤ ) 연계를 구성하며 기업의 입지가 지역의 거주생활비용에 미치는 효과를 나타낸다.","최근 IT부문의 엔지니어와 사업가의 초국적 이동 현상은 주변부에서 핵심부로의 전통적인 ‘두뇌유출’패턴에서 당사국 모두에 호혜적인 ( ㉥ )(으)로 대체되고 있다. 이는 핵심부에서 배 양된 기능, 자본, 기술을 모국에 주입함으로써 주변부 지역의 성장에 긍정적 기여를 하게 된 다.","분공장 경제에서 범세계적 네트워크에 비해 국지적 네트워크가 불량한 것은 ( ㉦ ) 수준 및 역량이 낮아 초국적 기업들이 중앙집권적 소싱 정책을 채택하기 때문이다.","포디즘적 생산의 조직화에서 가장 중요한 요소는 과학적 관리법(scientific management) 이다. 이는 생산성을 극대화하기 위해 합리적인 원리에 따라 노동을 재조직하는 것으로 이를 주창했던 학자의 이름을 따서 ( ㉧ )(이)라고도 불린다.","스콧(A.Scott)과 스토퍼(M.Storper)는 내부화가 아니라 공동 입지를 통해서 ( ㉨ ) 감소가 가능하다고 보았으며, 지역을 기반으로 형성된 신뢰와 협력의 문화, 제도적 자산을 강조하는 비거래적 상호의존성(untraded interdependency) 개념을 제시하면서, 학습과 혁신에 유리한 사회적, 지리적 근접성을 바탕으로 한 관계적 네트워크를 ( ㉩ ) 통합의 대안으로 간주했다.","( ㉪ )은/는 상대적으로 부유한 교외지역 거주자들이 비용을 지불하지도 않고 가난한 도심 부의 서비스를 이용하기 때문에 도시의 재정 불균형이 더욱 악화되었다는 주장이다.","( ㉫ )(이)란 선진국의 경제활동이 저임금 국가와 지역으로 입지 이동하는 현상을 말한다. 이는 1960년대부터 나타난 제조업의 특징으로 신국제노동분업(NIDL)의 원인이며, 과정이자 결 과이기도 하다. 최근에는 인도의 콜센터산업처럼 루틴화된 서비스업에서도 나타나기 시작했다.","베버(A.Weber)는 최소비용지점 선정을 위하여 원료지수라는 개념을 도입하였는데, 이는 사용된 ( ㉬ )의 무게를 최종생산물의 무게로 나눈 값이다. 또한 ( ㉭ )은/는 원료지수에 1을 더한 값이 된다."],"a":{"㉠":"경로 창출(path creation)","㉡":"불완전(imperfect)","㉢":"운송(shipping)","㉣":"후방","㉤":"전방","㉥":"두뇌 순환(brain circulation)","㉦":"로컬소싱(local sourcing)","㉧":"테일러리즘(Taylorism)","㉨":"거래 비용(transaction cost)","㉩":"수직적(vertical)","㉪":"교외착취론(Suburban Exploitation Thesis)","㉫":"오프쇼어링(Offshoring)","㉬":"국지원료(편재원료, localized raw materials)","㉭":"입지중량(locational weight)"},"e":"","ea":""},"9":{"q":["뢰쉬(Lősch)는 계층적이라기보다는 순차적으로 k=3, 4, 7, 9, (                    ㉠   ), 13, 16, 19, 21, 25의 체계에 따른 서로 다른 육각형망의 공간조직을 구축하였는데, k값의 변화는 각 중심지 상품의 (               ㉡    )와/과 관련되고, 이에 따라 (   ㉡   )을/를 만족시키는 보완구역도 증가하기 때문에 육각형의 형상도 커지게 된다. 뢰쉬(Lősch)의 k=(                       ㉠    ) 체계는 완전 포섭되는 중 심지 (            ㉢       )개, 그리고 분할 포섭되는 중심지 (     ㉣   )개로 구성된다.","(        ㉤       )(이)란 지리적으로 가까운 두 개의 도시가 도시의 성장과 팽창에 따라 하나의 권 역으로 통합되어 서로 상생, 발전해가는 현상을 가리키는 것으로 미국 미네소타 주의 미니애 폴리스와 세인트 폴, 헝가리의 부다와 페스트, 우리나라의 마산과 창원 등을 사례로 들 수 있 다.","(        ㉥       )이론은 로스토(W.Rostow) 등에 의해 주장된 발전에 대한 지배적인 접근법으로, 선진국이 19세기 산업혁명을 통해 발전을 경험했던 것과 유사한 방식으로 개발도상국도 선형 적인 변화과정을 겪으며 (                   ㉥   )을/를 이룩할 것이라는 기본적인 전제가 깔려있다. 반면, 풀뿌리 발전은 발전 정책에 대한 처방보다 개발도상국의 빈민이 겪는 실질적인 문제와 욕구에 관심을 기울인다. 풀뿌리 발전 접근은 1960~70년대의 (                         ㉦     ) 전략에서 나온 것인데, ( ㉦       )(이)란 근대화 정책에서 배제되었던 빈곤층의 일상생활에 관심을 기울이는 개념이다.","(        ㉧       )의 논리는 자본에 내재된 대립적 경향, 즉 생산수준 및 조건의 차별화 경향과 균 등화 경향에서 동시에 도출된다. 자본은 잉여가치를 생산하고 자본의 기반을 확장하기 위해 ( ㉨       )에 지속적으로 투자한다. 또한 동시에 자본은 (               ㉨       )에서 지속적으로 철수하고 다 른 곳으로 이동해 더 높은 이윤율의 이점을 얻고자 한다. 물질적 형태를 갖춘 생산적 자본의 공간적 비이동성은 가치로서의 자본이 영구적으로 순환하는 것만큼이나 필수적이다. 따라서 자본주의의 (                 ㉧   )은/는 사용가치와 교환가치 간 더 근본적인 모순의 지리적 표현으로 이 해할 수 있다.","매시(D.Massey)는 ‘노동의 공간 분업’에서 지역 불균등의 메커니즘을 (                        ㉩    )의 외부 통 제 메커니즘으로 주장하였다.","도시권 안에서의 네트워크는 시너지 효과 발생의 메커니즘에 따라 클럽 네트워크와 웹 네 트워크로 구분되는데, 전자의 경우 같은 종류의 기능들로 특화되어 상호 간의 협력을 통하여 (       ㉪       )을/를 추구하는 유형으로, 도시들 간에 (          ㉫   ) 시너지를 얻을 수 있다. 반면, 후 자의 경우는 도시들이 이질적인 기능들로 특화가 이루어짐으로써 상호보완성이 생기게 되고, 이 보완성을 기초로 (                 ㉬   )을/를 추구하는 이른바 (      ㉭       ) 시너지를 얻게 된다."],"a":{"㉠":"12","㉡":"최소요구치(threshold)","㉢":"7","㉣":"12","㉤":"쌍자 도시(Twin cities)","㉥":"근대화(modernization)","㉦":"기초수요(basic needs)","㉧":"불균등발전(uneven development)","㉨":"건조환경(built environment)","㉩":"분공장 경제(Branch Plants Economy)","㉪":"규모의 경제","㉫":"수평적","㉬":"범위의 경제","㉭":"수직적"},"e":"","ea":""},"10":{"q":["아직 자생력을 갖추지 못한 초기 단계의 산업을 마치 어린아이처럼 ‘보살핌’이 필요하다는 비유에서 ( ㉠ )(이)라 한다. 이때 구체적인 ‘보살핌’에는 관세 부과, 수입 제한, 보조금 지급 등이 있다.","( ㉡ )기업은 원래 핵심 선도기업을 지칭하는 용어인데, 공공부문의 고용 비중이 높게 나타 나는 지역에서는 국가가 가장 큰 고용주로 기능하기 때문에, 이러한 지역을 국가 ( ㉡ )형 지 역이라 부른다.","신자유주의적 처방이 집약된 ( ㉢ )은/는 IMF, 세계은행, 미국 정부 간에 이루어진 것으로 개방화, 민영화, 탈규제, 유연화, 무역 촉진 등의 근간 정책을 제공하였다.","펙(J.Peck)에 의해 제시된 ( ㉣ )은/는 중앙정부가 권한이양을 하거나 금융 및 예산상의 압 력을 하향 이전하면서 이에 따른 비용이 하위국가 정부로 전가되는 현상을 말한다.","긴축 재정 정책은 공공지출 수준은 ( ㉤ )하고, 세율을 ( ㉥ )함으로써 재정 건정성을 확보 하려는 조치를 의미한다. (㉤과 ㉥에는 ‘인상’, ‘인하’, ‘확대’, ‘축소’ 중에서 선택 기입할 것)","지역의 발전전략과 제도 간의 전형적인 불일치 현상 중에서 ( ㉦ )은/는 거대한 전략의 앞 바퀴와 초라한 제도적 뒷바퀴가 부조화를 이루는 상태를 의미한다.","소규모의 새로운 기술혁신 기업은 경제적 기반이 약한 경향이 있기 때문에, 다양한 지역 내 서비스, 즉 ( ㉧ )라는 외부효과를 누릴 수 있는 도시 중심부에 입지하게 된다. 이것이 이 른바 B. Chinitz의 ( ㉨ ) 모형이다.","연평균 기온 25℃, 최한월 기온 20℃, 연강수량은 715mm인데 강수의 80% 이상은 하절기 에 집중되는 지역의 기후형은 ( ㉩ )이다. (쾨펜-가이거의 구분 기준을 바탕으로, 고산 기후는 고려하지 않으며, 3차 구분이 가능한 경우에는 3차까지 기호로 쓸 것)","연평균 기온 15℃, 최난월 기온 20℃, 최한월 기온 10℃, 연강수량은 310mm인데 강수의 70% 이상은 동절기에 집중되는 지역의 기후형은 ( ㉪ )이다. (쾨펜-가이거의 구분 기준을 바 탕으로, 고산 기후는 고려하지 않으며, 3차 구분이 가능한 경우에는 3차까지 기호로 쓸 것)","동절기나 하절기로 강수가 집중되지 않고, 연평균 기온이 11℃인 지역이 사막 기후가 되 기 위해서는 연강수량이 ( ㉫ )mm 이하가 되어야 한다.","연평균 기온 5℃, 연교차 5℃, 연강수량은 910mm인 지역의 기후형은 ( ㉬ )이다. (쾨펜- 가이거의 구분 기준을 바탕으로, 고산 기후는 고려하지 않으며, 3차 구분이 가능한 경우에는 3차까지 기호로 쓸 것)","연평균 기온이 18℃이고 하절기에 강수가 집중되는 지역이 습윤 기후가 되기 위해 필요한 최소 연강수량은 ( ㉭ )mm 이다."],"a":{"㉠":"유치산업(infant indutry)","㉡":"앵커(anchor)","㉢":"워싱턴 합의(Washington Consensus)","㉣":"긴축 어바니즘(austerity urbanism)","㉤":"축소","㉥":"인상","㉦":"페니파딩(penny-farthing)","㉧":"도시화 경제","㉨":"인큐베이터(incubator)","㉩":"BSh","㉪":"Csb","㉫":"180","㉬":"ET","㉭":"640"},"e":"","ea":""},"11":{"q":["컨테이너(container) 화물과 달리 (   ㉠         )은/는 포장하지 않고 대량으로 그대로 실어 나 르는 화물로 배의 화물창에 들이붓거나 쌓아서 운송한다.","GPN 2.0의 기업 특수적 전략 중 (       ㉡       ) 전략은 비용보다 역량이 중요할 때 채택되며 이 경우 GPN의 조직은 수직적인 네트워크 경향을 가지게 된다. 반면 (                   ㉢   ) 전략은 전략 적 제휴, 협력적 아웃 소싱 등의 방법을 사용하며 GVC 가치 사슬로는 관계형 또는 모듈형 거 버넌스와 유사하다.","(    ㉣   )(이)란 무지해서 환경을 망치는 것이 아니라 생존을 위해 척박한 땅을 이용하기 때문에 결과적으로 환경 파괴를 일으키는 사람들을 일컫는 용어이다.","(    ㉤   ) 체계는 부품 및 제품의 대량 비축과 드문 배송에 기반을 둔 체계에서 소량 상 품의 유연한 배송에 기반을 둔 체계로의 변화로 특히 항공과 지상의 수용력을 모두 사용하는 작고 빠르고 빈번한 배송을 의미한다.","미국 사회학자 미첼(T.Mitchell)이 제시한 용어인 (         ㉥   )은/는 석탄을 캐고 운반하는 노 동자와 노조가 권력을 가지게 되면서 나타난 대량산업체제 기반의 민주주의를 지칭한다.","런던의 도크랜드(Dockland)에 위치한 (        ㉦     )은/는 JP모건, 시티그룹, 마스터카드 등을 포함해 30개가 넘는 금융그룹들의 본사 및 유럽본부가 있는 금융집적지구이다. 이 곳은 과거 런던의 대표적인 항만 지역이었으나 산업구조의 변화에 따라 물류기능이 쇠퇴하면서, 재개발 과정을 거쳐 현재와 같은 금융과 고급주거지의 집적지로 재탄생하였다.","(    ㉧   )(이)란 실업 상태에 있는 사람들이 수당을 받기 위해서 그 대가로 어떤 일을 수 행해야 하는 시스템을 일컫는다. 이는 복지 혜택의 수혜자들을 통제하려는 일련의 정책들과 관련되어 있다.","유럽 연합(EU)은 베네룩스 관세동맹에서 시작하여 유럽석탄철강공동체(ECSC) → (                      ㉨ ) → 유럽 공동체(EC)를 거쳐 1994년 1월에 출범하였다.","생산 조직을 유연한 체제로 재편하는 방식에는 (               ㉩    ), 오프쇼링(Off-shoring), 아웃소 싱(Outsourcing) 등이 있는데, 이중에서 (       ㉩    )은/는 일반적으로 기업의 규모와 업무를 축 소시키는 것을 의미한다.","(   ㉪   )(이)란 요인분석이나 다중회귀분석과 같은 다변량적 기법에서 사용되는 독립변 수들이 공간적 연속으로 인해 상호의존성을 가진다는 의미인데, 이로 인해 이것을 고려하지 않은 분석기법은 불안정하거나 신뢰도가 낮은 결과를 야기한다는 것을 지칭하기도 한다.","사이드(E.Said)의 저서 (      ㉫   )을/를 통해 서구의 예술, 문학, 대중문화가 왜곡된 렌즈 를 통해 동양을 이국적이고 낯설고 위험하고 불안정한 것으로 묘사한다고 주장하였다. 그러한 일련의 반복적인 담론과 재현은 공상과학 소설이나 유토피아 소설과 같은 (              ㉬   )(이)라고 하였다.","(   ㉭   ) 엔클레이브란 다른 사람들을 배척하고 거주지의 동질성을 유지하려고 하는 내 적 응집력이 지배적인 거주지 군집으로 종종 빗장 공동체(Gated community)로 불린다."],"a":{"㉠":"벌크 화물(bulk cargo)","㉡":"내부조정(intra-firm coordination)","㉢":"기업 간 파트너십(inter-firm partnership)","㉣":"한계적 농민(marginal farmers)","㉤":"린유통(laen distribution)","㉥":"탄소 민주주의(carbon democracy)","㉦":"카나리워프(Canary Wharf)","㉧":"근로복지(workfare)","㉨":"유럽경제공동체(EEC)","㉩":"다운사이징(Downsizing)","㉪":"공간적 자기상관(spatial autocorrelation)","㉫":"오리엔탈리즘(Orientalism)","㉬":"상상의 지리(imaginative geography)","㉭":"배타적(exclusionary)"},"e":"","ea":""},"12":{"q":["빙기(Glacial Period)는 현재보다 ( ㉠ ) 기온이 낮았던 시기이다. 그러므로 ( ㉡ )의 승리가 아니라 ( ㉠ )의 패배라고 할 수 있다. 밀란코비치(Milnkovitch) 주기는 빙기 유도 조건을 의미 하는 것으로 작은 ( ㉢ )이/가 핵심이다. 예를 들어 자전축의 기울기가 감소하면 ( ㉢ )이/가 감소하여 빙기로 전환될 수 있다.","항공기는 일반적으로 무해통항권이 인정되지 않기 때문에, 인도주의적 입장에서 비행기가 공격받지 않고 안전하게 지나갈 수 있도록 합의된 통로를 ( ㉣ )(이)라고 한다.","( ㉤ )(이)란 외국 영토 내에 있는 자국계 주민의 생활 지역을 탈환하려는 정치상의 운동 또는 영토회복 운동이다.","중국이 난사 군도라고도 부르는 ( ㉥ ) 군도는 수많은 암초와 산호초로 이루어진 작은 섬들 에 불과하지만 인도양과 태평양을 잇는 중요한 항로이자 군사적 요충지로 필리핀, 중국, 베트 남, 타이완, 브루나이, 말레이시아 등이 영유권 분쟁을 벌이고 있다.","포스트모던 도시성에 관한 디어와 플루스티(Dear & Flusty)의 상징적인 연구는 도시 형태 에 대한 문화적 해석을 강조한다. 부유층 및 전문직 종사자 계층의 근린 지역을 일반적인 현 실과 분리되어 인위적이고 부자연스러운 의미가 부여된 장소인 ( ㉦ )(으)로 인식하였고, 세계 경제에 대한 영향력 있는 통제자들을 도시의 ( ㉦ )을/를 소비하는 데 관심이 있는 ( ㉧ )(으) 로, 점차 권리를 박탈당하고 학대받는 대중을 ( ㉨ )(으)로 표현하였다.","( ㉩ )은/는 두 개 이상의 초국적 기업이 기업이 지닌 경영 자원의 일부를 상호 교환하거나 공유하는 것으로 참여하는 기업들은 소유권의 변화를 경험하지 않으며, 대체로 새로운 자기자 본 투입도 발생하지 않는다.","( ㉪ )은/는 북해나 발트 해 연안의 저습지 개간 과정에서 형성된 것으로 그 형태로 보면 ( ㉫ )에 해당한다. 저습지 상에 일정한 방향으로 제방을 쌓아 올린 후 그 위에 길과 택지를 조 성하고, 제방과 직각 방향으로 장방형의 경지가 택지와 동일한 폭으로 길게 전개되는 매우 규 칙적인 공간 구조이다.","두 정치 주체간의 경계가 하천인 경우, 가항 하천이면 주수도의 중앙선을 국경선으로 삼는 것을 ( ㉬ )의 원칙이라고 한다.","초국적 이주에 관한 이론 중 ( ㉭ ) 이론은 이주민 유입 국가의 노동 부족에 초점을 두는 데, 목적지 도시나 국가의 경제에서 낮은 지위 일자리의 노동 수요가 국제이동을 결정한다고 설명한다."],"a":{"㉠":"여름(summer)","㉡":"겨울(winter)","㉢":"연교차(annual temperature range)","㉣":"공중 회랑(air corridor)","㉤":"이레덴티즘(Irredentism)","㉥":"스프래틀리(Spratly)","㉦":"드림스케이프(Dreamscape)","㉧":"사이버조아지(Cybergeoisie)","㉨":"프로토서프(Protosurp)","㉩":"전략적 제휴(strategic alliance)","㉪":"소택지촌(沼澤地村, marschhufendorf)","㉫":"열촌(列村)","㉬":"탈베그(Thalweg, 最深溝)","㉭":"이중노동시장(dual labor market)"},"e":"","ea":""},"13":{"q":["기업이 지식을 인식, 채택, 활용할 수 있는 역량을 ( ㉠ )(이)라 하는데, 이는 기업문화와 언 어의 공유를 바탕으로 한다.","( ㉡ )은/는 어떤 사회에 속한 개인이나 집단에 대한 정보를 광범위하게 수집하고 분석, 활 용하는 사회로 ‘조지 오웰(G.Orwell)의 1984년’에는 ( ㉡ )의 모습이 잘 묘사되어 있다.","뻬루(Perroux)가 제시한 ( ㉢ )의 원래적 개념은 지리적인 실체이기보다 전체산업을 견인하 는 핵심산업 또는 핵심기업을 의미한다.","재개발 방식은 철거재개발과 ( ㉣ ), 도심재활성화로 구분할 수 있다. ( ㉣ )은/는 대부분의 기존시설을 보존하고 노후불량요인만 제거하는 소극적 재개발로 다시 개량재개발과 ( ㉤ )(으) 로 나뉜다.","( ㉥ )은/는 공적부조가 실업자와 극빈층 등 취약계층에게만 제공되어야 한다는 관점에서의 복지 정책을 말한다.","( ㉦ )은/는 기업 간의 분업에 의한 협력의 지속적 관계를 의미하며, 거래관계에서 기업조 직 내와 기업 간 구조가 혼합된 중간적 유형의 거래관계는 물론 기업 활동과 관련된 여타의 모든 기업과의 관계 유형을 포괄한다.","기후학자들은 건조기후(Dry climate)를 ‘연 강수가 증발에 의해 가능한 물 손실보다 적은 기후’로 정의한다. 이 경우 건조는 연 강우만이 관련되어 있는 것이 아니다. 이것은 동시에 증 발의 함수가 되기 때문에 온도와도 밀접한 관련이 있다. 온도가 올라가면 증발 가능량도 증가 한다. 예를 들어, 차고 습한 공기로 증발이 적어 충분한 양의 물이 토양에 남게되는 북부 스 칸디나비아의 경우 200mm의 강수는 산림을 지탱하기에 충분한 양이다. 그러나 네바다나 이 란에서는 뜨겁고 건조한 공기로의 증발이 커서 같은 양의 비로는 아주 드문드문 분포된 식생 만을 지원할 수 있다. 그러므로 건조 및 습윤 기후의 확실한 경계를 구분하기 위해 쾨펜의 기 후 분류는 세 가지 변수, 즉 연평균기온, ( ㉧ ), ( ㉨ )이/가 포함된 공식을 사용한다.(㉧과 ㉨ 은 순서를 바꿔 써도 무방함)","혼합비가 1000/19인 공기의 비습은 ( ㉩ )이다.","연평균 기온 22℃, 최난월 기온 29℃, 최한월 기온 15℃, 연강수량은 340mm인데 강수의 70% 이상이 하절기에 집중되며 최소월강수량과 최다월강수량은 열배 이상 차이난다. 이 지역 의 기후형은 ( ㉪ )이다. (쾨펜-가이거의 구분 기준을 바탕으로, 고산 기후는 고려하지 않으며, 3차 구분이 가능한 경우에는 3차까지 기호로 쓸 것)","연평균 기온 16℃, 최난월 기온 20℃, 최한월 기온 12℃, 연강수량은 240mm인데 강수의 70% 이상이 동절기에 집중되며 최소월강수량과 최다월강수량은 열배 이상 차이난다. 이 지역 의 기후형은 ( ㉫ )이다. (쾨펜-가이거의 구분 기준을 바탕으로, 고산 기후는 고려하지 않으며, 3차 구분이 가능한 경우에는 3차까지 기호로 쓸 것)","( ㉬ )은/는 국가의 개입 축소, 통화주의의 실천, 케인즈주의적 복지국가가 후퇴하는 양상 으로 전개되었다. 반면 ( ㉭ )은/는 국가가 적극적으로 시장과 경쟁의 논리를 사회 전반에 확 산시켜 경제적 상식이 되었다."],"a":{"㉠":"흡수역량(absorptive capacity)","㉡":"감시사회(surveillance society)","㉢":"성장극(growth pole)","㉣":"수복재개발(rehabilitation)","㉤":"보전재개발(conservation)","㉥":"잔여적 복지(residual welfare)","㉦":"네트워킹(networking)","㉧":"연강수량(annual precipitation)","㉨":"강수의 계절패턴(seasonal precipitation pattern)","㉩":"50","㉪":"BWh","㉫":"BSk","㉬":"롤백 신자유주의(roll-back neoliberalism)","㉭":"롤아웃 신자유주의(roll-out neoliberalism)"},"e":"","ea":""},"14":{"q":["극투영 방위도법에서는 경선이 직선으로 나타난다. 북극투영의 경우 경선은 시계 방향으로 본초자오선 - ( ㉠ ) - 180°- ( ㉡ ) 순으로 표시되겠지만, 남극투영은 경선이 시계 방향으로 본초자오선 - ( ㉡ ) - 180°- ( ㉠ ) 순서로 표시된다. (㉠과 ㉡에는 동경 90°, 서경 90° 중에 서 선택 기입할 것)","화씨(Fahrenheit temperature) 86°F는 섭씨(Celsius temperature)로 ( ㉢ )°C에 해당하고, 섭씨(Celsius temperature) -40°C는 화씨(Fahrenheit temperature)로 ( ㉣ )°F이다.","( ㉤ ) 정책이란 국가의 예산과 채무삭감을 통해 가격, 임금, 공공지출을 줄이는 경제조정 방식을 의미한다.","( ㉥ )은/는 정부나 기업에 속하지 않고 시민들이 자발적으로 모여 사회문제 해결과 공익 증진을 위해 활동하는 비영리 단체를 총망라한 개념이다.","공동시장은 회원국 간의 생산요소의 자유이동을 보장하는 경제 협력체로 1967년 결성되어 2015년 현재 10개의 회원국을 보유한 ( ㉦ )이/가 대표적 사례이다.","렐프(E.Relph)는 장소에 대해 가지는 다양한 수준의 애착이나 관여의 정도를 ( ㉧ )(이)라고 하였다.","선진국과 개발도상국 간의 경제를 통합하고 이 위에 새로운 국제경제 질서를 부여하기 위 해, GATT(관세 및 무역에 관한 일반 협정)체제에서 각 회원국의 관세 부과 및 수출입제한 조 치 등의 제반 무역 장벽을 철폐하여 상품과 서비스의 교역 및 투자가 원활히 이루어져 각 회 원국의 지속적인 경제성장을 유도하는 목표를 공통점으로 하는 ( ㉨ )이/가 출범하고, ( ㉩ )이 /가 나타났다. ( ㉨ )은/는 모든 회원국들에게 최혜국 대우를 보장해주는 다자주의 원칙이고, ( ㉩ )은/는 양자주의 및 지역주의적인 특혜무역 체제이다.","( ㉪ )은/는 저개발국가의 소외된 생산자와 노동자가 만든 상품에 대한 정당한 대가를 치르 며 이들의 이윤을 보호하자는 무역 운동이다.","( ㉫ )은/는 선행성 경계에 반대되는 것으로서, 문화가 형성된 후에 그 문화의 한계선을 따 라 생기는 경계이다. 따라서 대개는 문화지역(cultural region)의 구분선과 국경선이 일치된다.","( ㉬ )은/는 교외화가 심화되어 중심도시에서 더 먼 곳까지 인구가 이동하는 현상으로 원 교 교외화 또는 확장된 교회화로 이해할 수 있다.","( ㉭ )은/는 장소를 글로벌화의 맥락에서 새롭게 사유하려는 도린 매시(Doreen Massey) 의 저술에서 등장한 개념이다. 장소를 뚜렷한 경계를 지닌 고립적인 대상물로 파악하기보다, 광범위한 사회관계들이 교차하고 연결되며 수렴하는 일종의 만남의 지점 또는 결절로 이해한 다."],"a":{"㉠":"서경 90°","㉡":"동경 90°","㉢":"30","㉣":"-40","㉤":"긴축(austerity)","㉥":"비정부기구(NGO)","㉦":"동남아시아국가연합(ASEAN)","㉧":"내부성(insideness)","㉨":"세계무역기구(WTO)","㉩":"자유무역협정(FTA)","㉪":"공정무역(fair trade)","㉫":"종행성 경계(subsequent boundary)","㉬":"엑스어바니제이션(exurbanization)","㉭":"글로벌 장소감(Global Sense of Place)"},"e":"","ea":""},"15":{"q":["위도 ( ㉠ )°에서 단위면적당 입사되는 태양에너지는 적도에 입사되는 태양에너지 양의 1/2 이 되고, 북반구 또는 남반구의 표면적의 1/2이 되는 위도는 ( ㉡ )°이다. 예를 들어 북위 ( ㉡ )°선은 북반구 전체 표면을 정확히 2등분하는 선이 된다.","가시광선이나 적외선 등과 같이 대기에 흡수되지 않고 지표에 도달하는 전자기파의 파장 범위를 ( ㉢ )(이)라고 한다.","공기에서 수증기를 제외한 나머지 기체를 ( ㉣ )(이)라 한다. ( ㉣ )에는 질소, 산소, 아르곤 과 같은 주성분 이외에 이산화탄소를 포함한 미량의 기체들이 존재한다.","전리권에서는 태양 표면의 폭발로 발생한 강한 전자기파들로 인해 라디오파를 흡수하여 통 신 두절이 되는 ( ㉤ ) 현상이 일어난다. ( ㉤ ) 현상은 이것을 연구한 미국의 물리학자의 이 름을 딴 것이다.","빛이 공기분자, 에어로졸, 구름입자 등과 같이 굴절률이 다른 작은 입자를 만나면 진행해오 던 방향과 다른 방향으로 전파하는데, 이를 ( ㉥ )(이)라고 한다. ( ㉥ )은/는 저위도보다 ( ㉦ ) 이/가 긴 고위도에서 두드러진다.","섬은 지형학적으로 그 성인에 따라 ( ㉧ )와/과 ( ㉨ )(으)로 구분한다. ( ㉧ )은/는 대륙과의 관계, 즉 육지의 침수나 해안의 이수에 따라 형성된 섬이고, ( ㉨ )은/는 육지와 무관하게 화 산이나 산호에 의해 형성된 섬으로 깊은 바다에 주로 위치한다.","남아메리카 대륙 서부의 저위도 해안에 가장 큰 영향을 미치는 기후 요인은 ( ㉩ )와/과 ( ㉪ )대이다. 이는 대류권의 공기흐름에 대한 개념적 모형인 ( ㉫ ) 순환(세포)과 관련이 높다.","물질의 상이 변화할 때 필요한 열을 ( ㉬ )(이)라고 하며, 기화열, 융해열, ( ㉭ ) 등이 이에 해당한다."],"a":{"㉠":"60","㉡":"30","㉢":"대기의 창(atmospheric window)","㉣":"건조 공기(dry air)","㉤":"델린저(Dellinger)","㉥":"산란(scattering)","㉦":"경로 길이(path length) 또는 대기 통과 길이","㉧":"육도(陸島)","㉨":"양도(洋島)","㉩":"해류(ocean current) 또는 한류(cold current)","㉪":"고기압(high-pressure)","㉫":"워커(Walker)","㉬":"잠열(숨은열, latent heat)","㉭":"승화열(heat of sublimation)"},"e":"","ea":""},"16":{"q":["태풍은 북태평양 열대 해상의 서쪽에서 발생한다. 온대 저기압과는 달리 (                          ㉠   )을/를 동반하지 않으며, 일기도에서는 발달한 태풍의 등압선이 조밀한 동심원으로 표현된다.","나미브 사막은 (                ㉡   ) 한류에다, 표층수가 제거된 연안에 심층으로부터 냉수의 (          ㉢ )이/가 더해져 발달한다. 반면, 내륙에 위치한 칼라하리 사막은 아열대 고기압의 영향으로 발 달한다.","태양 복사에너지는 대기를 통과하는 과정에서 (                      ㉣   ), 반사, 산란 현상이 발생한다. 대 기권 상부에서는 짧은 파장의 전자기파가, 대기권 하층에서는 근적외선이 온실기체에 주로 ( ㉣       )된다. 반사는 입사에너지가 지표로부터 일정한 방향으로 튕겨나가는 현상으로 지표로 부터 반사되는 비율을 (                   ㉤   )(이)라고 한다.   한편 지구 복사에너지는 온실 효과에 의해 일부가 다시 지표면으로 되돌아오는데 이를 (                     ㉥    )(이)라고 한다.","(        ㉦     )은/는 수소나 헬륨 등의 가벼운 기체가 들어있는 풍선에 온도와 습도를 측정하는 장치를 매달아 풍선이 올라감에 따라 각 고도의 온도와 습도를 관측하는 장비이다.","지표면 마찰이 없는 1km 이상의 상층에서 기압경도력과 전향력이 완전히 평형을 이룰 때 등압선에 평행하게 부는 이상적인 바람을 (                      ㉧    )(이)라고 하며, 만약 등압선이 곡선이면 기압경도력과 전향력 이외에 원심력이 작용하여 곡선의 등압선을 따라 평행하게 부는 바람을 (       ㉨       )(이)라 한다.","1960년대까지 포디즘은 선진국 산업 조직에서 현재적 효율성의 상징이었다. 그러나 1970 년대에 이르러 선진국 경제는 불황과 물가상승이 동시에 나타나는 (                           ㉩   )(이)라는 위기를 겪게 되었다. 그 결과 효율적인 생산조직으로서의 포디즘을 재검토하게 되었다.","가사와 육아의 일차적인 책임을 떠안은 기혼여성들이 불리한 고용조건을 받아들인 결과 여 성 집중도가 매우 높아진 직업들을 통틀어 (                     ㉪   )(이)라고 한다.","(        ㉫     )은/는 정부가 시장이나 민간의 활동에 직접 개입하지 않고 일정한 거리를 두어 간접적으로 지원하는 원칙으로 국가의 역할을 축소하면서도 간접적 영향력을 유지하려는 신자 유주의적 통치 논리를 반영한다.","(        ㉬     )(이)란 상품 및 서비스 생산과 소비자에게 분배를 위해 필요한 일련의 복잡하고 상호 연계된 활동의 집합이다.","제니퍼 월치(Jennifer Wolch)는 비영리단체에 대한 정부의 기금 지원이, 비영리단체가 정 권의 눈치를 보거나 맹목적으로 정부의 정책을 따르는 (                         ㉭   )이/가 되는 효과를 가져올 수 있다고 하였다."],"a":{"㉠":"전선(front)","㉡":"벵겔라(Benguela)","㉢":"용승(upwelling)","㉣":"흡수(absorption)","㉤":"알베도(albedo)","㉥":"역복사(counter radiation)","㉦":"라디오존데(radiosonde)","㉧":"지균풍(geostrophic wind)","㉨":"경도풍(gradient wind)","㉩":"스태그플레이션(stagflation)","㉪":"핑크칼라게토(pink-collar ghetto)","㉫":"팔길이 원칙(Arm’s Length Principle)","㉬":"가치사슬(value chain)","㉭":"그림자 정부(shadow state)"},"e":"","ea":""},"17":{"q":["홍길동씨는 4월 7일 오후 10시에 A 공항(표준시 82.5°E)을 출발하여 B 공항에 현지 시각 4월 8일 오전 4시에 도착하였다. 그곳에서 약 1주일간 출장 업무를 마치고 4월 15일 오후 10 시에 B 공항을 출발하여 4월 17일 오전 7시에 A 공항에 도착하였다. 돌아오는 비행기는 제트 기류의 영향으로 갈 때보다 2시간이 더 걸렸다. B 공항은 (                  ㉠   )을/를 표준시의 기준으로 사용하는 곳에 위치한다. (단, B 공항은 3월~10월까지는 써머 타임 1시간을 적용한다. ㉠에 해당하는 경도 값을 쓰시오.)","해발고도 0m에서 24℃인 공기덩어리가 해발고도 4,000m인 산맥을 넘어내려와 30℃의 공 기덩어리가 되었다면, 바람받이 사면에서의 상승응결고도는 (                    ㉡   )m, 이슬점온도는 (   ㉢ )℃이다. (단, 건조단열감률은 -1℃/100m, 습윤단열감률은 -0.5℃/100m임)","(   ㉣   )은/는 전향력과 지형적 경계의 상호작용으로 발생하는 중력파의 일종으로 코리올 리 힘이 0인 적도에서는 서에서 동으로 이동하여 엘니뇨 현상의 핵심 매커니즘이 된다.","상대 습도가 가장 높은 지역은 (         ㉤       ), 가장 낮은 지역은 (    ㉥   )이다. ( ㉤, ㉥에는 적도, 아열대고압대, 북극, 남극 중에서 선택하세요)","북극진동(AO)의 양(+)의 단계에서는 극고기압 수치가 (                ㉦    )하고, 음(-)의 단계에서는 극고기압 수치가 (      ㉧   )한다. (㉦, ㉧에는 상승과 하강 중에서 선택하세요)","북태평양에서는 알류산 저기압이라는 반영구적 저기압과 그 인근의 해수면 냉각으로 인한 열적 고기압인 오호츠크해 고기압이 세트를 이룬다. 반면 북대서양에는 반영구적인 아이슬란 드 저기압과 빙하 위에서 공기가 냉각된 (               ㉨    )이/가 세트를 이루고 있다.","식물체 속의 물이 잎의 기공을 통해 수증기가 되어 밖으로 나오는데 이를 (                    ㉩   ) 작용 이라고 한다.","(   ㉪   )에서는 대기권에서 가장 낮은 온도가 나타난다.","열의 이동 방법은 매질을 통해 열이 흘러가는 (                  ㉫   ), 열과 매질이 함께 움직이는 ( ㉬      ), 매질 없이 에너지가 전달되는 (       ㉭       )(으)로 구분할 수 있다."],"a":{"㉠":"120°W","㉡":"2800","㉢":"-4","㉣":"켈빈파(Kelvin Wave)","㉤":"남극(Antarctic)","㉥":"아열대고압대(subtropical high pressure zone)","㉦":"하강","㉧":"상승","㉨":"그린란드 고기압(Greenland High)","㉩":"증산(蒸散)","㉪":"중간권계면(mesopause)","㉫":"전도(conduction)","㉬":"대류(convection)","㉭":"복사(radiation)"},"e":"","ea":""},"18":{"q":["풍상측 지표가 기온 22℃, 이슬점 14℃이다. 이 공기 덩어리가 2,000m 산맥을 넘어가면 상승응결고도인 ( ㉠ )m에서 포화공기가 되어 비를 내리게 된다. 이후 산정상에서 기온 ( ㉡ )℃, 이슬점 ( ㉢ )℃까지 낮아졌다가, 풍하측 지표에 도달하게 되면 기온 ( ㉣ )℃, 이슬점 ( ㉤ )℃의 매우 건조한 공기가 된다. (단, 건조단열감률은 -1℃/100m, 습윤단열감률은 -0.5℃ /100m, 이슬점감률은 0.2℃/100m임)","고도가 올라감에 따라 ( ㉥ )가 상승한다면 상층공기가 지표면의 공기보다 가볍다는 의미이 므로 안정 대기라고 할 수 있다. 반면 중립 대기, 즉 상승하고 하강하는 대기가 건조단열률로 변화하게 되면 ( ㉥ )은/는 보존된다.","밀란코비치(M.Milankovitch)의 빙기 유도 조건은 ( ㉦ )이/가 커지고, ( ㉧ )은/는 작아지고, 세차에 의해 ( ㉨ )이 근일점이 되는 경우이다.","60°N, 75°E 지점에서 60°N, 105°W 지점으로 이동할 때, 등각항로로 이동하는 거리는 ( ㉩ )km 이고, 대권항로로 이동하는 거리는 등각항로로 이동하는 거리의 ( ㉪ )이/가 된다.(단, 지 구는 완전한 구체이며, 적도에서 극까지의 거리는 10,000km로 한다.)","경도 1°의 길이는 적도에서 최대이며, 위도 ( ㉫ )°에서 적도에서의 길이의 절반이 된다. 반 면 위도 1°의 길이는 지구가 완전한 구체라면 모두 같게 되지만, 실제로는 타원체이므로 ( ㉬ )이/가 ( ㉭ )보다 더 길다. (㉬과 ㉭에는 ‘극 또는 적도’ 중에 선택하여 기입할 것 )"],"a":{"㉠":"1,000","㉡":"7","㉢":"7","㉣":"27","㉤":"11","㉥":"온위(Potential Temperature)","㉦":"이심률","㉧":"자전축 기울기","㉨":"북반구 겨울철","㉩":"10,000","㉪":"2/3","㉫":"60","㉬":"극","㉭":"적도"},"e":"","ea":""},"19":{"q":["스칸디나비아반도의 보트니아만(Gulf of Bothnia)은 후빙기의 해수면 상승 속도보다 지형의 융기 속도가 빠르다. 해수면은 80m 상승하고 150m 보상 융기가 발생하였다면 빙기의 보트니 아만의 해수면 고도는 (          ㉠   )m 였을 것이다. 그리고 현재 해발고도가 100m 인 지역의 빙기때 해발고도는 (       ㉡     )m 였을 것이다.","도시 내부의 특정 지점에서 기온이 더 낮게 나타나는 현상이 관측되기도 하는데 이를 ( ㉢      )(이)라고 부르며 대기에 노출된 지표로 인해 복사 냉각이 더 활발한 경우에 발생할 수 있다.","바람에 의해 형성되는 해류를 (           ㉣    ) 해류라고 하며, 이에 따른 순환을 (          ㉣    ) 순환 이라고 한다. 대기 대순환과 (          ㉣       ) 순환은 대체로 남반구와 북반구가 서로 대칭을 이루 며, 북반구에서는 (       ㉤    ) 방향으로 순환하고, 남반구에서는 (         ㉥   ) 방향으로 순환한다.","(   ㉦   )은/는 적도와 아열대 사이의 열적 순환 시스템으로 각 반구마다 하나씩 2개의 대 류 세포로 구성되며, 무역풍을 설명하기 위해 제안되었다.","폐색 전선은 전선면 전후의 공기 온도에 따라 (               ㉧   )와/과 (   ㉨       )(으)로 구분된다. 온난 전선 전면의 공기가 한랭 전선 후면의 공기보다 덜 한랭하다면 (                       ㉧    ) 폐색 전선이 형성되고, 온난 전선 전면의 공기가 한랭 전선 후면의 공기보다 더 한랭하다면 (                         ㉨    ) 폐 색 전선이 형성된다.","북극진동(AO)지수가 양(+)의 단계일 때, 극기방의 기압은 평년보다 (                  ㉩     ), 중위도대에 서는 평년보다 (     ㉪       ), 제트류는 평년보다 (    ㉫   )진다. (단, ㉩과 ㉪에는 ‘높고 또는 낮 고’ 중에서 선택하여 기입하고, ㉫에는 ‘강해 또는 약해’ 중에서 선택하여 기입하세요^^)","지중해 연안 지역의 여름철은 해양성 열대 기단인 (                 ㉬   ) 고기압의 영향으로 건조하고 더운 날씨가 나타난다. 또한 사하라 사막에서 불어오는 건조열풍인 (                    ㉭       )와/과 같은 남풍 형식의 지방풍이 발생하기도 한다."],"a":{"㉠":"-80","㉡":"30","㉢":"도시 냉섬(urban cool island)","㉣":"표층(surface layer)","㉤":"시계","㉥":"반시계","㉦":"해들리 순환(Hadley circulation)","㉧":"한랭형(cold-type)","㉨":"온난형(warm-type)","㉩":"낮고","㉪":"높고","㉫":"강해","㉬":"아조레스(Azores)","㉭":"시로코(Sirocco)"},"e":"","ea":""},"20":{"q":["(   ㉠   )이/가 흐르는 해안에서는 등온선이 적도쪽으로 만곡하고, (                    ㉡   )이/가 흐르는 해안에서는 등온선이 극쪽으로 만곡한다.","유럽의 (    ㉢   )철 등온선은 비교적 위도와 평행하지만, (              ㉣       )철 등온선은 경선 방향 과 평행하기도 한다.","점토(粘土)는 공극률이 (         ㉤    ), 투수성이 (   ㉥    ), 통기성이 매우 불량하다. (㉤, ㉥에 는 ‘높고’, ‘낮고’ 중에서 선택 기입할 것)","해수면이 하강할 경우 돌출부는 (             ㉦   )작용이, 만입부는 (        ㉧     )작용이 우세하지만, 해수면이 상승할 경우 만입부는 (               ㉨    )작용이, 돌출부는 (        ㉩    )작용이 우세해진다. (㉦~㉩에는 ‘침식’ 또는 ‘퇴적’ 중에서 선택하여 기입할 것)","엔티졸(Entisol)은 충적토나 암설토로 모재가 최근에 형성되어 풍화 기간이 매우 짧은 미성 숙토에 해당한다. 반면, (       ㉪        )은/는 미약하게나마 집적층이 발달한 토양으로 우리나라에 서 가장 흔하게 볼 수 있다.","최종 빙기 이후 해수면 상승보다 융기량이 많은 해안에서, 최후 간빙기에 형성된 해안단구 면은 현재 해수면이나 파식대보다 (              ㉫    ) 고도에, 최종 빙기에 형성된 해안단구면은 현재 해수면이나 파식대보다 (         ㉬       ) 고도에 위치한다. (단, ㉫과 ㉬은 ‘높은’ 또는 ‘낮은’ 중에서 선택할 것)","칼도어(N.Kaldor)는 (   ㉭       ) 모델을 제시하였는데, (     ㉭   )(이)란 해당지역의 생산성지 수에 대한 화폐임금지수를 말한다. 그는 이것을 통해 성장지역이 낙후지역에 비해 계속적으로 비교우위를 누리게 되는 누적인과의 원리를 설명하였다."],"a":{"㉠":"한류(cold current)","㉡":"난류(warm current)","㉢":"여름(summer)","㉣":"겨울(winter)","㉤":"높고","㉥":"낮고","㉦":"퇴적","㉧":"퇴적","㉨":"침식","㉩":"침식","㉪":"인셉티졸(Inceptisol)","㉫":"높은","㉬":"높은","㉭":"효율임금(efficiency wage)"},"e":"","ea":""},"21":{"q":["하도의 상대적 안정성은 ( ㉠ ) 하도가 ( ㉡ ) 하도 보다 높다. (㉠과 ㉡은 망류, 곡류 중에 서 선택할 것)","유수가 발산하는 하도의 양안에서는 ( ㉢ ) 작용이 주로 발생하고, 하도의 중앙에서는 대체 로 ( ㉣ ) 작용이 우세하다.","망류 하도(braided channel)는 대체로 ( ㉤ )이/가 낮고, ( ㉥ )이/가 크고, ( ㉦ )에 비해 ( ㉧ )의 수치가 낮게 나타난다. (㉤~㉧에는 경사, 수심, 곡률도, 하폭 중에서 선택할 것)","하천의 상류보다 하류의 유속이 큰 것은 ( ㉨ )에 비해 하도 단면적의 증가하여 마찰력이 감소하기 때문이다.","토양 침식 중에서 지표류에 의해 토양 입자가 제거되는 현상을 ( ㉩ )(이)라고 하는데, ( ㉩ )은/는 다시 ( ㉪ ), 포상 침식, 우적 침식으로 구분할 수 있다.","고도가 높아짐에 따라 연직 기온하강 대신에 기온이 상승하는 경우를 기온역전이라 하며, 기온역전이 나타나는 층을 역전층이라고 부른다. 기온역전 중에서 지면과의 접촉으로 형성된 기온역전은 ( ㉫ )(이)라 한다.","하상의 조도는 상류에서 하류로 가면서 감소하고, 홍수시에는 ( ㉬ )한다. 하도 경사는 상류 에서 하류로 가면서 감소하고, 홍수시에는 ( ㉭ )한다. (㉬과 ㉭에는 ‘증가’ 또는 ‘감소’ 중에서 선택할 것)"],"a":{"㉠":"곡류(meandering)","㉡":"망류(braided)","㉢":"침식(erosion)","㉣":"퇴적(sedimentation)","㉤":"곡률도(sinuosity)","㉥":"경사(slope)","㉦":"하폭(width)","㉧":"수심(depth","㉨":"접수길이(distance along wetted perimeter)","㉩":"우세(Rain Wash)","㉪":"릴 침식(세류 침식, rill erosion)","㉫":"접지역전(surface inversion)","㉬":"감소","㉭":"증가"},"e":"","ea":""},"22":{"q":["현재 하천 하류부에 나타나는 해면변동 단구는 (              ㉠       )에 하안단구로 변화하였고, 하천 중상류에서 장기적인 기후 변동에 의해 형성된 기후 단구는 (                      ㉡   )에 하안단구로 변화하 였다. (㉠과 ㉡에는 ‘빙기’ 또는 ‘간빙기’중에서 선택 기입할 것)","(    ㉢   )은/는 급류성의 소하천이 조립의 물질을 운반하여 만든 경사가 급한 작은 선상지 이다.","범람원의 구성 물질이 등질적인 경우, 물굽이 모양이 일정한 곡류하도인 (                      ㉣   )가 나타 난다. 하지만 구성 물질이 등질적인 경우는 거의 없으므로 대부분의 곡류하도는 (                         ㉤   )이 다.","자유곡류를 계승한 감입곡류하천은 지반 융기, 침식 기준면 하강 등에도 불구하고 원래의 유로를 그대로 유지하면서 흐르는 하천이므로 (            ㉥     )에 해당한다.","저수위에도 하상에 가라앉을 수 없는 미립물질을 (             ㉦       )(이)라고 하는데, 용해하중과 마 찬가지로 지형적인 영향 없이 유속과 같은 속도로 하류로 운반된다.","하상의 기반암을 하각하고 퇴적물을 운반하기 위한 하천의 능력을 (                      ㉧   )(이)라고 하는 데, 이는 단위 하도 길이당 위치에너지의 손실 비율을 의미하므로 물의 고도하강속도로 구한 다. 따라서 (        ㉧   )은/는 물의 밀도, 중력가속도, (       ㉨       ), 하도경사의 곱이다. 반면, ( ㉩      )은/는 (   ㉧   )을/를 하폭으로 나눈 값으로, 이는 (         ㉪     )와/과 유속의 곱에 해당한 다. 그러므로 유속과 (        ㉪    )이/가 커질수록 하상을 구성하는 물질의 침식 가능성은 높아진 다고 할 수 있다.","릴(rill)과 우곡(gully)보다 규모가 큰 것은 보통 (      ㉫       )(이)라고 하는데, 건조 지역에서 나타나는 일시적인 하도이다. 그러나 본질적으로는 우곡과 다르지 않고, 지역에 따라서 와디, 드라이 워시 등으로 불리기도 한다.","퇴적물의 발원지인 (        ㉬   )은/는 유수에 의해 운반되지 못한 물질이 곡저에 퇴적되어 하 곡을 매적한다. 반면, (        ㉭   )은/는 하도들이 자체 하중을 운반하고 분급할 수 있지만 기반 암을 하각하기는 어렵다."],"a":{"㉠":"빙기(glacial period)","㉡":"간빙기(interglacial period)","㉢":"충적추(alluvial cone)","㉣":"정규 미앤더(normal meander)","㉤":"변형 미앤더(deformed meander)","㉥":"선행하천(antecedent stream)","㉦":"씻김하중(washload)","㉧":"하천력(stream power)","㉨":"유량(discharge)","㉩":"단위하천력(unit stream power)","㉪":"전단력(shear stress)","㉫":"아로요(arroyo)","㉬":"붕적곡(colluvial valley)","㉭":"충적곡(alluvial valley)"},"e":"","ea":""},"23":{"q":["방위도법 중 극투영을 했을 때, 위선이 등간격이 되는 도법은 ( ㉠ )도법이다.","범람한 유수의 침식 작용에 의해 자연제방 내에 갈라진 틈이 발생하면, 범람수가 자연제방 을 통과하여 배후습지 방향으로 쌓은 부채꼴 모양의 퇴적물을 ( ㉡ )(이)라고 한다.","구정선 고도는 해안단구의 융기량을 결정하는데 있어 중요하며, 단구면과 배후의 단구가 만나는 지점을 연결한 선으로 표현된다. 어떤 지역 해안단구의 구정선 고도를 조사하였더니 해발 20m에 위치하였고, 이 단구면의 형성시기는 지금으로부터 4만년 전이라면, 이 단구면이 형성될 시기의 해수면 추정고도는 ( ㉢ )m이다.(단, 지각의 융기속도는 1m/천년이며, 그 속도 는 일정하다)","( ㉣ )(이)란 본류로 유입하는 지류하천이 본류의 높은 자연제방을 우회하여 그 배후의 낮 은 저지대를 따라 본류와 평행하게 일정거리를 흐르다가 지면 고도가 낮아진 곳에서 합류하는 유형을 말한다.","( ㉤ )이/가 생기는 것은 접근 방향이 다른 두 개의 파랑이 서로 마주치면서 해안으로 접근 하기 때문이다. 이러한 파랑이 생기는 지형조건은 해안 가까이 작은 섬이나 암초가 있어서 외 해로부터 해안을 향해 접근하는 파랑을 막아주는 동시에 파랑을 굴절시키기 때문이다.","( ㉥ )은/는 하천 하상에 유수의 차별침식으로 발달한 깊은 물웅덩이다. 유속이 전체적으로 빠른 하천 상류 구간에서 주로 형성되며 국지적으로 유속이 빨라지는 공격사면이나, 폭포 혹 은 급류구간 아래의 하상에서 잘 발달한다. 반면 ( ㉦ )은/는 유속이 느려지는 하천의 곡류구 간에 모래나 자갈이 퇴적된 완만한 경사의 지형으로 보호사면 혹은 활주사면 등으로 불린다.","빙하의 형성에는 얼음이 필요한데, 얼음은 주로 바닷물의 증발에서 유래하는 눈의 형태로 빙하시스템에 유입된다. 그러므로 제4기 빙하기 동안 물은 바다에서 추출되어 빙상으로 운반 되고 빙기 동안 그곳에 갇히게 된다. 이러한 방식으로 해면변동을 초래하는 것을 ( ㉧ ) 유스 터시(eustasy)라고 부른다. 한편 육지에서 성장하는 대륙빙상은 과도한 하중 압력을 가하여 육 지를 침강하게 하는데, 이러한 작용을 ( ㉨ ) 아이소스터시(isostasy)라고 부른다.","충적 하도는 평형 단계에서 나타나는 기본적인 네 가지 형태인 직류, 곡류, 망류, 분합류로 나타난다. 한편, ( ㉩ ) 하도는 곡류와 망류 하도사이의 중간 단계로 종종 인식된다.","( ㉪ )은/는 해식애 기저부가 파랑의 작용으로 움푹 들어간 곳으로 해안 절벽의 굴식이나 붕괴로 이어진다.","( ㉫ )은/는 파고는 낮으나 파장과 주기가 매우 큰 파랑이다. 파고는 불과 1m 이내라 하 더라도 파장은 200~300km, 주기는 10~15분에 달하기 때문에 파속은 매우 빠르다.","( ㉬ )은/는 하천에 영향을 미치는 요인과 ( ㉭ )이/가 변하지 않는 상태의 하천으로서, 유 속, 유량, 경사, 퇴적물 사이에 균형을 이루어, 하도의 모든 구간 하상이 ( ㉭ )에 도달된 이상 적인 하천이다."],"a":{"㉠":"정거방위(azimuthal equidistant)","㉡":"크레바스 스플레이(crevasse splay)","㉢":"-20","㉣":"야주하천(yazoo stream)","㉤":"첨상사취(cuspate spits)","㉥":"소( pool )","㉦":"포인트바(point bar)","㉧":"빙하성(glacial)","㉨":"빙하성(glacial)","㉩":"방랑류(wandering)","㉪":"해식 노치(wave-cut notch)","㉫":"쓰나미(津波, tsunami)","㉬":"평형하천(graded river)","㉭":"침식기준면(base-level)"},"e":"","ea":""},"24":{"q":["1/50,000 수치지도 37616 도엽의 바로 동쪽에 인접한 도엽의 번호는 (                     ㉠   )이고, 37616 도엽의 남쪽에 인접한 도엽의 번호는 (         ㉡       )이다.","비치페이스의 경사는 구성 물질의 (      ㉢       )에 영향을 받는다. 물질 입자가 클수록 (                ㉢ )이/가 크므로 당연히 사빈보다 역빈의 비치페이스 경사가 더 크다.","저조와 고조의 수직적인 고도 차이를 조차라고 하고, 조차가 나타나는 수평적인 범위, 즉, 고조때 물에 잠기지만 저조때는 드러나는 땅을 (              ㉣    )(이)라 부른다.","직류하도는 자연상태에서는 드물다. 하지만 곡률도 1.3~1.5의 (                    ㉤   )은/는 하도의 한편 에 작은 바(bar)라도 형성되면 맞은편 하안을 침식하고 소를 형성시키기 때문에 매우 흔하게 나타난다.","댐건설 이후, 댐의 하류부에서는 댐건설 이전보다 퇴적보다 하천 침식이 더 우세하게 되는 데, 일반적으로 하천 수로의 경사가 (      ㉥    )하고, 유속이 (             ㉦    )한다. (㉥과 ㉦에는 ‘증 가’또는 ‘감소’를 쓰시오.)","곡류하도가 성장하는 과정에서 하도 주변에는 다양한 지형이 발달하게 된다. 곡류부의 침 식 하안 부근에는 소(담)가, 곡류부의 퇴적 하안에는 포인트바가, 곡류부와 곡류부 사이에는 ( ㉧     )이/가 발달한다. 그런가 하면 포인트바가 위치한 활주사면(사행돌출부)에는 (                      ㉨   ) 이/가 생겨나 사행이 공격사면 방향으로 이동되었음을 알려주기도 한다.","(   ㉩    )은/는 특정 차수 하천의 수와 그보다 한 계층 높은 차수 하천수의 비율로 표현한 다.","황해안은 조차가 매우 크기 때문에 사빈으로부터 분리된 모래가 조간대에 쌓여 형성된 ( ㉪      )이/가 발달한다.","(    ㉫   )와/과 충적선상지는 형태도 크게 다르지 않고 산록완사면이라는 공통된 특징이 있지만, 충적선상지는 퇴적 지형인 반면, (        ㉫    )은/는 침식 지형이다.","강우 강도가 토양 침투율을 초과할 때, 물은 지표면 위를 흐른다. 이러한 방식으로 생성된 유출은 이 과정을 처음 연구한 수문학자의 이름을 따서 (                    ㉬       )(으)로 불린다. 반면, 토양 내에 침투한 물이 토양층의 내부를 따라 흐르는 것을 (                ㉭    )(이)라고 한다."],"a":{"㉠":"37713","㉡":"36604","㉢":"안식각(angle of repose)","㉣":"조간대(intertidal zone)","㉤":"만곡하도(sinuous channel)","㉥":"감소","㉦":"감소","㉧":"여울(riffle)","㉨":"미앤더 스크롤(meander scroll) 또는 곡류흔","㉩":"분기율(bifurcation ratio)","㉪":"사주능(ridge)","㉫":"페디먼트(pediment)","㉬":"호튼지표류(Horton overland flow)","㉭":"지중류(subsurface flow) 또는 중간류(interflow)"},"e":"","ea":""},"25":{"q":["동해안에 비해 황해안은 조차가 크기 때문에 (            ㉠       )이/가 발달하기 어렵다. 조차가 크 면 정선(shoreline)이 안정적이지 못하기 때문이다. (          ㉠    )은/는 정선의 물리적 한계점이기 도 하고 동시에 구정선(ancient shoreline)이기도 하다.","사취(spit)의 선단부는 파랑의 굴절현상과 관련하여 육지쪽으로 구부러지는데, 이러한 사취 를 (   ㉡   )(이)라고 하며, 사취가 성장하여 만을 가로막으면 (                ㉢       )(이)라고 한다.","스코트와 피셔(Scott & Fisher)는 삼각주를 형태적인 특징이 아니라 형성 원인에 토대를 두어 하천이 우세하게 작용한 (          ㉣   ) 삼각주와 파랑과 조류에 의한 (                 ㉤   ) 삼각주로 구분하였다.","가상원통 도법인 몰바이데(Mollweide) 도법에서 고위도 지역에 원형으로 나타낸 부분은 실 제 지구 표면에서는 (       ㉥   ) 방향으로 긴 타원이 된다. (㉥에는 ‘동서’ 또는 ‘남북’중에서 선 택 기입할 것)","투영면과 지구와의 접점의 대척점에 시점을 두고 지도를 그리는 것을 (                          ㉦   )투영이라고 한다.","㉧과 ㉨에는 해당 진술이 맞으면 O, 틀리면 X를 쓰시오. • 염기성 화성암은 철(Fe)과 마그네슘(Mg)의 함량이 많다...(              ㉧       ) • 산성 화성암은 무겁고 암석의 색이 어두운 편이다....(               ㉨   )","하곡에서 발생한 지형 변화로 유수가 분수계를 넘는 현상을 (                     ㉩       )(이)라고 하는데, 하 천의 하류 쪽에서 발생한 지형적 사건으로 하곡이 막혀 (                 ㉪       )이/가 형성된 후, 증가한 유 량으로 인해 수위가 상승하여 호수의 물이 주변의 낮은 분수계를 넘어 다른 방향으로 흘러가 는 것을 말한다.","온실기체에 의한 지구 온난화처럼 특정 물질이나 현상이 기온을 상승시키거나 하강시켜 기 후를 변화시키는 능력을 (         ㉫   )(이)라고 한다.","심층 풍화층이 침식에 의해 제거되어, 토르와 도상구릉 등의 기반암 표면이 지표에 드러난 지형을 (     ㉬   )(이)라고 한다.","열대 및 아열대 환경에서는 화학적 풍화로 인해 두꺼운 레골리스가 생성되고 이후 침식으 로 제거되는데, 이러한 작용을 (         ㉭   )(이)라고 부른다."],"a":{"㉠":"범(berm)","㉡":"분기사취(recurved spit)","㉢":"만구사주(bay mouth bar)","㉣":"건설","㉤":"파괴","㉥":"남북","㉦":"평사(stereographic)","㉧":"O","㉨":"X","㉩":"유역전환(Drainage Diversion)","㉪":"폐색호(dammed lake, 언색호)","㉫":"복사강제력(radiative forcing)","㉬":"동체평원(etchplain)","㉭":"에치플레네이션(Etchplaination)"},"e":"","ea":""},"26":{"q":["전단 강도는 사면을 이루는 물질의 내부 저항력으로 ( ㉠ )와/과 유효 수직응력과 내부마찰 각 함수의 합으로 표현된다.","토양 포행에 의해 만들어지는 ( ㉡ )은/는 급경사의 초지 사면에서 나타나는 작은 계단 모 양의 지형이다.","동해안은 0m 등고선이 해안선이 되는 경우가 많지만, 황해안은 해안 거주지의 안전과 항 해의 편의성을 우선시하여 ( ㉢ )을/를 해안선으로 정의한다.","유석(flowstone) 중에서 동굴 바닥이 아닌, 동굴 벽면이나 천장에 매달려 있는 것을 ( ㉣ ) (이)라 한다.","바람의 풍마식 작용을 받은 암석을 ( ㉤ )(이)라고 하는데, 보통 3개의 모서리를 가지고 있 다고 하여 삼릉석이라고 부르는 경우가 더 많다.","( ㉥ )은/는 유역의 분수계에서 계곡의 말단까지 각각의 사면 단위들이 연결되어 만들어진 사면연속체이다.","굴식 작용 중에서 유수의 물살에 의해 하도 내의 느슨한 퇴적물이 제거되는 침식 작용을 ( ㉦ )(이)라고 한다. 반면 마식 작용 중에서 입자의 도움 없이 물의 전단력이 기반암에 가해져 마식이 발생하는 것은 ( ㉧ )(이)라고 한다.","( ㉨ )은/는 차별풍화로 형성된 거대한 단일 암괴지형이다. 풍화지형에서 ( ㉨ )와/과 토르 는 형성 메커니즘이나 형태적 측면에서 하나의 카테고리로 묶을 수 있다.","( ㉩ )은/는 완사면이 사면 상부로 확대되면서 최상부의 단애가 점차 후퇴하며 축소되는 사 면 단면의 변화 방식이다. 단애로 이루어진 사면은 이 과정을 통해 암설 사면으로 변화할 수 있다.","( ㉪ )은/는 라틴어의 잎을 의미하는 단어에서 유래하였는데, 변성암에서 반복되는 면구조 를 이르는 용어이다.","규산염 광물 중 지표 환경과 가까운 조건, 즉 저온 저압하에서 생겨난 밝은색 광물은 안 정적이지만, 고온 고압하에서 생성된 어두운 색 광물은 풍화에 매우 약하다. 가장 밝은색인 석 영 입자는 많지만, 가장 어두운 ( ㉫ ) 입자는 찾아보기 어려운 것이 바로 그런 이유이다.","뷔델의 ( ㉬ ) 이론은 지표침식으로 지표가 낮아지는 비율과 화학적 풍화로 풍화전선이 낮 아지는 비율이 동일하다는 이론이다.","우리나라에는 고생대 중기에 해당하는 실루리아기와 데본기 지층이 존재하지 않는다. 그 래서 이 시기를 ( ㉭ )(이)라 부르며, 오르도비스기의 석회암과 석탄기의 석탄은 부정합으로 붙 어서 존재한다."],"a":{"㉠":"응집력(cohesion, 점성)","㉡":"테라셋(terracette)","㉢":"만조선(approximate highest high water, 약최고고조면)","㉣":"동굴 커튼(cave curtain) 또는 동굴 베이컨(cave bacon)","㉤":"풍식력(ventifact)","㉥":"카테나(catena)","㉦":"수압식(hydraulicking)","㉧":"수마식(evorsion)","㉨":"보른하르트(bornhardt) 또는 도상구릉(inselberg)","㉩":"사면 대체(slope replacement)","㉪":"엽리(foliation)","㉫":"감람석(olivine)","㉬":"이중평탄화(double planation)","㉭":"대결층(大缺層)"},"e":"","ea":""},"27":{"q":["바람에 의한 지표 물질의 운반 작용은 부유, 도약, 포행으로 나타나는데, 이중에서 도약은 지표의 입자들이 뛰어 올랐다가 떨어지는 현상으로 주로 모래 입자의 이동 양식에 해당한다. 특히 도약 후에 떨어진 큰 입자가 지표의 작은 입자와 부딪혀 작은 입자가 튕겨 이동하는 경 우를 (       ㉠    )(이)라고 한다. 떨어진 큰 입자는 충돌된 지점에 퇴적되는데, 이는 (            ㉡   ) (이)라 한다.","사막포도(desert pavement)의 형성 과정에 대한 가설은 2가지가 있는데, 첫째 바람이 세 립물질을 취식으로 제거하여 조립 자갈이 지표면에 남겨져 형성되었다는 주장과, 둘째 (                         ㉢ )의 하향 이동으로 자갈이 표면에 집적되었다는 주장이 있다.","플라야(playa)의 표면은 대체로 점토반이 나타나는데, 수분 증발로 수축되면 다각형으로 갈 라져 (       ㉣    )이/가 형성되기도 한다. 플라야의 표면이 점토가 아닌 경우 (            ㉤    )(으)로 덮여 있는 곳이 많은데, (         ㉤   )은/는 지표의 갈라진 틈을 따라 상승한 모세관수가 증발하 고 침전된 염분과 광물이 주성분이다.","퇴적암에는 퇴적 당시의 환경에 따라 다양한 퇴적 구조가 나타나는데, (                 ㉥       )은/는 퇴 적암의 한 지층 내에서 아래에서 위로 갈수록 입자의 크기가 점점 작아지는 퇴적 구조이고, ( ㉦     )은/는 퇴적물의 표면에 물결 자국이 남아 있는 퇴적 구조이다.","데이비스(W.M.Davis)의 사면감쇠설은 경사가 급한 상부 사면이 완만한 하부 사면보다 빠르 게 침식받으며, 상부 사면은 철(볼록)형, 하부 사면은 요(오목)형을 유지하면서 고도가 낮아진 다는 이론이다. 이와는 달리 펭크(W.Penck)는 (      ㉧    ) 사면이 (   ㉨   ) 사면으로 대체되 는 방향으로 사면 변화가 일어난다고 주장하였다.","주빙하 사면 중 암설로 덮인 직선 사면은 (        ㉩    )(이)라고 불리는데, 암설의 공급량과 제 거량이 균형을 이루고 있는 경우이다.","(   ㉪       )은/는 용해 공극과 용해 선반으로 이루어진 평탄한 나출 카르스트를 의미한다.","석회암 고립 구릉들 내부에 발달된 별 모양 또는 원형의 분지를 (            ㉫   )(이)라고 한다.","횡사구(transverse dune)과는 탁월풍의 풍향과 직각을 이루면서 발달한다. 이와 달리 ( ㉬      )은/는 탁월풍과 동일한 방향으로 모래 구릉이 뻗어 있다. 또한 탁월풍이 계절에 따라 정 반대로 부는 경우 사구 정상부의 위치가 계절에 따라 변화하는 사구를 (                ㉭       )(이)라 하는 데, 우리나라 우이도 해안사구도 이에 해당한다."],"a":{"㉠":"렙테이션(reptation)","㉡":"부착(accretion)","㉢":"점토(clay)","㉣":"건열(mud crack)","㉤":"염류각(salt crust)","㉥":"점이층리(graded bedding)","㉦":"연흔(ripple mark)","㉧":"급경사(단애)","㉨":"완경사(암설)","㉩":"리히터 사면(Richter slope)","㉪":"석회암 포도(limestone pavement)","㉫":"코크핏(cockpits)","㉬":"종사구(linear, seif dune)","㉭":"역사구(reversing dune)"},"e":"","ea":""},"28":{"q":["영구동토층에서 여름에는 얼음의 융해가 발생하고 겨울에는 물의 동결이 발생하는 상부층 을 (    ㉠   )(이)라고 한다.","인볼루션의 (       ㉡   ) 구조는 포압(frost pressure)의 불균형으로 생기는 것으로, 과거에 이곳이 영구동토가 존재했던 주빙하 기후였다는 것을 증명하는 화석 지형이다.","(   ㉢   )은/는 화학 결합이 느슨하여 광물이 외부에서 충격을 받았을 때, 특정 방향을 따 라 쪼개지는 현상으로, 뢰스(loess)는 층리가 없는 대신, (        ㉢   )이/가 수직적으로 발달하기 때문에 급사면을 잘 형성한다.","(   ㉣   )와/과 얼음쐐기는 토양내에 수직의 얼음으로 채워진 공극 균열의 성장으로 만들 어진다.","(   ㉤   )은/는 틈새에 얼음과 얼음렌즈가 섞여있는 동결된 각력과 세립질 암설로 이루어 진 로브 또는 혀 모양의 지형으로 고산 환경에서 가장 보편적으로 나타나는 영구동토 지형이 다.","곡빙하의 중앙부, 기저부, 측면 중에서 활동성 운동이 있는 경우 속도의 증가는 (              ㉥     ) 이/가 가장 크고, (     ㉦    )이/가 두 번째로 크다.","(   ㉧   )에서는 빙하가 기저부의 기반암에 의한 지표 기복을 따라 흐르지만, (         ㉨      )에 서는 빙하 표면의 경사를 따라 흘러 내린다.","빙하 하부에서 발생한 화산 활동에 의해 빙하가 녹으면서 생성된 상당한 양의 물이 빙하 무게로 인해 제자리에 있다가 빙하가 최종적으로 이동하면서 일시에 방출되어 발생하는 빙하 성 홍수를 (      ㉩   )(이)라고 한다.","영구동토층 내에서 호소나 하천 밑에서는 냉각이 효과적으로 이루어지지 않아 비동토층에 발달할 수 있는데, 이러한 비동토층을 (         ㉪   )(이)라고 한다.","가장 일반적인 열카르스트 지형은 융해호소(thaw lake)와 (        ㉫   )이다. 융해호소는 얕 은 와지로 지중빙이 평균보다 더 집중적으로 존재했던 곳이다. 반면, (             ㉫   )은/는 지중빙 이 녹으면서 발생하는 매스무브먼트로 종종 하천에 의해 둑이 무너지면서 발생한다. 이로 인 해 형성된 절벽은 빠르게 후퇴하여 하천에 많은 양의 퇴적물을 공급한다.","퇴적암 고원은 보통 모암(帽岩) 또는 덮개암이라고 불리는 경암층으로 덮여있다. 그렇기 때문에 퇴적암 고원 표면의 침식보다는 고원 경계부로부터 내부를 향해 사면의 (               ㉬       ) 방 식으로 원 지형면의 개석이 발생한다. 이 과정에서 고원으로부터 분리된 탁자 모양의 지형인 (   ㉭   )이/가 형성된다."],"a":{"㉠":"활동층(active layer)","㉡":"포켓(pocket) 또는 플러그(plug)","㉢":"벽개(cleavage)","㉣":"맥빙(ice vein)","㉤":"암석빙하(rock glacier)","㉥":"기저부","㉦":"측면","㉧":"빙원(ice field)","㉨":"빙모(ice cap)","㉩":"요클훌라우프(jökulhlaup)","㉪":"탈리크(talik)","㉫":"융해슬럼프(thaw slump)","㉬":"평행후퇴(parallel retreat)","㉭":"메사(mesa)"},"e":"","ea":""},"29":{"q":["대륙판과 대륙판이 충돌하는 곳에서는 (           ㉠    )이/가 일어나지 않기 때문에 화산 활동은 거의 발생하지 않는다.","지판의 내부에서 현무암질 용암이 솟아오르는 곳을 (               ㉡       )(이)라고 하며, (       ㉡     )에 서 이동된 화산섬은 시간이 경과함에 따라 밀도가 높아져 수면 아래로 가라앉아 해산을 형성 한다.","일출식 분화는 주로 점성이 낮은 현무암질 용암이 분출하여 순상화산이나 (                          ㉢       )을/를 형성한다. 반면, 폭발식 분화는 주로 (         ㉣       )을/를 격렬하게 분출하여 급경사의 화산체를 형성한다.","스트롬볼리식 분화는 두 해양판의 수렴 경계인 (             ㉤   )에서 잘 나타난다.","(    ㉥   )은/는 폭발식 분화에 의한 원추형 소형 화산체로 분석구, 응회구, 응회환, 마르 등이 있다.","빙하의 내적 불안정에 기인해 단기간 동안 평상시 이동 속도의 100배 이상으로 빙하가 빠 르게 이동하는 현상을 (      ㉦   )(이)라고 한다.","입상붕괴 형태로 분리된 풍화산물을 (        ㉧       )(이)라고 하는데, 느슨하고 층을 이루지 않는 개별적 광물 알갱이로 되어 있다. (       ㉧       )은/는 조립질 관입화성암인 화강암이 붕괴하면서 흔히 나타난다.","(    ㉨   )은/는 지표면을 따라 용암이 흐르면서 형성된 용암튜브의 껍질 부분이 내부 액체 상태의 용암 압력에 의해 거북등처럼 부풀어 오른 지형이다.","화산재가 쌓이면서 응회암이 만들어질 때, 무거운 암괴나 화산탄 등이 덜 굳은 응회암 층 리 위로 떨어져 그 무게로 인해 오목하게 휘어진 퇴적 구조를 (                   ㉩   ) 구조라고 한다.","극투영 방위도법에서 위선은 원의 형태로 표현된다. (                 ㉪    ) 도법이 저위도로 갈수록 위선 간격이 가장 많이 증가하고, (       ㉫   ) 도법이 저위도로 갈수록 위선 간격이 가장 많이 감소한다.","(   ㉬   )은/는 소축척 지도에서는 신빙성이 매우 작기 때문에 대축척 지도에서만 사용한 다. 우리나라의 1/50,000 지형도에서는 (     ㉭       )cm 마다 내도곽선에 짧은 선을 그어 (                 ㉬ )을/를 나타내고 있다."],"a":{"㉠":"섭입(subduction)","㉡":"열점(hot spot)","㉢":"용암대지(lava plateau)","㉣":"화산쇄설물(pyroclastics)","㉤":"호상열도(island arc, 도호)","㉥":"화산쇄설구(pyroclastic cone)","㉦":"빙하 급동(glacier surge)","㉧":"그루스(Grus)","㉨":"투물러스(tumulus)","㉩":"탄낭(bomb sack)","㉪":"심사(gnomonic)","㉫":"정사(orthographic)","㉬":"평면(직각)좌표(grid coordinate system)","㉭":"2"},"e":"","ea":""},"30":{"q":["( ㉠ ) 연대 측정법은 퇴적물이나 토기가 과거에 마지막으로 빛이나 열에 노출된 시점이 지 금으로부터 얼마 전인지를 밝혀내는 절대연대 측정 기술로 방사성 탄소 연대 측정법으로 측정 하기 어려운 수만 년 ~ 수십만 년 전의 연대를 측정하는 데 활용된다.","유동학적 측면에서 지각과 맨틀은 암석권, ( ㉡ ), 중간권으로 구분하는데, ( ㉡ )은/는 유체 의 형태로 응력에 반응하는 부드럽고 약한 층으로 상부 맨틀의 하부층에 해당한다.","( ㉢ )은/는 대규모 침강과 퇴적으로 형성된 퇴적분지인 동시에 ( ㉣ )이/가 정립되기 이전 에 거대한 습곡산맥이 어떻게 형성되었는가를 설명하는 핵심 패러다임이다. ( ㉣ )은/는 지구 표면을 이루는 여러 개의 판들의 상대적인 움직임으로 인해 암석권이 형성되거나 파괴되고, 화산, 지진 등의 지구조적 활동이 발생한다는 이론이다. 반면 ( ㉤ ) 구조론은 맨틀에서 상승 하거나 하강하는 물질인 ( ㉤ )을/를 가지고 지구 내부의 물질 이동을 설명하는 이론이다.","단층면에는 지반이 서로 엇갈려 움직이면서 암석이 매끈하게 갈려진 ( ㉥ )이/가 생겨나거 나 암석이 깨지고 부스러지면서 단층 점토나 단층 각력이 끼어 있는 ( ㉦ )이/가 발달한다.","수평의 경암층과 연암층이 호층을 이루는 퇴적암 고원이 침식을 받으면 계단 모양의 사면 이 형성되는데, 상부의 경암층 아래에 놓인 연암층에서 ( ㉧ )이/가 발생하고 이에 따라 사면 이 불안정해져 상부의 경암층이 무너져 내리기 때문이다. 그 결과 경암층에서는 단애가, 연암 층에서는 암설 사면이 발달한다.","복류수 유출은 지표면과 포화대 사이, 즉 ( ㉨ )에서 발생하는 유출을 말한다.","우리 나라의 지형도는 횡단 머케이터(Transverse Mercator)도법을 기준으로 제작한다. 그 렇기 때문에 투영 원점을 지나는 ( ㉩ )을/를 따라서는 축척 계수가 1이지만, ( ㉪ ) 방향으로 의 축척 계수는 1이 아니다. 그러므로 지형도에 표기된 축척인 ( ㉫ )와/과 지도 내의 실제 축 척은 지점과 방향에 따라 다르다.(㉩과 ㉪에는 ‘위선’ 또는 ‘경선’중에서 선택 기입할 것 )","지리학자 토블러(Tobler)가 지리학 연구에 적용한 ( ㉬ ) 개념은 공간상의 데이터가 인접한 지역간에는 속성이 유사한 경향을 보이며, 멀리 떨어진 지역과는 다른 경향을 보인다는 의미 로 사용된다.","( ㉭ )은/는 그리드(픽셀)의 사분면 내에서 속성의 중복 제거에 기초한 래스터데이터의 압축 기법이다."],"a":{"㉠":"루미네선스(luminescence)","㉡":"연약권(asthenosphere)","㉢":"지향사(geosyncline)","㉣":"판구조론(plate tectonics)","㉤":"플룸(plume)","㉥":"단층경면 또는 단층활면(slicken side)","㉦":"단층파쇄대(fragmental zone)","㉧":"기저굴식(basal sapping)","㉨":"통기대(zone of aeration)","㉩":"경선","㉪":"위선","㉫":"표준축척(standard scale)","㉬":"공간적 자기상관(spatial autocorrelation)","㉭":"쿼드 트리(Quad Trees)"},"e":"","ea":""},"31":{"q":["중부원점의 북동쪽으로 인접한 지역을 포함하는 1 : 50,000 수치 지형도의 도엽 번호는 ( ㉠      )이고, 동부원점의 남서쪽으로 인접한 지역을 포함하는 1 : 25,000 수치지형도의 도엽 번호는 (       ㉡   )이다.","종이 지형도 NJ52-14-11-2 도엽에 해당하는 수치 지형도의 도엽 번호는 (             ㉢       )이다.","람베르트(J.H.Lambert)가 최초로 고안한 (       ㉣       ) 도법은 원통을 적도에 감싸서 지도를 만드는 것이 아니라 경선(자오선)에 세로로 감싸는 방식으로 제작한다. 이 도법은 전세계를 다 그릴 수는 없지만, 남북으로 길고 동서로 좁은 지역의 대축척 지도를 그릴 때 가장 완벽한 도 법이 된다.","우리나라는 2003년부터 준거타원체로 GRS80 타원체를 사용하고 있고, 데이텀 또한 (                        ㉤ ) 데이텀을 기준으로 측량 및 지형도 제작을 하고 있다.","(    ㉥   )은/는 지표면의 한 지점에서 지구 중심을 방향으로 수직선을 그었을 때 수직선과 적도 평면이 교차하는 각도를 의미하고, (           ㉦       )은/는 지표면의 한 지점에서 지구 중심을 향해 직선을 그었을 때 그 직선과 적도 평면이 교차하는 각도를 의미한다.","1:100,000 지도의 축척은 1:25,000 지도의 (       ㉧    )배 이고, 지도가 포괄하는 범위는 ( ㉨      )배 이다.","화산진이나 화산회와 같이 대기에 부유하여 이동하는 세립의 화산쇄설물을 (                      ㉩     )(이) 라고 한다.","해양판 주변부의 밀도가 작은 심해퇴적물이 섭입대 표면의 해저에 누적되는 지역을 (                            ㉪ )(이)라고 한다.","태종 2년에 이회가 중심이 되어 제작한 ‘혼일강리역대국도지도(混一疆理歷代國都之圖)’는 중국에서 들여온 세계지도인 이택민(李澤民)의 (                ㉫   )와/과 역대 제왕의 연혁을 나타낸 청 준(淸濬)의 혼일강리도(混一疆理圖)를 합친 지도이다.","공간 객체의 유형은 위상적 차원에 따라 분류된다. (                ㉬   )은/는 길이도, 폭도, 깊이도 없는 0차원적 실체이고, (        ㉭   )은/는 길이와 폭은 가지지만 깊이는 없는 2차원적 실체이 다."],"a":{"㉠":"38713","㉡":"378042","㉢":"368072","㉣":"횡단 메르카토르(Transverse Mercator)","㉤":"ITRF 2000","㉥":"측지 위도(geodetic latitude)","㉦":"지심 위도(geocentric latitude)","㉧":"1/4","㉨":"16","㉩":"테프라(tephra)","㉪":"부가대(accretion zone)","㉫":"성교광피도(聲敎廣被圖)","㉬":"점(point)","㉭":"면(area)"},"e":"선행하(antecedent stream)의 의미를 서술하시오.","ea":"지각 변동에도 불구하고 원래의 유로방향을 유지하며, 융기하는 산릉을 절단하며 흐르는 하천 이다."},"32":{"q":["슬레이터(F.Slater)는 실증주의 지리교육을 비판하고 ‘지리에 대한 학습’이 아니라 (                        ㉠ )을/를 주창하였다.","인간주의 지리교육의 목적은 인간과 장소에 대한 자기인식과 상호이해에 있다. 그렇기 때 문에 인간주의 지리교육은 다양한 인간의 삶에 대한 존중과 관용, 감정이입과 (                           ㉡    )에 초 점을 둔다.","맥파트랜드(McPartland)에 의하면 (       ㉢    )(이)란 장소와 그곳에 거주하는 사람들의 이미 지를 구성하거나 재구성하는 능력이다.","지리교육에서 (         ㉣   )은/는 학생들이 세상을 인식하고 지리적 지식을 의미있게 구성하게 하는 인지적 도구, 즉, 공간을 의미있는 장소로 변환하거나, 차가운 객관적 사실과 뜨거운 인 간의 경험을 연결하는 다리 역할을 한다.","크레스월(Krathwhol) 등은 정의적 영역을 위계적 순서에 따라 수용, 반응, 가치화, 조직화, 인격화 등 5개의 하위 범주로 구분하였는데, 이 위계 수준은 (                  ㉤       )에 기초하였다. 피아제 (Piaget)는 (    ㉤    )을/를 외부세계에서 경험하고 행동한 것을 (            ㉥     )(으)로 바꾸어 표상 하는 과정이라고 하였다.","유길준의 (       ㉦   )은/는 후쿠자와 유키치(福澤諭吉)의 ‘서양사정’의 영향을 받은 저술이다.","(   ㉧      )(이)라고 부르는 풍화대는 신선한 기반암 위에 놓여 있는 풍화물질층으로 (                     ㉧ )와/과 신선한 기반암의 경계부를 (         ㉨       )(이)라고 한다. (   ㉧       )은/는 아래부터 (     ㉩ ), 새프롤라이트, 잔적층으로 구성되어 있다.","거초는 해안 또는 섬 주변에 좁은 선반처럼 성장하지만, (                  ㉪   )은/는 연안사주처럼 외 해에서 성장하고, 석호에 의해 중심 섬으로부터 분리되어 있다. 반면 (                       ㉫   )은/는 석호 주 변에 둥글게 발달하지만 중심 섬이 없다.","(   ㉬      )(이)란 선상지, 페디먼트, 플라야 등을 가지는 폐쇄된 건조 분지를 뜻한다.","탑 카르스트를 이루는 뾰족하고 높은 잔류 석회암 봉우리를 (                    ㉭     )(이)라고 하는데, 대 체로 100m 이상의 높이를 가진다. 반면 석회암 잔구를 이루는 봉우리가 (                        ㉭       )보다 더 뾰족하고 날카로운 형태를 가지는 경우는 피너클 카르스트로 불린다."],"a":{"㉠":"지리를 통한 학습(learning through geography)","㉡":"장소감(sense of place)","㉢":"지리적 상상력(geographic imagination)","㉣":"내러티브(narrative)","㉤":"내면화(internalization)","㉥":"스키마(schema, 인지도식)","㉦":"서유견문(西遊見聞)","㉧":"레골리스(regolith)","㉨":"풍화전선(weathering front)","㉩":"샙록(saprock)","㉪":"보초(barrier reef)","㉫":"환초(atoll)","㉬":"볼손(bolson)","㉭":"마고테스(magotes) 또는 건초구릉(haystack hill)"},"e":"몰바이데(Mollweide) 도법은 중앙경선과 90도선을 제외한 경선들이 반타원을 이루게 된다. 이 로 인해 나타나는 문제점을 쓰고, 어떤 해결책을 사용하는지 설명하시오.","ea":"고위도로 갈수록 확대되기 때문에 위선 간격을 점진적으로 줄여서 정적성을 유지한다."},"33":{"q":["(   ㉠   )은/는 영국 남부에서 프랑스 동부, 독일 서부, 이탈리아 북부에 이르는 유럽 메갈 로폴리스를 일컫는 말로 리버풀-밀라노 축이라고도 불린다.","(   ㉡   ) 개념은 인간 친화적 혼합용도를 지향하며 아름다운 경관의 도시 주거환경을 구 성하는 수단을 통칭하는데, 주요한 특징으로는 소규모와 친밀감, 지속가능한 환경, 자동차 없 이 보행으로 가능한 도시 생활, 주민주도 커뮤니티 등을 들 수 있다. 반면 (              ㉢     ) 개념은 동질적인 공동체로서의 공간적 단위라고 할 수 있는데, 창안자인 페리(Clarence Perry)에 따 르면, 인구 5~6천명과 반경 4~5백미터의 공간적 범위가 하나의 단위이며, 초등학교가 중심적 역할을 담당한다.","‘주례 동관 고공기’의 도시 계획 기법은 우리나라와 일본으로 전파되었는데, 이에 따르면 남북대로의 동쪽에는 왕의 조상을 위한 (           ㉣   )을/를, 서쪽에는 지신을 위한 (      ㉤   )을/ 를 두도록 하였다.","(   ㉥   )은/는 취락 입지의 4대 조건인 지리, 생리, 인심, 산수 등을 제대로 갖추지 못한 곳이다.","대동여지도의 모태가 되는 청구도는 일정한 지점을 중심으로 10리마다 원을 둘러 그려서 거리를 정확히 했다. 김정호는 이를 (        ㉦   )(이)라고 명명하였다.","(   ㉧   )은/는 객관적 지식에 대한 믿음이 침식되고, 상대주의가 체계적으로 진리를 훼손 하고 있다는 우려로부터 나온 것으로, 구성주의와 포스트모더니즘의 상대주의 지식관의 영향 력을 교육계에서 추방하려고 하는데, 실제 Michael Young 등은 (        ㉨   )(이)라는 개념을 제 안하며, 지식교육 강화라는 실천적 목적을 가지고 나름의 지식관을 발전시키고 있다.","개념중심 지리내용 구성 방법은 핵심 개념의 추출이 어렵지만, (           ㉩   )의 작성을 용이하 게 하고 내용의 계통성을 유지하게 한다.","블룸(Bloom)의 신교육목표분류학의 인지과정 차원은 기억하다, 이해하다, 적용하다, 분석하 다, 평가하다, 창안하다의 6개 범주로 구성되어 있는데, 이 중 기억하다는 (              ㉪    )와/과 관 련이 있고, 나머지는 (     ㉫   )와/과   관련이 있다.","지구 중심을 통과하는 평면과 지구가 교차함으로써 생성되는 원을 (              ㉬   )(이)라고 하고, 지구 중심을 관통하지 않는 평면과 지구가 교차함으로써 생기는 원을 (               ㉭       )(이)라고 한 다."],"a":{"㉠":"블루바나나(blue banana)","㉡":"어반빌리지(urban village)","㉢":"근린주구(neighborhood unit)","㉣":"종묘(宗廟)","㉤":"사직(社稷)","㉥":"가거부적지(可居不適地)","㉦":"평환법(平環法)","㉧":"사회적 실재론(social realism)","㉨":"강력한 지식(powerful knowledge)","㉩":"교수요목(敎授要目)","㉪":"파지(retention)","㉫":"전이(transfer of learning)","㉬":"대권(great circle)","㉭":"소권(small circle)"},"e":"극투영을 했을 때 평사도법과 정사도법의 위선의 형태와 간격을 비교하시오.","ea":"평사도법과 정사도법 모두 위선은 동심원으로 표현되지만, 평사도법은 저위도로 갈수록 위선 간격이 증가하고, 정사도법은 저위도로 갈수록 위선 간격이 줄어든다."},"34":{"q":["숏(J.Short)은 세계도시체계 내에서 중심성을 확보하지 못한 배제된 도시들을 설명하기 위 해 (     ㉠   )와/과 느슨한 연결(loosely connected) 개념을 제안하였다. (        ㉠    )은/는 인구 300만 명 이상임에도 세계도시로 분류되지 않은 도시들을 의미한다.","도시-촌락 이분법적 인식에서는 도시와 촌락의 대표적인 차이점으로 집단성, 비농업성, ( ㉡      ) 등이 지적된다. (   ㉡       )은/는 도시가 주변의 배후지나 다른 도시와의 상호작용의 거 점이 되는 특성이다.","2020년 UN 통계위원회에서 개발한 새로운 도시 설정 기준인 (                 ㉢      )은/는 국제적으로 일관성 있는 도시 설정을 위해 행정구역보다 지리적 시의 개념을 충실히 반영하는 방식이다.","배튼(D. Batten)의 네트워크도시는 여러 도시가 서로 인접하여 입지함으로써 (                    ㉣   ) 효 과를 누리는 동시에, 이들 도시 간에 상호보완적이고 유기적인 연계가 발달하여 네트워크경제 효과까지 창출하는 다중심 구조의 대도시권을 의미한다.","타바(Taba, 1962)는 개념 중심 교육과정을 구성하기 위한 핵심개념의 선정 기준으로 5가지 로 제시하였는데, 그 중 (        ㉤      )은/는 그 개념이 세계의 중요한 현상들을 잘 설명할 수 있 는가의 여부이며, (       ㉥    )은/는 그 개념이 교육과정의 범위와 계열의 전개에 적절한 지의 여부이다.","피아제(Piaget)는 자기 중심적 언어가 먼저 발달하고 점차 사회적 언어가 발달한다고 본 반 면, 비고츠키(Vygotsky)는 사회적 언어가 먼저 발달하고 이어서 자기 중심적 언어가 발달하는 것으로 보았다. 또한 비고츠키는 자기 중심적 언어를 자신의 사고를 구성해간다는 점에서 ( ㉦      )(으)로 파악하였다.","(    ㉧   ) 개념화는 구성주의 관점에서 동일 대상에 대하여 사람들마다 다르게 형성되는 개념화 과정을 일컫는데, (           ㉨    )(이)나 (   ㉩   ) 등이 이에 해당한다. (    ㉨    )은/는 형 식적인 교수가 일어나기 전에 어떤 토픽에 관해 학생들이 가지고 있는 불완전하거나 순진한 개념이며, (      ㉩   )은/는 일반적으로 학생들이 형식적인 모델이나 이론에 노출되어 이것을 부정확하게 동화한 경우에 형성되는 개념이다.","가네(Gagne)의 학습 이론인 (          ㉪    ) 이론은 학습되는 지식이 절대적 진리라는 가정을 토대로, 학습이 귀납적 일반화 과정에 따라 이루어지는 것을 의미한다. 그러므로 가네는 ( ㉫      )을/를 개념 학습을 위한 가장 기본적인 기능이자 일반화를 위한 탐구의 시작으로 간주 한다.","슬레이터(Slater)는 지리 수업 계획을 10단계로 구분하였는데, 활용 가능한 질문을 파악하 기 위한 (    ㉬   )을/를 가장 첫 단계로 제시하였다.","영조 대의 (       ㉭    )은/는 읍지의 종합적 성격을 대표하는 것으로 방리, 도로, 부세 및 군병 항목을 각 군현별로 상세하게 수록하였다."],"a":{"㉠":"블랙홀(black hole)","㉡":"결절성(nodality)","㉢":"도시화도(DEGURBA, degree og urbanization)","㉣":"집적경제(agglomeration economies)","㉤":"유의미성(significance)","㉥":"균형성(balance)","㉦":"내적 언어(inner speech)","㉧":"대안적(alternative)","㉨":"선개념(preconception)","㉩":"오개념(misconception)","㉪":"위계학습(hierarchical learning)","㉫":"관찰(observation)","㉬":"브레인스토밍(brainstorming)","㉭":"여지도서(輿地圖書)"},"e":"유역분지 내에서 급격한 유출이 발생하는 경우를 하계밀도와 유역분지의 형상을 토대로 설명 하시오. (단, 형상은 등방형, 장방형 중에서만 선택하고 급격한 유출이 발생하는 이유도 포함 할 것)","ea":"하계밀도가 높으면 하도로 물의 유입이 활발해져 급격한 유출이 발생하고, 유역분지의 형상이 등방향이면 지류 하천들의 길이가 유사하여 급격한 유출이 발생한다."},"35":{"q":["블룸(Bloom)의 신 교육목표 분류학에서 지식 차원은 다시 4가지로 위계화할 수 있는데, 전 문 용어에 대한 지식은 (          ㉠    ) 지식으로, 교과의 특수한 기법과 방법에 대한 지식은 ( ㉡       ) 지식으로 분류할 수 있다.","지평확대 역전 방법을 주장하는 학자들은 인지발달이론의 측면에서 볼 때, 아동이 10세에 이후가 되면 (        ㉢   ) 관계에 대한 이해 수준이 국가나 세계에 이르기 때문에, 세계를 먼저 가르치는 것이 가능하다고 말한다.","전조작기의 아동은 사각 또는 평면각의 형태로 조망할 수 있는 능력이 없으므로 인지도를 그리게 되면 공간적 사상을 나열식으로 표현하게 되지만, 형식적 조작기의 아동은 새가 하늘 에서 내려다보는 시점으로 (          ㉣   )을/를 그릴 수 있게 된다.","행동주의 관점에서 교사의 역할은 지식의 전달자 또는 학생들의 감독자이지만, 구성주의 관점에서 교사의 역할은 학습의 (           ㉤    )이다.","효과적인 비계설정(scaffolding)을 위해서는 먼저 현재 발달 수준을 진단하여야 하고, 현재 발달 수준과 (        ㉥   ) 사이의 영역을 (    ㉦     )(이)라 한다.","근대 교육의 창시자인 코메니우스(J.A.Comenius)의 교육사상이 가장 잘 구현된 교과서는 ( ㉧      )이다.","슬레이터(Slater)의 단순화한 탐구학습 단계는 과학적 탐구학습의 (           ㉨   ) 설정과 (   ㉨ ) 검증의 단계를 제외하였다.","발견학습은 학생들에게 불완전한 증거에 의거해서 추측을 하게하고, 이 추측을 체계적으로 입증하거나 반증하게 함으로써 (            ㉩    ) 사고력을 기를 수 있다.","카터(Carter)의 질문 유형 분류에 따르면 ‘토양이 메말랐을 때 무엇이 일어났었나?’는 ( ㉪       ) 질문에 해당한다.","(    ㉫     )은/는 특수한 가치 집단에서보다는 일상생활에서의 가치화 과정을 강조한다. 이 방법은 어떤 가치를 학생들이 갖도록 교사가 강요하는 것보다도 자기 자신의 가지고 있는 가 치를 분명히 하고, 가치의 모순과 갈등을 극복하여 일관성을 유지하도록 하는 것을 중요시하 는 가치 지도의 한 방법이다.","슬레이터(Slater)는 지리탐구학습에 있어서 질문, 자료, 일반화를 강조하며, 특히 학습과제 에 자료의 수집과 처리 방법을 적용하는 기능을 연습해야 한다고 주장하였다. 그리고 이러한 자료를 처리하기 위한 기능을 (              ㉬   ), 사회적 기능(social skills), 실천적 기능(practical skills)으로 구분하였다.","모둠활동에서 개인이 다른 구성원의 목표 달성에 무임승차가 가능한 경우, 다른 구성원도 집단의 목표 성취를 위해 노력하지 않게 되는 현상을 (                    ㉭   )(이)라고 한다."],"a":{"㉠":"사실적(factual)","㉡":"절차적(procedural)","㉢":"공간 포섭(spatial subsumption)","㉣":"조감도(鳥瞰圖)","㉤":"촉진자(facilitator), 장려자(scaffolder), 안내자(guide)","㉥":"잠재적 발달 수준(potential developmental level)","㉦":"근접 발달 영역(zone of proximal development)","㉧":"세계도해(orbis sensualium pictus)","㉨":"가설(hypothesis)","㉩":"직관적(intuitive)","㉪":"관찰(observation)","㉫":"가치명료화(Values Clarifications)","㉬":"지적 기능(intellectual skills)","㉭":"봉효과(sucker effect)"},"e":"분리빙(ice segregation)이 실트질 퇴적층에서 잘 만들어지는 이유를 설명하시오.","ea":"작은 공극이 많아 모세관력과 응집력이 강하고 수분의 이동이 원활하기 때문이다."},"36":{"q":["‘15분 도시’는 모레노(C.Moreno)가 제시한 개념으로 도보나 자전거를 통해 15분 이내에 접 근할 수 있도록 도시 공간 구조를 재편하자는 실천 전략이다. 이 개념은 시간-도시주의를 의 미하는 ‘크로노어바니즘’, 자유로운 시공간을 뜻하는 ‘크로노토피아’, 그리고 장소에 대한 애착 을 의미하는 ‘(     ㉠      )’ 등 세 가지 핵심 철학에 기반한다.","사센(S.Sassen)은 (       ㉡    )을/를 전문 서비스의 생산지, 금융 혁신의 생산과 시장 형성의 장소라고 설명하였는데, 두 가지 모두 금융 산업의 국제화 및 확대에서 중심적 역할을 한다.","집단 탐구Ⅱ(Co-op Co-op)는 집단 탐구(GI)의 단점인 모둠활동에 대한 (                   ㉢    )을/를 보 완하기 위해 만든 것으로 구성원 개인의 책무성이 강조된 수업 방법이다.","문제기반학습(PBL)의 수업 단계는 비구조화된 실제적인 문제 제시 → 가설 설정 → (                          ㉣ ) → 결론으로 이루어진다.","슐만(Shulman)은 교사 역량을 기르기 위한 4단계를 제안하였다. 첫 번째 단계는 준비 단 계로서 교과 내용을 비판적으로 이해하는 단계이다. 두 번째 단계는 재현(Representation) 단 계로서 자신이 알고 있는 교과의 내용을 재현할 여러 방법을 궁리하는 단계이다. 내용을 재현 하는 방법은 자신들이 가진 (                 ㉤     )에 의존한다. 세 번째는 선택의 단계인데, 이 단계에서 는 자신이 가르치는 목적에 비추어서 무슨 내용을 어떻게 가르칠 것인가, 단순화시키거나 배 제해야할 부분이 무엇인지를 선택한다. 마지막은 (                      ㉥     )의 단계인데, 선택된 가르칠 내용 을 학생들의 특성에 맞게 조정하는 것을 의미한다.","로버츠(M.Roberts)에 의하면, 지리학적 지식이 변함에 따라 지리적 질문도 변화되어 왔는 데, 즉 (    ㉦    ) 지리학에서는 ‘왜(why)?’라는 주로 과학적 법칙을 찾는 질문을 하였고, ( ㉧     ) 지리학에서는 ‘무엇(what)?’과 ‘어디(where)?’라는 기술적인 질문을 주로 하였다. 또한 (    ㉨   ) 지리학에서는 인간의 선호와 지각에 대한 질문으로, 그리고 (                    ㉩       ) 지리학에서 는 사회적 관계를 강조하는 질문인 ‘그것으로 인해 어떤 영향이 나타날 것인가(with what impact)?’, ‘무엇을 해야만 하는가(what ought)?’라는 질문으로 확장되어 왔다.","가촌과 광장촌은 모두 (             ㉪       ) 민족으로부터 기원한 것으로 추정된다.","풍수라는 말은 (         ㉫       )을/를 의미하는데, 풍수에서 생기를 잘 갈무리할 곳을 명당이라고 하며, 이곳을 둘러싼 (            ㉬    )을/를 동청룡, 서백호, 남주작, 북현무라고 하였다.","소자(E.Soja)는 도시 공간 구조가 과거의 과정을 품은 채 현재와 미래에까지 영향을 미친다 는 의미로 로스앤젤레스를 (               ㉭       )(으)로 비유했는데, (   ㉭   )은/는 ‘무언가를 지우고 다 시 쓰지만 흔적이 남아있는 문서’로 과거의 흔적이 겹쳐있는 상태, 시간의 층위 등을 일컫는 용어이다."],"a":{"㉠":"토포필리아(topophilia)","㉡":"글로벌 도시(global city)","㉢":"통제력","㉣":"자기주도학습(self-directed learning)","㉤":"교수내용지식(Pedagogical Content Knowledge)","㉥":"적용(adaption)","㉦":"실증주의","㉧":"경험주의","㉨":"인간주의","㉩":"급진주의","㉪":"슬라브(Slav)","㉫":"장풍득수(藏風得水)","㉬":"사신사(四神砂)","㉭":"팔림프세스트(palimpsest)"},"e":"글로벌 가치 사슬(GVC)의 경제적 거버넌스 유형 중 관계형 거버넌스와 모듈형 거버넌스의 거 래의 형식화 수준을 비교하고, 그로 인해 선도기업과 공급업체 사이에 빈번한 의사소통 및 신 뢰가 요구되는 거버넌스 유형을 밝히시오.","ea":"모듈형 거버넌스가 관계형 거버넌스보다 거래의 형식화 수준이 높다. 그러므로 관계형 거버넌 스가 선도기업과 공급업체 사이의 빈번한 의사소통 및 신뢰가 더 요구된다."},"37":{"q":["윌리엄스(Williams)는 지리수업을 위한 체제적 수업설계 모형을 제시하였는데, 이러한 시스 템에 학생들이 학습에 들어갈 때는 활동 단원 또는 토픽과 관련한 학생들의 (                          ㉠   ), 경험, 열의, 관심이 매우 중요하기 때문에 수업 설계 시 이들을 고려해야 한다고 하였다.","인지부하이론은 작업기억의 한계를 조정하기 위해 의미덩이 짓기(청킹), 자동화, (                        ㉡      ) 등을 제시하는데, (     ㉡   )은/는 시각과 청각의 두 구성요소가 작업기억에서 함께 정보를 처 리하는 방식을 말한다.","토런스(Torrance)가 지적한 창의적 사고력의 특징 중 ‘개방적인 상태의 문제에 관하여 수 많은 아이디어를 산출해 낸다.’는 (          ㉢    )에 해당한다.","2022 개정 교육과정 중학교 사회(지리) 내용체계에서 위치와 영역, 장소와 지역, 공간 분석 등은 (    ㉣   ) 영역에 해당한다.","나선형 교육과정은 학생의 (        ㉤       ), 즉 학습자의 발달과정과 지적 수준에 맞춘 교육과정 을 말한다. 더 구체적으로, 나선형 교육과정은 학습자가 주제를 완전히 이해하기까지 학년에 맞는 소재를 이용하여 반복적으로 제시하는 교육과정을 말한다.","슬레이터(Slater)에 의하면, 지리교육적 이데올로기는 서로 다른 가치와 견해를 반영하는 명백한 언어와 어휘를 사용하고 있기 때문에 지리교육이 나아갈 방향과 범위를 제공한다고 하 였는데, 가령 공간, 패턴, 분석 등은 (            ㉥   ) 패러다임, 장소, 인간, 느낌 등은 (          ㉦      ) 패러다임, 사회, 구조, 권력 등은 (         ㉧    ) 패러다임을 반영하는 개념이다.","로버츠(M.Roberts)는 사람들을 거쳐감에 따라 전달되는 내용이 조금씩 달라지는 게임인 ( ㉨      )을/를 도입하였다. 이 활동은 학생들로 하여금 이미지를 정확하게 표현하는 데 요구되 는 것이 무엇인지 알도록 한다.","한 개의 검사 혹은 평가도구가 무엇을 측정하는가와 ‘측정하려고 의도하는 것’을 어느 정도 로 충실하게 측정하고 있느냐의 정도(검사의 진실성 혹은 정직성)를 (                       ㉩    )(이)라고 한다.","로빈슨과 서프(Robinson & Serf)에 의해 처음 제시된 (              ㉪    )은/는 사진과 이미지 등 시각자료에 재현된 정보를 관찰, 탐구, 해석하는 능력인 (                  ㉫       )을/를 촉진하기 위한 일종 의 비계장치이다.","‘사회계층’과 같이 2개 이상의 속성을 가진 개념을 (                ㉬     )(이)라고 하며, ‘국민’과 같이 여러 조건 중에서 하나만 만족해도 성립하는 개념을 (                 ㉭       )(이)라 한다."],"a":{"㉠":"적성(aptitude)","㉡":"이중처리(dual processing)","㉢":"유창함(fluency)","㉣":"지리인식","㉤":"학습 준비도(readiness for learning)","㉥":"실증주의/과학적","㉦":"인간주의","㉧":"급진주의/진보적","㉨":"차이니스 위스퍼스(Chinese whispers)","㉩":"타당도(Validity)","㉪":"비전프레임(vision frame)","㉫":"비주얼 리터러시(visual literacy)","㉬":"접합개념(conjunctive concept)","㉭":"이접개념(disjunctive concept)"},"e":"‘잠열(latent heat)’의 의미를 설명하시오.","ea":"물질이 온도의 변화없이 상이 바뀔 때 흡수하거나 방출하는 열이다."},"38":{"q":["케빈 린치(K.Lynch)는 도시 이미지의 요소를 도로나 철도 등의 통로(paths), 인지된 경계인 테두리(edges), 기능이나 정체성을 공유하는 도시 내 부분인 (              ㉠   ), 특정 활동이나 기능 이 교차하는 결절(nodes), 마지막으로 멀리서도 눈에 띄어 이정표가 되는 (                 ㉡     ) 등으로 정리하였다. 그리고 이 5가지 요소가 잘 어우러진 도시가 이미지성이 높은 도시라고 하였다.","다문화주의의 한계에 대한 인식을 바탕으로 최근 유럽 연합에서는 (                  ㉢       ) 프로그램을 실시하고 있다. (       ㉢   )(이)란 다양한 국적, 출신, 언어, 종교, 신념, 배경 등을 가진 사람들 이 모여있는 도시로 다양성을 문제가 아닌 자원으로 간주한다.","우리나라의 반지하, 옥탑방, 고시원, 홍콩의 분할주택, 코핀홈(coffin home) 등은 안정적인 주거의 조건들을 충족하지 못한 (             ㉣   )의 대표적인 사례이다.","게이티드 커뮤니티의 등장은 사회집단 간의 공간적 (              ㉤     )을/를 심화시켜 사회적 상호 작용을 저해하기 때문에 낮은 계급의 사회적 (              ㉥   )을/를 만들어낸다.","글로벌 상품사슬(GCC)은 (        ㉦    )에서 파생하여 1980년대 등장한 개념인데, 행위자 중심 의 접근법이었던 (       ㉧   )와/과 달리 구조주의적 성격이 강했다.","‘다양성 존중의 태도는 서로 다른 문화권과 다문화 사회의 특성을 이해하는 바탕이 된다’라 는 핵심 아이디어를 가진 2022년 통합사회1의 지식∙이해 범주의 단원은 (                   ㉨    )이다.","램버트(Lambert)는 평가의 가장 중요한 목적을 학생들을 (             ㉩   ) 과정이라고 역설하였 다.","(   ㉪   )은/는 평가 대상의 상대적인 차이에 압도되어 실제 실력을 왜곡하는 오류이다.","사회과 교과역량인 비판적 사고력은 핵심 역량으로는 (              ㉫    ) 역량에 해당한다.","브루너(J.Bruner)의 표상방식은 피아제의 발달 단계에서 학습자들이 개입하는 조작과 유 사한 면이 있지만, 단계 이론은 아니다. 브루너의 이론에 의하면, 개념은 동시에 여러 가지 방 식, 즉 (     ㉬   )이/가 가능하다.","극단적 교수현상 중 (       ㉭       )은/는 교사가 학생들이 지식을 추가하거나 깊이 파고들어 생각하지 않도록, 절대적으로 표현하는 것을 의미한다."],"a":{"㉠":"지구(districts)","㉡":"랜드마크(landmarks)","㉢":"상호문화도시(intercultural cities)","㉣":"비적정주거(inadequate housing)","㉤":"분리 또는 격리(segregation)","㉥":"배제(exclusion)","㉦":"세계체제론(world system theory)","㉧":"글로벌 생산네트워크(GPN)","㉨":"문화와 다양성","㉩":"알게되는","㉪":"대비의 오류(contrast error)","㉫":"지식정보처리","㉬":"다중표상(modes of representation)","㉭":"도그마화(Dogmatization)"},"e":"글로벌 상품사슬(GCC)이 글로벌 가치사슬(GVC)로 대체되어 거버넌스에 대한 설명이 더욱 정 교화되었는데, 정교화가 필요하게 된 이유 또는 배경을 설명하시오.","ea":"생산자주도형 산업과 구매자주도형 산업의 구분이 매우 모호하거나 생산자주도형 산업에서도 구매자주도형 거버넌스 전략을 선택하는 경우가 늘어나고 있기 때문이다."},"39":{"q":["하우드(Hawood)는 논쟁문제 토론수업에서 (       ㉠   )을/를 가장 바람직한 교사의 역할이라 고 주장하였다.","학생집단학습(Student Team Learning)은 개별적 책무성, 소집단 보상, (      ㉡   )의 균등 이라는 특징을 가진다.","교육과정 (     ㉢   )은/는 교사에 의한 교육과정 재구성이 이루어져 다양화하고 융통성있게 교육과정을 운영하기 위해서 도입되었는데, 교수학습과 관련된 중요한 의사결정 사항들을 단 위 학교에 상당부분 위임함으로써 학교 수준의 다양한 교육과정을 확보할 수 있는 근거가 되 었다. 구체적으로 교육과정의 내용 요소를 대주제, 중주제, 소주제 등으로 구체적으로 명시하 는 대신에 주제명과 주제 안내 및 성취기준을 제시하고 소주제명은 삭제하였다.","거버와 윌슨(Gerber & Wilson)은 지도 활동 기능을 발달시키기 위해 평면도 조망, (             ㉣ ), 비율, 지도 언어 등의 필수적 지도 구성 요소를 고려해야 한다고 주장하였는데, (                ㉣   ) 은 위치 개념과 정향 능력을 길러주는 지도 구성 요소이다.","영국 국가교육과정에 제시된 지리의 핵심 개념 7가지는 장소, (            ㉤     ), 스케일 등 기본 개념 3가지와 상호의존성, 자연적․인문적 프로세스, 환경적 상호작용과 지속가능한 개발, 문화 적 이해와 다양성 등 확장 개념 4가지로 구성된다.","블룸(Bloom)의 신교육목표분류학의 지식 차원은 사실적 지식, 개념적 지식, 절차적 지식, 메타인지 지식 등으로 구성되는데, 분류와 유목에 대한 지식은 (           ㉥       )에 해당한다.","테일러(Taylor)가 제시한 주제 선정 후, 지역기반 사례학습은 지리적 주제가 탐구 계열을 위한 중심 (      ㉦    )이/가 되게 하는 방법인데, 지리적 지식에 대한 정돈된 이해를 축진시키 지만, 지역에 대한 (       ㉧   )된 지식을 심어줄 가능성이 있다.","스파이크맨(N.J.Spykman)의 (   ㉨   ) 이론은 심장지역 주위의, 이른바 (      ㉨   )의 해양 인접성을 기초로 해서 이 지역을 세계 지배상 중요한 곳이라고 강조한 외에, 제2차대전 직후 미국에게는 심장지역 소재 공산주의 소련의 팽창을 막는 보루지역으로서 지극히 중요한 것이 라는 점을 일깨워 준 이론이었다.","핵가족 형태가 보편화되면서 성인 자녀가 교육을 마치고 집을 떠났다가 되돌아오는 ( ㉩       ) 자녀가 증가하기 시작하였다. (    ㉩   ) 자녀는 우리나라의 캥거루족에 해당하는 용어 이다.","(    ㉪   ) 협약은 유럽 각국이 공통의 출입국 관리 정책을 사용하여, 유럽 국가 간의 자 유로운 이동을 보장하는 협약이다.","데이터를 분류하는 일반적인 방법들 중에서 최적분류법과 (      ㉫   )은/는 유사한 값들을 동일한 계급으로, 유사하지 않은 값들을 다른 계급으로 묶을 수 있기 때문에 선호된다. 반면, (    ㉬   )와/과 등간격분류법은 데이터의 분포를 고려하지 않는 분류방법이다.","(    ㉭   ) 민족은 이베리아 반도에서 가장 오래된 역사를 가진 민족 중 하나로 독자적인 언어를 사용하는데, 스페인에는 약 240만 명이, 프랑스에는 약 20만 명이 살고 있다."],"a":{"㉠":"공정한 의장형(impartial chairperson)","㉡":"성공기회(opportunity for success)","㉢":"대강화(compaction)","㉣":"배열(arrangement)","㉤":"공간(space)","㉥":"개념적 지식","㉦":"조직자","㉧":"파편화","㉨":"주변지역(rimland)","㉩":"부머랭(boomerang)","㉪":"솅겐(Schengen)","㉫":"자연분류법(natural breaks)","㉬":"등개수분류법(quantile)","㉭":"바스크(basque)"},"e":"열촌과 가촌의 유사점과 차이점을 각각 하나씩 제시하시오.","ea":"열촌과 가촌은 모두 교통로에 대한 접근성이 높지만, 열촌은 농가와 경지가 연속된 반면 가촌 은 농가와 경지가 분리되어 있다."},"40":{"q":["샤론 주킨(S.Zukin)에 의해 개념화된 (    ㉠   )은/는 공장이나 창고로 쓰이던 천장이 높은 산업용 공간을 작업실로 개조하여 거주하는 형태로 현재 뉴욕 소호(SoHo) 탄생의 바탕이다. 버려진 산업 공간을 저렴한 임대료를 찾아 들어온 가난한 예술가들이 사용하며 독특한 문화적 분위기를 형성하였고, 이는 공간의 가치를 획기적으로 향상시켰으나, 그로 인한 임대료 폭등은 가난한 예술가를 쫓겨나게 만들었다. 이렇게 지역의 가치를 향상시킨 예술가들의 내몰림 현상 을 (    ㉡   )(이)라고 한다.","(   ㉢   )은/는 기후 변화, 재난, 사회․경제적 충격 등 다양한 위험요인을 흡수하고, 도시 시스템이 빠르게 정상 기능을 회복하며, 장기적으로 더 나은 상태로 적응하는 능력을 의미한 다.","저성장시대의 새로운 도시 패러다임으로 생활도시, 압축도시, 포용도시, (           ㉣       ) 등이 제 시되는데, (     ㉣   )은/는 경제적 가치보다 공동체의 역할과 사회적 연대를 통해 공동의 이익 을 지향한다.","(   ㉤   )은/는 유엔 해비타트(UN-Habitat)가 주창한 도시 정책의 핵심 비전으로 과거의 도시 발전(Urban Development)이 경제 성장이나 물리적 인프라 확충에만 치중했던 것에서 벗어나, 도시적 권리(Right to the City)라는 인권적 관점으로 패러다임을 전환하자는 선언이 다. 이 개념에서 특히 강조하는 핵심 가치는 (          ㉥   ), 형평성, 지속가능성으로 요약할 수 있 다.","총재생산율이란 한 명의 여성이 가임기간에 출산하게 될 딸의 수를 나타내는 것으로, 합계 출산율에다 총 출생아 중에서 여아가 차지하는 비중을 곱해서 구한다. 한편 (                ㉦     )은/는 가임 여성 인구에 대한 0~4세 아동인구의 비를 의미한다.","(   ㉧   )(이)란 과거 숙제로 이루어졌던 과제들을 교실에서 수행하는 것으로 교실 안에서 의 상호작용을 기반으로 한 집단학습과 교실 밖에서 컴퓨터를 기반으로 한 개별 교수와 같은 두 가지 방법으로 구성된 교수학습 방법을 지칭한다.","지리학자 로웬덜(D. Lowenthal)은 인간 개인이 가지고 있는 환경적 신념, 선호, 동기의 본 질과 기원에 관해 천착하였고, 인간 각자가 개인화한 환경적 지식과 가치를 (                ㉨    )(이)라 고 하였다.","오수벨(Ausubel)이 (   ㉩   )을/를 주장하게 된 배경은 브루너(Bruner)가 주장한 (       ㉪ )이/가 귀납적 추리를 강조하였지만, 실제 수업에서는 많이 문제점이 발생하였기 때문이다. 오 수벨은 학습이 개념이나 원리에서 출발하여 구체적 사례로 나아가는 연역적 추리에 의해 이해 되는 것으로 보았다.","운송비는 운반에 대한 물리적 비용을 뜻하며, (               ㉫   )은/는 재화를 사용자에게 전달하는 과정에서 발생하는 모든 비용을 말한다. 그래서 운송비 감소는 (                 ㉫   )의 궁극적인 감소로 이어지지 않는다.","이탈리아의 (      ㉬     )은/는 알프스 이남의 이탈리아 북부 평원 일대로, 밀라노를 주도로 하는 롬바르디아와 베네치아를 주도로 하는 베네토 지역이 해당된다. 이 지역 주민들이 자신 들이 낸 세금이 가난한 남부 지역 개발에 쓰인다며, 1990년대부터 분리 독립 운동이 시작되었 는데 이를 (     ㉬    ) 운동이라고 부른다.","‘텍스트로서의 경관’은 문학이론을 명시적으로 받아들여 텍스트 공동체, (                ㉭   )와/과 같은 개념을 토대로 수립된 경관의 재현 이론으로 텍스트 공동체는 어떤 텍스트에 대한 이해 를 공유하는 사람들의 집단을 말하며, (           ㉭   )은/는 어떤 텍스트의 맥락이 또 다른 텍스트 가 될 수 있음을 말한다."],"a":{"㉠":"로프트리빙(loft living)","㉡":"아트워싱(art washing)","㉢":"도시 회복력(resilience)","㉣":"공유도시(sharing city)","㉤":"모두를 위한 도시(city for all)","㉥":"포용성(inclusivity)","㉦":"모아비(child-woman ratio)","㉧":"플립트 러닝(Flipped Learning)","㉨":"사적 지리(personal geography)","㉩":"유의미 수용학습(meaningful reception learning)","㉪":"발견학습(discovery learning)","㉫":"거래비용(trade cost)","㉬":"파다니아(Padania)","㉭":"상호텍스트성(Intertextuality)"},"e":"해빈의 경사는 1차적으로 입자 크기에 따른 안식각에 의해 결정되지만, 입자 크기는 투수성 과 백워시에도 영향을 미친다. 입자 크기와 투수성, 백워시 및 해빈 경사의 관계에 대해 설명 하시오.","ea":"입자 크기가 큰 퇴적물은 높은 투수성을 가지게 되므로 백워시 작용이 효과적이지 않아 해빈 경사를 증가시킨다."},"41":{"q":["(    ㉠   )은/는 온실기체에 의한 지구 온난화처럼 특정 물질이나 현상이 기온을 상승시키 거나 하강시켜 기후를 변화시키는 능력을 말한다.","대기과학의 다양한 영역 중에서 (              ㉡   ) 기상학은 날씨예보를 위한 학문이다. (          ㉡ )(이)란 의미는 날씨를 예측하기 위하여 다양한 종류의 기상관측자료를 종합하는 과정이다.","(    ㉢   )은/는 지구 중력 등의 영향으로 기준 타원체와 지구 사이의 차이를 설명할 수 있 는 지구모델로서 지도학이나 GIS보다는 측지학에서 주로 사용된다.","상승하고 하강하는 대기가 건조단열률로 변화하게 되면 (                   ㉣   )은/는 보존된다.","(    ㉤   )의 3대 표준 기준은 해발 고도 0미터, 섭씨 0도, 위도 45도의 중력이다.","대기 안정도는 기온 감률과 (           ㉥    )을/를 비교하여 판단할 수 있는데, 상승하는 공기 덩 어리의 온도가 주위의 기온보다 낮은 고도에서는 (                    ㉦   )하고, 주위의 기온보다 높은 고도 에서는 (       ㉧    )하다. (㉦과 ㉧에는 안정 또는 불안정 중에서 선택해 쓰세요^^)","최근의 클러스터 정책은 지역혁신체계와 학습지역의 구축으로 제도적 밀집에 기반한 지식 과 혁신의 창출과 확산이 지역의 경쟁우위의 근원이 되는 지역의 (                     ㉨   ) 발전론에 근거하 고 있다.","(    ㉩   )은/는 고정비용과 달리 이미 지출되어 절대 회수할 수 없는 비용으로, 이것을 고 려하게 되면 합리적인 의사결정을 할 수 없게 된다.","공유경제(sharing economy), 긱경제(gig economy)의 성장으로 장소와 밀착되지 않은 원 격화된 플랫폼 노동 형태인 (          ㉪       ) 근무도 폭발적으로 늘어나고 있다. (       ㉪     ) 근무는 클라우드 일자리(cloudwork)로 불리기도 한다.","오프쇼링과 달리 (       ㉫   )은/는 경제발전 수준이 비슷한 인접 국가에 생산 및 서비스 시 설을 재입지시키는 전략이다.","로젠스타인(Rosenstein)에 의해 이론화된 (           ㉬   ) 모델은 제2차 세계대전 이후 개발도 상국의 발전 모델로서 인기를 얻었는데, (                ㉬   ) 모델의 기본 아이디어는 교통, 통신, 에너 지 등 핵심 인프라에 대한 투자를 통해 산업화와 균형성장의 유도이다. 1960~1970년대 한국 의 산업화 프로그램도 이에 해당한다.","(   ㉭       )(이)란 위계적인 관료제를 통해 정부가 경제와 사회를 직접적으로 통제하는 것 에서 벗어나 다양한 비정부 조직을 통해 간접적으로 통제하는 것을 의미하는 신조어로 Publc Management와 동의어로 간주되기도 한다."],"a":{"㉠":"복사강제력(radiative forcing)","㉡":"종관(synoptic)","㉢":"지오이드(geoid)","㉣":"온위(Potential Temperature)","㉤":"해면경정(reduction to sea level)","㉥":"단열 감률(adiabatic lapse rate)","㉦":"안정(stable)","㉧":"불안정(unstable)","㉨":"내생적(endogenous)","㉩":"매몰비용(sunk cost)","㉪":"크라우드(crowd)","㉫":"니어쇼링(near shoring)","㉬":"빅푸시(Big push)","㉭":"거버넌스(governance)"},"e":"쾨펜의 기후구분을 따를 때, 연평균 기온이 15℃, 최난월 기온 20℃, 최한월 기온 10℃, 연강 수량 450mm인 지역의 기후형을 3차까지 쓰시오.","ea":"하계 강수가 집중되는 지역은 BSk, 동계 강수가 집중되는 지역은 Csb, 그렇지 않으면 Cfb 기 후에 해당한다."},"42":{"q":["GPN의 기업 전략 유형 중에서 기업 간 통제 전략은 GVC에서 (                   ㉠       ) 거버넌스에 해당 하고, 기업 간 파트너십 전략은 GVC에서 (             ㉡       ) 거버넌스와 유사하다.","하나의 교통수단에서 다른 교통수단으로 화물의 수송 방식이 변화는 지점을 (                           ㉢   )(이) 라고 한다.","(   ㉣   )은/는 도시 내부와 이를 둘러싼 교외거주 및 업무 지역 그리고 이를 연결하는 순 환도로로 구성된 북아메리카 도시지역 모델이다.","(   ㉤   )은/는 모국어가 서로 다른 사람들끼리 교역하는 가운데 서로 이해할 수 있으며 흔하게 사용하는 언어를 의미한다.","(   ㉥   )은/는 등록상표 혹은 지적재산권을 소유한 다국적 기업이 설정한 가이드라인과 요구사항을 준수한다는 조건 하에서 독점판매업자로 하여금 상표와 재산권을 사용하도록 허용 하는 조직형태를 말하다.","(   ㉦   )(이)란 국가가 자율성을 가지고 핵심기구를 통해 경제계획을 수립하고 재정을 통 제하면서 산업정책을 실시하여 자원의 동원과 배분을 조정하는 국가라고 정의할 수 있다.","(   ㉧   )은/는 이베리아 남단에 위치한 영국의 월경지로 주민들의 대다수는 영국 본토에 서 온 이주민이 아닌 여러 민족 집단으로 이루어져 있다. 반면, (                          ㉨     )와/과 멜리야 (Melilla)는 모로코 영토에 둘러싸인 스페인의 월경지이다.","부동산 에이전트들이 특정 인종 또는 소수민족 집단을 대상으로 관행적으로 하는 (                             ㉩ )에는 스티어링과 블록버스팅이 있다.","(   ㉪   ) 도법과 (   ㉫   ) 도법은 모두 중앙 경선의 길이가 적도 길이의 절반이며, 위선 은 적도에 평행한 직선이다. 그런데 (           ㉪     ) 도법은 중앙 경선 외에는 반원이나 반타원이 며, 위선간의 간격도 등간격이 아니다. 반면, (               ㉫    ) 도법은 중앙 경선 이외의 경선이 싸인 (sine)곡선이며 위선간의 간격은 등간격이다.","위도별 연평균 기온은 (        ㉬   )반구가 (       ㉭    )반구보다 높다."],"a":{"㉠":"전속형(captive)","㉡":"관계형(relational)","㉢":"적환지(break of bulk point)","㉣":"주변부 모델(perioheral model)","㉤":"링구아프랑카(lingua franca)","㉥":"프랜차이징(Franchising)","㉦":"발전주의 국가(developmental state)","㉧":"지브롤터(Gibraltar)","㉨":"세우타(Ceuta)","㉩":"주택차별(housing discrimination)","㉪":"몰바이데(Mollweide)","㉫":"상송(시뉴소이드, sinusoidal)","㉬":"북","㉭":"남"},"e":"OEM과 ODM 제조방식에서 하청업체의 역할을 비교하시오.","ea":"OEM 제조방식에서는 하청업체가 생산만을 담당하지만, ODM 제조방식에서는 하청업체가 제 품 개발 및 설계와 생산을 모두 담당한다."},"43":{"q":["국가의 특수 형상 중에서 다른 나라를 완벽하게 에워싼 나라를 ( ㉠ )(이)라 한다. 가장 좋 은 사례는 남아프리카공화국으로, 이 나라는 레소토를 완전히 둘러싸고 있다. 반면, 레소토처 럼 다른 나라에게 완전히 포위된 나라는 ( ㉡ )(이)라고 한다.","오늘날의 정치지도상에는 팽창주의의 유산으로서 기묘한 윤곽을 나타내는 지대가 꽤 남아 있다. 이러한 기묘한 모양의 땅덩어리는 과거 제국주의 국가의 팽창이 한창 성할 때, 그들의 영토팽창 수단으로 채택된 ( ㉢ ) 지대로, 핑거와 팬핸들, 회랑 등이 있다.","( ㉣ ) 현상이란 하루에 두 차례 만조와 간조가 일어나는 조석 현상으로 극 지방을 제외한 대부분의 지역에서 나타난다.","하도를 넘치는 순간에 하도를 채운 유수를 ( ㉤ )(이)라고 한다.","물로 포화된 물질은 바람에 의해 잘 침식되지 않는데, 공극수에 의한 ( ㉥ )이/가 바람에 의한 양력에 저항하기 때문이다.","( ㉦ )은/는 영구동토 내부와 밑 또는 영구동토 위에도 나타나는 불규칙한 모양의 미동결토 이다.","인구성장이란 경제발전이 진행됨에 따라 자발적인 수정과정을 겪게 되므로 우선 경제발전 을 일으키는 것이 인구문제를 해결하는 최선책이라는 주장에 대해 타이텔바움(Teitelbaum)은 회의적인 질문을 하였다. 첫째는 출생률의 감소를 가져올 수 있는 만족할 만한 수준까지 경제 발전을 이룩할 수 있느냐는 ( ㉧ )에 관한 질문이다. 두 번째는 개발도상국가들의 경우 급격히 감소되는 사망률을 능가할 수 있을 만큼 급속한 출생률의 감소가 적절한 시기에 일어날 수 있 겠는가라는 적시성(timeliness)의 문제를 제기하였다.","디킨슨(R.E.Dickinson)은 3지대 이론에서 중앙지대가 고밀도의 공간으로 형성되어 있으며, 가로망이 협소하고 ( ㉨ )의 흔적을 발견할 수 있다고 하였다.","개발 도상국이 일정 기간에 산업화를 달성하는 전략은 ( ㉩ )와/과 수출 지향 전략이다. ( ㉩ ) 산업화 전략은 자국 산업을 보호하기 위한 무역 정책, 과도 평가된 환율 정책 등으로 이 어지게 마련이다.","지오이드(geoid)는 ( ㉪ )의 개념을 확장한 것으로 중력 가속도를 측정할 때의 기준면이 된다. 육지에서는 지오이드가 지구타원체보다 위에 있으면 대양에서는 지오이드가 지구타원체 보다 아래에 있다.","지질적인 단층선은 ( ㉫ )을/를 형성하여, 일반적으로 침식에 대한 저항성이 약한 장소를 만들게 된다. 이와 같은 곳은 침식력이 강하게 작용하므로 단층선에 따라 곡(谷)을 생기게 하 는데, 이처럼 차별침식에 기인한 곡을 단층선곡(斷層線谷, Fault Line Valley)이라 한다. 단층 선곡을 흐르는 하천은 ( ㉬ )에 해당한다.","하안단구의 역층에서는 자갈이 경사진 상태로 포개져 퇴적된 ( ㉭ )이/가 나타나는데, 이 를 통해 과거 하천의 유향을 추정할 수 있다."],"a":{"㉠":"천공국 또는 관통국(perforated state)","㉡":"엔클레이브(enclave) 또는 피포국(encapsulated state)","㉢":"촉수(proruption)","㉣":"반일주조(semidiurnal tide)","㉤":"홍수유량(bankfull flow)","㉥":"표면장력(surface tension) 또는 응집력","㉦":"탈리크(talik)","㉧":"충족성(sufficiency)","㉨":"보행도시(walking city)","㉩":"수입 대체(import substitution)","㉪":"평균해수면(mean sea level)","㉫":"파쇄대(Shattered Zone)","㉬":"적종하(Subsequent Stream)","㉭":"복와구조(imbrication)"},"e":"‘관세동맹’과 ‘공동시장’의 핵심적인 특징을 설명하시오.","ea":"관세동맹은 비회원국에 대한 일반적인 외부무역정책을 공동 수립하는 경제통합체이고, 공동시 장은 회원국 간의 생산 요소의 이동이 자유로운 경제통합체이다."},"44":{"q":["문화이론가들은 지난 세기 동안 소비 공간이 구조 조정과 변화를 겪은 일련의 방식, 다시 말해 특정 공간이 소비를 위한 중심지로 재편되고 소비를 촉진하기 위해 특별히 설계되어온 방식을 설명하려고 시도해 왔다. 패터슨(M.Paterson)
